<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Fábrica de los Paisajes · Ciencias Sociales 5.º</title>
<meta name="author" content="NietooteiN">
<meta name="description" content="Cuidamos nuestro entorno natural: relieve, archipiélagos, costas, ríos y paisajes protegidos de España, con mapas interactivos. Quinto de primaria, Comunidad de Madrid.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#fff8ef;--bg2:#f7eee6;--paper:#ffffff;--ink:#2b2346;--muted:#655d88;--line:#e6dcf5;
  --rosa:#ffb3d4;--rosa2:#ff7fb2;--lila:#cdb8ff;--lila2:#8a4f2c;--choco:#5a3220;--gold2:#d9a400;--agua:#9ff0e2;--agua2:#1fa58f;--crema:#fff1d6;
  --ok:#1f9e6c;--okbg:#e2f8ee;--ko:#d93d5e;--kobg:#ffe6ec;--gold:#ffc93c;--warnbg:#fff3d1;
  --display:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100vh;font-family:var(--body);font-weight:700;color:var(--ink);font-size:17px;line-height:1.5;
  background:radial-gradient(circle at 8% 12%,rgba(255,179,212,.35) 0,transparent 28%),radial-gradient(circle at 92% 6%,rgba(159,240,226,.45) 0,transparent 30%),radial-gradient(circle at 80% 90%,rgba(205,184,255,.35) 0,transparent 32%),var(--bg);background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lila2);outline-offset:3px;border-radius:10px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.15;margin:0 0 .3em}
h1{font-size:clamp(1.6rem,4.4vw,2.4rem)}
h2{font-size:clamp(1.35rem,3.4vw,1.8rem)}
h3{margin:.2em 0;font-weight:900}
p{margin:.4em 0}
.lead{color:var(--muted);max-width:64ch}
.note{color:var(--muted);font-size:.9rem}
.center{text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.nb{font-variant-numeric:tabular-nums;color:var(--lila2);font-weight:900;white-space:nowrap}

/* cabecera */
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,239,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.15rem;margin-right:auto}
.brand .bi{width:36px;height:36px;display:inline-block}.brand svg{width:100%;height:100%}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 12px 2px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.pill span:first-child{width:26px;height:26px;display:inline-block}.pill svg{width:100%;height:100%}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.icon-btn{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800;font-size:.92rem}
.icon-btn:hover{border-color:var(--lila)}
main{max-width:1080px;margin:0 auto;padding:18px 14px 50px}

/* botones */
.btn{background:var(--lila2);color:#fff;border:0;border-radius:14px;padding:11px 20px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #56301a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #56301a}
.btn:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.danger{background:var(--ko);box-shadow:0 4px 0 #94233c}
.btn.sm{padding:7px 14px;font-size:.92rem;border-radius:11px}
.linkb{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:4px}

/* bienvenida */
.welcome{text-align:center;padding:16px 6px 6px;display:flex;flex-direction:column;align-items:center}
.w-scene{width:min(420px,90vw);margin-bottom:6px}.w-scene svg{width:100%;display:block}
@media (prefers-reduced-motion:no-preference){.floaty{animation:float 4s ease-in-out infinite}}
@keyframes float{50%{translate:0 -7px}}
.welcome h1{font-size:clamp(2rem,6.5vw,3.2rem);color:var(--lila2);text-shadow:0 3px 0 var(--gold)}
.namebox{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;margin:14px auto 6px;max-width:520px;width:100%;box-shadow:0 8px 0 var(--line)}
.namebox>label{display:block;font-family:var(--display);font-size:1.35rem;margin-bottom:8px}
.nrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.nrow input{flex:1 1 200px;min-width:0;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.1rem}
.gen{border:0;padding:0;margin:14px 0 0;min-width:0}
.gen legend{font-family:var(--display);font-size:1.2rem;margin:0 auto 8px;padding:0}
.gen-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gen-row label{position:relative;cursor:pointer;display:inline-block}
.gen-row input{position:absolute;opacity:0;width:1px;height:1px}
.gen-row span{display:inline-block;padding:8px 20px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-weight:900}
.gen-row input:checked+span{background:var(--lila2);color:#fff;border-color:var(--lila2)}
.gen-row input:focus-visible+span{outline:3px solid var(--lila2);outline-offset:2px}

/* mapa del laboratorio */
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:stretch;background:linear-gradient(180deg,#fff 0,#fff 72%,var(--crema) 72%);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 0 var(--line)}
.bench .speech{align-self:center}
.bench-art svg{width:100%;height:auto;display:block}
@media (max-width:640px){.bench{grid-template-columns:1fr}.bench-art{max-width:200px;margin:0 auto}}
.speech{background:var(--bg2);border:2px solid var(--lila);border-radius:18px;padding:12px 16px;position:relative}
.speech b{color:var(--lila2)}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.slide{display:flex;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px;position:relative;box-shadow:0 5px 0 var(--line)}
.slide.boss{background:linear-gradient(135deg,#fff7d1,#ffe9a8 60%,#fff2c7);border-color:var(--gold)}
.slide.locked{opacity:.8}
.lens{flex:0 0 84px;height:84px;border-radius:50%;background:#fff1d6;border:6px solid #5a3220;overflow:hidden;position:relative}
.lens svg{width:100%;height:100%;display:block}
.lens.dim svg{filter:blur(5px) grayscale(.4);opacity:.7}
.lens .lk{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(43,35,70,.45)}
.lens .lk svg{width:40%;height:40%;filter:none;opacity:1}
.s-body{flex:1;min-width:0}
.s-num{font-size:.8rem;color:var(--muted);font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.s-body h3{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0;line-height:1.2}
.s-body p{margin:.15em 0;color:var(--muted);font-size:.9rem}
.s-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stars{display:flex;gap:2px}.stars svg{width:22px}
.left{font-size:.78rem;color:var(--muted);font-weight:800}
svg.on path{fill:var(--gold);stroke:#9b6b00;stroke-width:1.2}svg.off path{fill:#efe9f7;stroke:#cfc4e4;stroke-width:1.2}

/* juego */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.ph-l{display:flex;align-items:center;gap:10px;min-width:0}.ph-ico{width:54px;height:54px;flex:0 0 54px;border-radius:50%;border:4px solid #5a3220;overflow:hidden;background:#fff1d6}.ph-ico svg{width:100%;height:100%;display:block}
.playhead h1{font-size:clamp(1.2rem,3.2vw,1.7rem);margin:0}.playhead p{margin:0;color:var(--muted);font-size:.92rem}
.streak{display:inline-block;margin-left:8px;background:var(--crema);border:2px solid var(--gold);border-radius:999px;padding:0 9px;font-size:.82rem;color:#7a5200}
.hearts{display:flex;gap:3px}.hearts svg{width:30px}.hearts svg.on path{fill:var(--rosa2);stroke:#a3275a}.hearts svg.off path{fill:#efe9f7;stroke:#cfc4e4}
.prog{display:flex;gap:5px;margin:6px 0 12px;flex-wrap:wrap}
.pp{width:clamp(22px,5vw,30px);height:clamp(22px,5vw,30px);border-radius:50%;border:3px solid var(--line);background:var(--paper)}
.pp.cur{border-color:var(--lila2);box-shadow:0 0 0 3px var(--lila)}
.pp.ok{background:var(--agua2);border-color:var(--agua2)}.pp.ko{background:var(--rosa2);border-color:var(--rosa2)}
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 0 var(--line)}
.qk{display:inline-block;margin:0 0 8px;background:var(--bg2);color:var(--lila2);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:900}
.qq{font-size:1.1rem;margin-bottom:12px}
.qq i{color:var(--lila2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:800;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--lila)}
.opt .bx{flex:0 0 22px;height:22px;border-radius:50%;border:3px solid var(--lila);margin-top:2px;background:#fff}
.multi .opt .bx{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--lila2);background:var(--bg2)}
.opt[aria-checked="true"] .bx{background:var(--lila2);border-color:var(--lila2);box-shadow:inset 0 0 0 3px #fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .bx{border-color:var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--kobg)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt:disabled{cursor:default}

/* clasificar */
.cls{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.crow .it{flex:1 1 180px;font-weight:900}
.crow .bins{display:flex;gap:6px;flex-wrap:wrap}
.bin{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800;font-size:.9rem}
.bin[aria-pressed="true"]{background:var(--lila2);border-color:var(--lila2);color:#fff}
.crow.right{border-color:var(--ok);background:var(--okbg)}.crow.wrong{border-color:var(--ko);background:var(--kobg)}
.crow .sol{flex-basis:100%;font-size:.88rem;color:var(--ko)}
.bin:disabled{cursor:default}

/* ordenar */
.ordw{display:grid;gap:10px}
.ord-src,.ord-dst{display:flex;flex-direction:column;gap:6px;min-height:46px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:8px}
.ord-dst{border-style:solid;background:#fff}
.ord-lab{font-size:.85rem;color:var(--muted);font-weight:900;margin:2px 0}
.chip{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:800;display:flex;gap:10px;align-items:center}
.ord-dst .chip{background:var(--bg2);border-color:var(--lila)}
.chip .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--lila2);color:#fff;display:grid;place-items:center;font-size:.85rem}
.chip.right{border-color:var(--ok);background:var(--okbg)}.chip.wrong{border-color:var(--ko);background:var(--kobg)}
.chip:disabled{cursor:default}
.ord-empty{color:var(--muted);font-size:.9rem;padding:6px}

/* rotular */
.lblw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:640px){.lblw{grid-template-columns:1fr}}
.lblart{background:#f7fbff;border:2px solid var(--line);border-radius:18px;padding:6px}
.lblart svg{width:100%;height:auto;display:block}
.lblsel{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 10px;flex-wrap:wrap}
.lrow .n{flex:0 0 28px;height:28px;border-radius:50%;background:#3d3557;color:#fff;display:grid;place-items:center;font-weight:900}
.lrow select{flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800}
.lrow.right{border-color:var(--ok);background:var(--okbg)}.lrow.wrong{border-color:var(--ko);background:var(--kobg)}
.lrow .sol{flex-basis:100%;font-size:.88rem;color:var(--ko);padding-left:38px}

/* microscopio */
.micw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:12px}
@media (max-width:640px){.micw{grid-template-columns:1fr;justify-items:center}}
.eyepiece{width:min(240px,64vw);aspect-ratio:1;border-radius:50%;background:#1e1a30;padding:14px;box-shadow:0 0 0 6px #3d3557,0 10px 0 6px #2a2440;position:relative}
.eyepiece .view{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#eef9f6;position:relative}
.eyepiece .view svg{width:100%;height:100%;display:block;transition:filter .12s}
.eyepiece .view::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 30px 12px rgba(30,26,48,.55);pointer-events:none}
.eyepiece .zoom{position:absolute;right:-6px;bottom:-6px;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:.85rem;box-shadow:0 3px 0 #b88600}
.focus{width:100%;max-width:340px}
.focus label{display:block;font-weight:900;margin-bottom:4px}
.focus input[type=range]{width:100%;accent-color:var(--lila2);height:30px}
.fstate{font-size:.9rem;color:var(--muted);min-height:1.5em}
.fstate.ok{color:var(--ok)}
.micq{font-size:1.05rem}

/* número */
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow label{font-weight:900}
.numin{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.15rem;width:12ch;font-variant-numeric:tabular-nums}
.numin.right{border-color:var(--ok);background:var(--okbg)}.numin.wrong{border-color:var(--ko);background:var(--kobg)}
.numrow .sol{flex-basis:100%;color:var(--ko);font-size:.92rem}
.sol:empty{display:none}
.btn[aria-disabled="true"]{filter:grayscale(.7);opacity:.6}
.icon-btn svg{width:20px;height:20px;display:block}
@media (max-width:560px){.brand span:last-child{display:none}.icon-btn{padding:3px 9px;font-size:.86rem}.top-in{gap:6px}}
@media (max-width:420px){.brand .bi{display:none}.top-in{padding:8px 10px}.pill{padding:2px 10px 2px 4px}}

/* gráfico */
.chart{max-width:520px;margin:6px auto 12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px}
.chart svg{width:100%;height:auto;display:block}

/* pistas y respuestas */
.hintbox{margin-top:12px;background:var(--warnbg);border:2px solid var(--gold);border-radius:14px;padding:10px 14px}
.fb{margin-top:14px;border-radius:16px;display:flex;gap:12px;align-items:flex-start}
.fb:empty{display:none}
.fb.good,.fb.bad,.fb.warn{padding:12px 14px}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--kobg);border:2px solid var(--ko)}
.fb.warn{background:var(--warnbg);border:2px solid var(--gold)}
.fb .pip{flex:0 0 58px}.fb .pip svg{width:100%;display:block}
.fbt{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 4px}
.exp{font-size:.98rem}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* capas */
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,35,70,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.ov-card{background:var(--paper);border-radius:24px;padding:22px;max-width:560px;width:100%;box-shadow:0 14px 0 rgba(0,0,0,.15);text-align:center;max-height:calc(100vh - 32px);overflow:auto}
.ov-card.wide{max-width:860px;text-align:left}
.big-stars{display:flex;gap:6px;justify-content:center;margin:8px 0}.big-stars svg{width:56px}
.gain{color:var(--lila2)}
.disc-art{width:170px;height:170px;margin:0 auto 8px;border-radius:50%;border:8px solid #5a3220;overflow:hidden;background:#fff1d6}
.disc-art svg{width:100%;height:100%;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:8px 0}
.tab{flex:0 0 auto;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:900}
.tab[aria-selected="true"]{background:var(--lila2);border-color:var(--lila2);color:#fff}
.bookc h3{font-family:var(--display);font-weight:600;color:var(--lila2);margin-top:14px}
.bookc .eq{background:var(--bg2);border-radius:12px;padding:8px 12px}
.tblw{overflow-x:auto}
.bookc table{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}
.bookc th,.bookc td{border:2px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.bookc th{background:var(--bg2)}

/* atlas */
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:12px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:center;box-shadow:0 5px 0 var(--line)}
.card .disc-art{width:120px;height:120px;border-width:6px}
.card.sil .disc-art svg{filter:blur(7px) grayscale(1);opacity:.5}
.card h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:4px 0}
.card .tag{display:inline-block;background:var(--agua);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:900;margin-bottom:4px}
.card p{font-size:.9rem;color:var(--muted);margin:.2em 0;text-align:left}

/* carnet */
.carnet{border:5px solid var(--gold);border-radius:22px;padding:18px;background:linear-gradient(135deg,#fff6c9,#ffe27a 45%,#fff3c4);text-align:center;box-shadow:inset 0 0 0 3px #fff}
.carnet h2{color:var(--lila2)}
.carnet .who{font-family:var(--display);font-size:2rem;margin:4px 0}
.carnet .pipc{width:110px;margin:0 auto}
@media print{body *{visibility:hidden}.carnet,.carnet *{visibility:visible}.carnet{position:absolute;left:0;top:0;width:100%}}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast:empty{display:none}
#toast{visibility:hidden}
#toast.on{transform:translate(-50%,0);visibility:visible}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.credit{text-align:center;color:var(--muted);font-size:.85rem;padding:0 14px 20px}
.credit a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* mapas */
.mapw{background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px;margin:4px 0 10px;position:relative}
.map{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.map.tap{cursor:crosshair}
.map text{font-family:Nunito,'Segoe UI',sans-serif;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.map .pu{cursor:pointer}
.map .mk text{stroke:none;fill:#fff;font-size:15px}

function unitClass(k){if(k==='meseta')return 'meseta';if(GP.dep[k])return 'dep';return GP.ranges[k].cl}
function unitName(k){if(k==='meseta')return 'Meseta Central';if(GP.dep[k])return GP.dep[k].n;return GP.ranges[k].n}

/* lectura de trazados "M x y L x y ..." en segmentos */
const _segCache={};
function pathPts(d){if(_segCache[d])return _segCache[d];const parts=[];d.split('M').forEach(s=>{s=s.trim();if(!s)return;const closed=/Z$/.test(s);const pts=s.replace(/Z/g,'').split('L').map(t=>t.trim().split(/\s+/).map(Number));if(closed)pts.push(pts[0]);parts.push(pts)});return _segCache[d]=parts}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));const x=ax+t*dx,y=ay+t*dy;return Math.hypot(px-x,py-y)}
function distPath(d,x,y){let m=1e9;pathPts(d).forEach(p=>{for(let i=1;i<p.length;i++)m=Math.min(m,distSeg(x,y,p[i-1][0],p[i-1][1],p[i][0],p[i][1]));if(p.length===1)m=Math.min(m,Math.hypot(x-p[0][0],y-p[0][1]))});return m}
function pathAt(d,f){const p=pathPts(d).reduce((a,b)=>b.length>a.length?b:a,[]);let L=0;const ls=[];for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);ls.push(l);L+=l}let t=L*f;for(let i=1;i<p.length;i++){if(t<=ls[i-1]){const r=ls[i-1]?t/ls[i-1]:0;return [p[i-1][0]+(p[i][0]-p[i-1][0])*r,p[i-1][1]+(p[i][1]-p[i-1][1])*r]}t-=ls[i-1]}return p[p.length-1]||[0,0]}
function centroid(d){const p=pathPts(d)[0];let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1]});return [x/p.length,y/p.length]}

/* posición de rótulos y números */
const RIVF={Ebro:.55,Tajo:.45,Duero:.5,Guadiana:.4,Guadalquivir:.5,Miño:.55,Júcar:.4,Segura:.55,Turia:.45,Llobregat:.6,Nalón:.75,Narcea:.45,Navia:.5,Bidasoa:.5,Nervión:.6,Sella:.6};
const RNGF={galaico:.5,leon:.5,cantabrica:.42,vascos:.5,pirineos:.5,costero:.5,iberico:.5,central:.32,toledo:.5,morena:.5,beticos:.45};
function anchor(t){
 const [ty,k]=t.split(':');
 if(ty==='pt')return GP.pts[k].slice(1);
 if(ty==='cpt')return GEO.C.pts[k].slice(1);
 if(ty==='bpt')return GEO.B.pts[k].slice(1);
 if(ty==='rng')return pathAt(GP.ranges[k].d,RNGF[k]||.5);
 if(ty==='riv')return pathAt(GP.rivers[k],RIVF[k]||.5);
 if(ty==='dep')return centroid(GP.dep[k].d);
 if(ty==='meseta')return [357,224];
 if(ty==='isl')return GP.isl[k];
 if(ty==='cisl')return GEO.C.isl[k].c;
 if(ty==='bisl')return GEO.B.isl[k].c;
 if(ty==='brng')return pathAt(GEO.B.tram,.5);
 if(ty==='bpla')return centroid(GEO.B.pla);
 return [0,0];
}
function tName(t){const [ty,k]=t.split(':');
 if(ty==='pt')return GP.pts[k][0];if(ty==='cpt')return GEO.C.pts[k][0];if(ty==='bpt')return GEO.B.pts[k][0];
 if(ty==='rng'||ty==='dep'||ty==='meseta')return unitName(ty==='meseta'?'meseta':k);
 if(ty==='riv')return 'Río '+k;if(ty==='isl'||ty==='cisl'||ty==='bisl')return k;if(ty==='brng')return 'Sierra de Tramuntana';if(ty==='bpla')return 'Pla de Mallorca';return k}

/* dibujo de un mapa

function mapSVG(vk,o={}){
 const V=GEO[vk];let s=`<svg class="map" viewBox="0 0 ${V.W} ${V.H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${o.aria||'Mapa'}"><rect width="${V.W}" height="${V.H}" fill="#cbe9f7"/>`;
 if(vk==='P'){
  for(const n in V.land)s+=`<path d="${V.land[n]}" fill="#eceae4" stroke="#b8b2a6" stroke-width="1"/>`;
  s+=`<path d="${V.spain}" fill="#fff4d6" stroke="#8a7a62" stroke-width="1.2" stroke-linejoin="round"/>`;
  const [ix,iy,iw,ih]=V.inset;s+=`<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="#cbe9f7" stroke="#5a3220" stroke-width="2"/><path d="${V.canarias}" fill="#fff4d6" stroke="#8a7a62" stroke-width="1"/>`;
  if(!o.noNames)s+=`<g font-size="15" fill="#6b8aa0" font-style="italic"><text x="110" y="410" transform="rotate(-80 110 410)">OCÉANO ATLÁNTICO</text><text x="330" y="22">Mar Cantábrico</text><text x="780" y="560" transform="rotate(-30 780 560)">Mar Mediterráneo</text><text x="${ix+8}" y="${iy+18}" font-size="12">Islas Canarias</text></g><g font-size="13" fill="#9a9284"><text x="30" y="330" transform="rotate(-80 30 330)">PORTUGAL</text><text x="760" y="60">FRANCIA</text><text x="470" y="820">MARRUECOS</text></g>`;
  if(o.relief==='show'||o.relief==='grey'||o.relief==='paint'){
   const act=k=>o.relief==='paint'&&(!o.only||o.only.includes(k));
   const col=k=>o.relief==='show'?RELCOL[unitClass(k)]:(o.fills&&o.fills[k])||(o.relief==='paint'&&!act(k)?'#ece6dc':'#cfc8bc');
   const pc=k=>act(k)?'pu':'';
   s+=`<path class="${pc('meseta')}" data-u="meseta" d="${V.meseta}" fill="${col('meseta')}" fill-opacity="${o.relief==='show'?.65:.9}" stroke="#8a7a62" stroke-width="1.5"/>`;
   for(const k in V.dep)s+=`<path class="${pc(k)}" data-u="${k}" d="${V.dep[k].d}" fill="${col(k)}" fill-opacity="${o.relief==='show'?.6:.9}" stroke="#8a7a62" stroke-width="1.5" stroke-linejoin="round"/>`;
   for(const k in V.ranges)s+=`<path d="${V.ranges[k].d}" fill="none" stroke="#5a3220" stroke-opacity="${o.relief==='paint'&&!act(k)?.12:.35}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="${V.ranges[k].d}" fill="none" stroke="${col(k)}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>${act(k)?`<path class="pu" data-u="${k}" d="${V.ranges[k].d}" fill="none" stroke="transparent" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>`:''}`;
  }
  if(o.coast){for(const k in V.coast){const c=o.coast==='show'?CCOL[COASTTYPE[k]]:(o.fills&&o.fills[k])||'#9a9284';
    s+=`<path d="${V.coast[k]}" fill="none" stroke="${c}" stroke-width="${o.coast==='show'?4:6}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(o.coast==='paint')s+=`<path class="pu" data-u="${k}" d="${V.coast[k]}" fill="none" stroke="transparent" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>`}}
  if(o.rivers||o.riv){for(const k in V.rivers){const c=o.riv==='show'?VCOL[V.vert[k]]:o.riv==='paint'?((o.fills&&o.fills[k])||'#8f8a80'):'#3f8fd2';
    s+=`<path d="${V.rivers[k]}" fill="none" stroke="${c}" stroke-width="${o.riv?3.6:2.2}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(o.riv==='paint'||o.rivHit)s+=`<path class="${o.riv==='paint'?'pu':''}" data-u="${k}" d="${V.rivers[k]}" fill="none" stroke="transparent" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>`}}
  if(o.parks)for(const k in V.pts)if(k.startsWith('pn_')){const [n,x,y]=V.pts[k];s+=`<g><circle cx="${x}" cy="${y}" r="9" fill="#3fbf5f" stroke="#fff" stroke-width="2.5"/><path d="M${x} ${y-5} l4 7 h-8z" fill="#fff"/></g>`}
  if(o.peaks)o.peaks.forEach(k=>{const [n,x,y]=V.pts[k];s+=`<path d="M${x} ${y-8} l7 12 h-14z" fill="#2b2346" stroke="#fff" stroke-width="1.5"/>`});
 }else{
  for(const n in V.isl){const c=o.islFill&&o.islFill[n];s+=`<path d="${V.isl[n].d}" fill="${c||'#fff4d6'}" stroke="#8a7a62" stroke-width="1.5" stroke-linejoin="round"/>`}
  if(vk==='B'){if(o.bRelief){s+=`<path d="${V.pla}" fill="#7ccf6b" fill-opacity=".6"/><path d="${V.tram}" fill="none" stroke="#c98b4a" stroke-width="16" stroke-linecap="round" stroke-opacity=".8"/>`}
   if(!o.noNames)s+=`<g font-size="22" fill="#6b8aa0" font-style="italic"><text x="560" y="560">Mar Mediterráneo</text></g>`}
  if(vk==='C'&&!o.noNames)s+=`<g font-size="22" fill="#6b8aa0" font-style="italic"><text x="380" y="80">OCÉANO ATLÁNTICO</text></g>`;
  if(o.peaks)o.peaks.forEach(k=>{const [n,x,y]=V.pts[k];s+=`<path d="M${x} ${y-10} l9 15 h-18z" fill="#2b2346" stroke="#fff" stroke-width="1.5"/>`});
 }
 s+=`<g class="hl"></g>`;
 (o.labels||[]).forEach(([t,x,y,fs])=>{s+=`<text x="${x}" y="${y}" font-size="${fs||14}" text-anchor="middle" fill="#2b2346">${t}</text>`});
 (o.marks||[]).forEach(([n,x,y])=>{s+=`<g class="mk"><circle cx="${x}" cy="${y}" r="13" fill="#5a3220" stroke="#fff" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle">${n}</text></g>`});
 s+=`<g class="tapl"></g></svg>`;
 return s;
}

function profSVG(k){
 const P=PROF[k];const x0=60,x1=560,y0=90,y1=290;const X=km=>P.dir==='rev'?x1-(km/P.len)*(x1-x0):x0+(km/P.len)*(x1-x0);const Y=h=>y1-(h/P.max)*(y1-y0);
 let s=`<svg viewBox="0 0 640 360" role="img" aria-label="Gráfico del recorrido del ${P.name}: altitud en metros según los kilómetros recorridos desde el nacimiento."><rect width="640" height="360" fill="#fff"/>`;
 [0,500,1000,1500,2000].forEach(h=>{s+=`<line x1="${x0}" x2="${x1}" y1="${Y(h)}" y2="${Y(h)}" stroke="#eee5d8"/><text x="${x0-6}" y="${Y(h)+4}" font-size="11" text-anchor="end" fill="#655d88">${fmtInt(h)}</text>`});
 for(let km=0;km<=P.len;km+=100){s+=`<text x="${X(km)}" y="${y1+16}" font-size="11" text-anchor="middle" fill="#655d88">${km}</text>`}
 const area=`M${X(P.pts[0][0])} ${y1} `+P.pts.map(p=>`L${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ')+` L${X(P.pts[P.pts.length-1][0])} ${y1}Z`;
 s+=`<path d="${area}" fill="#bde39a" stroke="none"/><path d="${P.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#2f80d1" stroke-width="4" stroke-linejoin="round"/>`;
 if(P.border)s+=`<line x1="${X(P.border)}" x2="${X(P.border)}" y1="${y0}" y2="${y1}" stroke="#8a7a62" stroke-dasharray="5 4"/>`;
 (P.cty||[]).forEach(([t,km])=>{s+=`<text x="${X(km)}" y="${y1-8}" font-size="12" font-weight="900" text-anchor="middle" fill="#4f7a2a">${t}</text>`});
 P.pts.forEach(p=>{if(!p[2])return;const x=X(p[0]),y=Y(p[1]);const lab=p[2].replace(/ \(.*\)/,'');s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="#d93d5e" stroke="#fff" stroke-width="1.5"/><text x="${x+4}" y="${y-9}" font-size="11" font-weight="800" fill="#2b2346" transform="rotate(-55 ${x+4} ${y-9})">${lab}</text>`});
 s+=`<line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="#2b2346" stroke-width="2"/><line x1="${x0}" x2="${x0}" y1="${y0-8}" y2="${y1}" stroke="#2b2346" stroke-width="2"/>`;
 s+=`<text x="14" y="${(y0+y1)/2}" font-size="11" fill="#655d88" text-anchor="middle" transform="rotate(-90 14 ${(y0+y1)/2})">Altitud (m)</text><text x="${(x0+x1)/2}" y="${y1+34}" font-size="11" text-anchor="middle" fill="#655d88">Kilómetros recorridos desde el nacimiento</text>`;
 s+=`<text x="${x0+8}" y="${y0+6}" font-size="14" font-weight="900" fill="#2b2346">${P.L}</text><text x="${x1-8}" y="${y0+6}" font-size="14" font-weight="900" text-anchor="end" fill="#2b2346">${P.R}</text>`;
 s+=`<text x="${x1+60}" y="${y1+52}" font-size="10" text-anchor="end" fill="#655d88">Gráfico aproximado, elaborado a partir del libro de texto.</text></svg>`;
 return `<div class="chart" style="max-width:640px">${s}</div>`;
}

 {id:'r01',t:'mc',q:'¿Qué es el <i>relieve</i>?',o:['El conjunto de formas y desigualdades que presenta la superficie de la Tierra','Una cadena de montañas alineadas','Una llanura muy elevada','El agua que recorre un territorio'],exp:'El <b>relieve</b> es el conjunto de formas y desigualdades de la superficie terrestre: montañas, llanuras, valles… En tus esquemas: «forma que presenta la corteza terrestre en su superficie».'},
 {id:'r02',t:'cls',q:'Une cada palabra con su definición.',b:['Relieve','Cordillera','Meseta','Depresión'],items:[['Cadena continua de montañas alineadas entre sí',1],['Gran área de terreno plano, pero elevada a cierta altura sobre el nivel del mar',2],['Terreno llano y bajo, situado entre montañas y por donde suele fluir un río',3],['Conjunto de formas y desigualdades de la superficie de la Tierra',0]],exp:'Son las definiciones de tu ficha de clase: <b>cordillera</b> (montañas alineadas), <b>meseta</b> (llanura elevada), <b>depresión</b> (llano y bajo, con un río) y <b>relieve</b> (todas las formas de la superficie).'},
 {id:'r03',t:'mc',q:'¿Qué es una <i>península</i>?',o:['Un territorio rodeado de agua por todas partes menos por una','Un territorio rodeado de agua por todas partes','Un conjunto de islas','Una llanura elevada en el centro de un país'],exp:'Una <b>península</b> está rodeada de agua por todas partes <b>menos por una</b>, que la une al continente. La península ibérica se une a Europa por los Pirineos.'},
 {id:'r04',t:'mc',q:'¿Qué unidad del relieve <b>organiza</b> todo el relieve de la península?',o:['La Meseta Central','Los Pirineos','La depresión del Ebro','Los Sistemas Béticos'],exp:'El relieve peninsular se organiza en torno a la <b>Meseta Central</b>: unas montañas están dentro de ella, otras la rodean y otras están más alejadas.'},
 {id:'r05',t:'mc',q:'La Meseta Central es…',o:['una extensa llanura elevada que ocupa el centro de la Península','una cadena de montañas en el norte','un terreno llano y bajo junto al mar','un conjunto de islas'],exp:'La <b>Meseta</b> es una extensa <b>llanura elevada</b> que ocupa el <b>centro</b> de la Península.'},
 {id:'r06',t:'mc',q:'¿Qué cadena montañosa divide la Meseta en Submeseta Norte y Submeseta Sur?',o:['El Sistema Central','Los Montes de Toledo','El Sistema Ibérico','Sierra Morena'],exp:'El <b>Sistema Central</b> tiene montañas elevadas y divide la Meseta en la <b>Submeseta Norte</b> y la <b>Submeseta Sur</b>.'},
 {id:'r07',t:'mc',q:'¿Qué sabes de los Montes de Toledo?',o:['Son más bajos que el Sistema Central y están en el centro de la Submeseta Sur','Separan España de Francia','Son la cordillera más alta de la Península','Rodean la Meseta por el norte'],exp:'Los <b>Montes de Toledo</b> son más bajos y están en el centro de la <b>Submeseta Sur</b>. Junto con el Sistema Central, son las cordilleras <b>interiores</b>.'},
 {id:'r08',t:'cls',q:'Clasifica las cordilleras según su posición respecto a la Meseta.',b:['Interior','Rodea la Meseta','Exterior'],items:[['Sistema Central',0],['Montes de Toledo',0],['Montes de León',1],['Cordillera Cantábrica',1],['Sistema Ibérico',1],['Sierra Morena',1],['Pirineos',2],['Sistemas Béticos',2]],exp:'<b>Interiores:</b> Sistema Central y Montes de Toledo. <b>Rodean la Meseta:</b> Montes de León, Cordillera Cantábrica, Sistema Ibérico y Sierra Morena. <b>Exteriores:</b> Macizo Galaico, Montes Vascos, Pirineos, Cordillera Costero-Catalana y Sistemas Béticos.'},
 {id:'r09',t:'cls',q:'Clasifica estas cordilleras.',b:['Interior','Rodea la Meseta','Exterior'],items:[['Macizo Galaico',2],['Montes Vascos',2],['Cordillera Costero-Catalana',2],['Sistema Central',0],['Sierra Morena',1],['Montes de León',1],['Montes de Toledo',0]],exp:'Las cordilleras <b>exteriores</b> están más alejadas de la Meseta: Macizo Galaico, Montes Vascos, Pirineos, Cordillera Costero-Catalana y Sistemas Béticos.'},
 {id:'r10',t:'multi',q:'Marca <b>todas</b> las cordilleras que <b>rodean</b> la Meseta, como si fueran sus bordes.',o:[['Montes de León',true],['Cordillera Cantábrica',true],['Sistema Ibérico',true],['Sierra Morena',true],['Sistema Central',false],['Pirineos',false],['Montes de Toledo',false]],exp:'Los cuatro «bordes» de la Meseta: <b>Montes de León</b> (noroeste), <b>Cordillera Cantábrica</b> (norte), <b>Sistema Ibérico</b> (este) y <b>Sierra Morena</b> (sur).'},
 {id:'r11',t:'multi',q:'Marca <b>todas</b> las cordilleras <b>exteriores</b> (alejadas de la Meseta).',o:[['Macizo Galaico',true],['Montes Vascos',true],['Pirineos',true],['Cordillera Costero-Catalana',true],['Sistemas Béticos',true],['Sierra Morena',false],['Sistema Ibérico',false]],exp:'Son cinco: <b>Macizo Galaico, Montes Vascos, Pirineos, Cordillera Costero-Catalana y Sistemas Béticos</b>.'},
 {id:'r12',t:'mc',q:'¿Qué forma tienen las dos grandes depresiones de la Península?',o:['Triangular','Circular','Alargada como una cordillera','Cuadrada'],exp:'La depresión del Ebro y la del Guadalquivir tienen <b>forma triangular</b>.'},
 {id:'r13',t:'cls',q:'¿De qué depresión se trata?',b:['Depresión del Ebro','Depresión del Guadalquivir'],items:[['Está en el noreste',0],['Está en el suroeste',1],['La recorre un río que desemboca en el Mediterráneo',0],['La recorre un río que desemboca en el Atlántico',1],['Queda entre los Pirineos y el Sistema Ibérico',0],['Queda entre Sierra Morena y los Sistemas Béticos',1]],exp:'La <b>depresión del Ebro</b> está en el <b>noreste</b>, entre Pirineos, Sistema Ibérico y Cordillera Costero-Catalana. La del <b>Guadalquivir</b>, en el <b>suroeste</b>, entre Sierra Morena y los Sistemas Béticos.'},
 {id:'r14',t:'mc',q:'¿Cuál es el pico más alto de la <b>península ibérica</b>?',o:['El Mulhacén, en los Sistemas Béticos (Sierra Nevada)','El Aneto, en los Pirineos','El Teide, en Tenerife','El Almanzor, en el Sistema Central'],exp:'El <b>Mulhacén</b> (3.479 m), en Sierra Nevada (Sistemas Béticos), es el techo de la Península. El Teide es más alto, pero está en Canarias, no en la Península.'},
 {id:'r15',t:'num',q:'¿Cuántos metros mide el <b>Mulhacén</b>?',ans:3479,label:'Metros',exp:'El Mulhacén mide <b>3.479 m</b> (Instituto Geográfico Nacional).'},
 {id:'r16',t:'mc',q:'¿Qué montañas separan España de Francia y de Andorra? ¿Son elevadas?',o:['Los Pirineos; sí: en el mapa tienen colores de más de 2.000 m','Los Montes Vascos; no, son bajos','La Cordillera Cantábrica; sí, muy elevadas','El Sistema Ibérico; no, son llanos'],exp:'Los <b>Pirineos</b> son una frontera natural con Francia y Andorra. Son muy elevados: el <b>Aneto</b> mide 3.404 m.'},
 {id:'r17',t:'mc',q:'En el mapa del relieve, ¿qué indican los colores?',o:['La altitud: el verde son las tierras más bajas y el morado, las más altas','El tipo de rocas','Las comunidades autónomas','Dónde llueve más'],exp:'Los <b>colores</b> representan la <b>altitud</b>: verde para las tierras más bajas y morado para las más altas. Los <b>textos</b> dan los nombres de las formas del relieve.'},
 {id:'r18',t:'ord',q:'Ordena estas cumbres de <b>mayor a menor</b> altitud.',items:['Mulhacén (3.479 m)','Aneto (3.404 m)','Torre Cerredo (2.650 m)','Almanzor (2.591 m)','Moncayo (2.313 m)'],exp:'Mulhacén (Béticos) &gt; Aneto (Pirineos) &gt; Torre Cerredo (Cantábrica) &gt; Almanzor (Sistema Central) &gt; Moncayo (Ibérico).'},
 {id:'r19',t:'cls',q:'Une cada cumbre con su cordillera.',b:['Pirineos','Sistemas Béticos','Sistema Central','Sistema Ibérico','Cordillera Cantábrica','Montes de León'],items:[['Aneto',0],['Mulhacén',1],['Almanzor',2],['Moncayo',3],['Torre Cerredo',4],['Teleno',5]],exp:'Aneto: Pirineos · Mulhacén: Sistemas Béticos · Almanzor: Sistema Central (Gredos) · Moncayo: Sistema Ibérico · Torre Cerredo: Cordillera Cantábrica (Picos de Europa) · Teleno: Montes de León.'},
 {id:'r20',t:'mc',q:'¿Por qué decimos que la Meseta es el elemento que <b>organiza</b> el relieve de la Península?',o:['Porque ocupa el centro y el resto de unidades se sitúan dentro de ella, en sus bordes o alrededor','Porque es la zona más alta de España','Porque por ella pasan todos los ríos','Porque está junto al mar'],exp:'Todo se ordena respecto a la Meseta: cordilleras <b>interiores</b> (dentro), las que la <b>rodean</b> (bordes) y las <b>exteriores</b> y depresiones (fuera).'},
 {id:'r21',t:'cls',q:'¿Verdadero o falso?',b:VF,items:[['Las depresiones son terrenos llanos y bajos recorridos por un río',0],['La Meseta está en el norte de la Península',1],['Los Montes de Toledo son más altos que el Sistema Central',1],['Los Pirineos son una cordillera exterior',0],['Sierra Morena rodea la Meseta por el sur',0],['El pico más alto de la Península está en los Pirineos',1]],exp:'La Meseta ocupa el <b>centro</b>. Los Montes de Toledo son <b>más bajos</b>. El pico más alto de la Península, el Mulhacén, está en los <b>Sistemas Béticos</b>.'},
 {id:'r22',t:'mc',q:'Viajas de Madrid a Sevilla. Sales de la Submeseta Sur y llegas a la depresión del Guadalquivir. ¿Qué cordillera cruzas?',o:['Sierra Morena','Los Pirineos','La Cordillera Cantábrica','El Sistema Ibérico'],exp:'<b>Sierra Morena</b> es el borde sur de la Meseta y la separa de la depresión del Guadalquivir.',hint:'¿Qué cordillera rodea la Meseta por el sur?'},
 {id:'r23',t:'mc',q:'Viajas de Madrid a Segovia, en la Submeseta Norte. ¿Qué cordillera tienes que atravesar?',o:['El Sistema Central','Los Montes de Toledo','Sierra Morena','Los Sistemas Béticos'],exp:'El <b>Sistema Central</b> separa las dos submesetas. Madrid está en la Submeseta Sur y Segovia, en la Norte.'},
 {id:'r24',t:'mc',q:'¿Qué altitud tiene la mayor parte de la Meseta, según el mapa del relieve?',o:['Entre 400 y 1.000 metros','Menos de 100 metros','Más de 2.000 metros','Está por debajo del nivel del mar'],exp:'La Meseta es una llanura <b>elevada</b>: en el mapa aparece en amarillo y naranja claro, entre <b>400 y 1.000 m</b>. La depresión del Ebro, en cambio, es mucho más baja.'},
 {id:'r25',t:'cls',q:'Según tus esquemas de clase, el relieve peninsular se organiza en <b>tres niveles</b>. ¿En qué nivel está cada unidad?',b:['Primer nivel','Segundo nivel','Tercer nivel'],items:[['Meseta Central',0],['Sistema Central',0],['Montes de Toledo',0],['Cordillera Cantábrica',1],['Sierra Morena',1],['Pirineos',2],['Depresión del Ebro',2],['Sistemas Béticos',2]],exp:'<b>Primer nivel:</b> la Meseta (Submeseta Norte y Sur), el Sistema Central y los Montes de Toledo. <b>Segundo nivel:</b> Montes de León, Cordillera Cantábrica, Sistema Ibérico y Sierra Morena. <b>Tercer nivel:</b> Macizo Galaico, Montes Vascos, Pirineos, Sistema Costero-Catalán, Sistemas Béticos y las depresiones del Ebro y del Guadalquivir.'},
 {id:'r26',t:'mc',q:'¿En qué nivel del relieve están las depresiones del Ebro y del Guadalquivir?',o:['En el tercer nivel, con las cordilleras exteriores','En el primer nivel, con la Meseta','En el segundo nivel, con las cordilleras que rodean la Meseta','No pertenecen a ningún nivel'],exp:'Las dos depresiones están <b>fuera</b> de la Meseta y de sus bordes: forman parte del <b>tercer nivel</b>.'},
 {id:'r27',t:'multi',q:'Marca <b>todo</b> lo que forma el <b>primer nivel</b> del relieve.',o:[['La Meseta Central (Submeseta Norte y Submeseta Sur)',true],['El Sistema Central',true],['Los Montes de Toledo',true],['Los Montes de León',false],['La depresión del Ebro',false],['Sierra Morena',false]],exp:'El primer nivel es la Meseta con sus cordilleras interiores: <b>Sistema Central</b> y <b>Montes de Toledo</b>.'},
 {id:'r28',t:'mc',q:'Según tus esquemas, ¿qué es una <i>depresión</i>?',o:['Una zona del relieve que está a menor altura que los territorios que la rodean','Una cadena de montañas enlazadas','Una llanura muy elevada','Un conjunto de islas'],exp:'Una <b>depresión</b> está a <b>menor altura</b> que los territorios que la rodean. Por eso las del Ebro y del Guadalquivir quedan rodeadas de cordilleras.'},
 {id:'r29',t:'cls',q:'Une cada concepto clave con su definición (esquemas de clase).',b:['Relieve','Meseta','Cordillera','Depresión'],items:[['Forma que presenta la corteza terrestre en su superficie',0],['Extensa llanura elevada',1],['Sucesión o cadena de montañas enlazadas entre sí que se extienden a lo largo de una región',2],['Zona del relieve a menor altura que los territorios que la rodean',3]],exp:'Son los conceptos clave del esquema 1.1.'},
 {id:'r35',t:'paint',mode:'niv',q:'Colorea el mapa según los <b>tres niveles</b> del relieve de tus esquemas.',exp:'Primer nivel: Meseta, Sistema Central y Montes de Toledo. Segundo nivel: Montes de León, Cordillera Cantábrica, Sistema Ibérico y Sierra Morena. Tercer nivel: cordilleras exteriores y las dos depresiones.'},
 /* mapas */
 {id:'r30',t:'paint',mode:'relief',q:'Colorea el mapa del relieve con el código de colores de tu ficha.',exp:'Amarillo: Meseta. Marrón: interiores (Sistema Central y Montes de Toledo). Naranja: las que rodean la Meseta. Rojo: exteriores. Verde: depresiones del Ebro y del Guadalquivir.'},
 {id:'r31',t:'paint',mode:'relief',units:['meseta','central','toledo','leon','cantabrica','iberico','morena'],q:'Colorea la Meseta, sus cordilleras interiores y las que la rodean.',exp:'Interiores (marrón): Sistema Central y Montes de Toledo. Rodean la Meseta (naranja): Montes de León, Cordillera Cantábrica, Sistema Ibérico y Sierra Morena.'},
 {id:'r32',t:'paint',mode:'relief',units:['galaico','vascos','pirineos','costero','beticos','ebro','guadalquivir','cantabrica','morena'],q:'Colorea las cordilleras y depresiones de fuera de la Meseta. ¡Ojo, hay dos cordilleras que no son exteriores!',exp:'Exteriores (rojo): Macizo Galaico, Montes Vascos, Pirineos, Costero-Catalana y Béticos. La Cordillera Cantábrica y Sierra Morena <b>rodean</b> la Meseta (naranja). Las depresiones, en verde.'},
 {id:'r33',t:'lab',v:'P',items:['rng:central','rng:toledo','rng:leon','rng:cantabrica','rng:iberico','rng:morena','meseta:'],extra:['Pirineos','Sistemas Béticos'],show:{relief:'grey',rivers:false},q:'Escribe el nombre de cada número del mapa.',exp:'Dentro de la Meseta están el Sistema Central y los Montes de Toledo; la rodean los Montes de León, la Cordillera Cantábrica, el Sistema Ibérico y Sierra Morena.'},
 {id:'r34',t:'lab',v:'P',items:['rng:galaico','rng:vascos','rng:pirineos','rng:costero','rng:beticos','dep:ebro','dep:guadalquivir'],extra:['Sierra Morena','Montes de León'],show:{relief:'grey'},q:'Escribe el nombre de cada número: cordilleras exteriores y depresiones.',exp:'Exteriores: Macizo Galaico, Montes Vascos, Pirineos, Cordillera Costero-Catalana y Sistemas Béticos. Depresiones: Ebro (noreste) y Guadalquivir (suroeste).'},
 {id:'r40',t:'loc',v:'P',tg:'rng:central',show:{rivers:true},q:'Toca en el mapa el <b>Sistema Central</b>.',exp:'El Sistema Central cruza la Meseta de oeste a este y la divide en dos submesetas.'},
 {id:'r41',t:'loc',v:'P',tg:'rng:pirineos',show:{rivers:true},q:'Toca en el mapa los <b>Pirineos</b>.',exp:'Los Pirineos están en el norte, en la frontera con Francia y Andorra.'},
 {id:'r42',t:'loc',v:'P',tg:'rng:morena',show:{rivers:true},q:'Toca en el mapa <b>Sierra Morena</b>.',exp:'Sierra Morena es el borde sur de la Meseta, al norte del río Guadalquivir.'},
 {id:'r43',t:'loc',v:'P',tg:'rng:iberico',show:{rivers:true},q:'Toca en el mapa el <b>Sistema Ibérico</b>.',exp:'El Sistema Ibérico es el borde este de la Meseta. Va desde el norte de Burgos hasta Valencia.'},
 {id:'r44',t:'loc',v:'P',tg:'dep:ebro',show:{rivers:true},q:'Toca en el mapa la <b>depresión del Ebro</b>.',exp:'La depresión del Ebro tiene forma triangular y está en el noreste, entre Pirineos, Sistema Ibérico y Cordillera Costero-Catalana.'},
 {id:'r45',t:'loc',v:'P',tg:'dep:guadalquivir',show:{rivers:true},q:'Toca en el mapa la <b>depresión del Guadalquivir</b>.',exp:'La depresión del Guadalquivir está en el suroeste, entre Sierra Morena y los Sistemas Béticos, y se abre al océano Atlántico.'},
 {id:'r46',t:'loc',v:'P',tg:'rng:toledo',show:{rivers:true},q:'Toca en el mapa los <b>Montes de Toledo</b>.',exp:'Los Montes de Toledo están en el centro de la Submeseta Sur, entre los ríos Tajo y Guadiana.'},
 {id:'r47',t:'loc',v:'P',tg:'rng:cantabrica',show:{rivers:true},q:'Toca en el mapa la <b>Cordillera Cantábrica</b>.',exp:'La Cordillera Cantábrica es el borde norte de la Meseta, paralela al mar Cantábrico.'},
 {id:'r48',t:'loc',v:'P',tg:'rng:galaico',show:{rivers:true},q:'Toca en el mapa el <b>Macizo Galaico</b>.',exp:'El Macizo Galaico está en Galicia, en el noroeste, lejos de la Meseta.'},
 {id:'r49',t:'loc',v:'P',tg:'rng:costero',show:{rivers:true},q:'Toca en el mapa la <b>Cordillera Costero-Catalana</b>.',exp:'Recorre Cataluña paralela a la costa mediterránea.'},
 {id:'r50',t:'loc',v:'P',tg:'rng:beticos',show:{rivers:true},q:'Toca en el mapa los <b>Sistemas Béticos</b>.',exp:'Los Sistemas Béticos van desde Cádiz hasta Alicante, en el sur y el sureste.'},
 {id:'r51',t:'loc',v:'P',tg:'pt:mulhacen',show:{rivers:true},q:'Toca en el mapa dónde está el <b>Mulhacén</b>, el pico más alto de la Península.',exp:'El Mulhacén está en Sierra Nevada (Granada), en los Sistemas Béticos.'},
 {id:'r52',t:'loc',v:'P',tg:'pt:aneto',show:{rivers:true},q:'Toca en el mapa dónde está el <b>Aneto</b>, el pico más alto de los Pirineos.',exp:'El Aneto (3.404 m) está en el Pirineo de Huesca.'},
 {id:'r53',t:'loc',v:'P',tg:'meseta:',show:{rivers:true},q:'Toca en el mapa la <b>Meseta Central</b>.',exp:'La Meseta ocupa el centro de la Península.'},
 {id:'r54',t:'loc',v:'P',tg:'rng:leon',show:{rivers:true},q:'Toca en el mapa los <b>Montes de León</b>.',exp:'Los Montes de León forman el borde noroeste de la Meseta, entre Galicia y Castilla y León.'},
 {id:'r55',t:'loc',v:'P',tg:'rng:vascos',show:{rivers:true},q:'Toca en el mapa los <b>Montes Vascos</b>.',exp:'Los Montes Vascos unen la Cordillera Cantábrica con los Pirineos.'}
],
/* ---------------- 2. SALA DE LAS ISLAS DE CARAMELO (archipiélagos) ---------------- */
arc:[
 {id:'a01',t:'mc',q:'¿Qué es un <i>archipiélago</i>?',o:['Un conjunto de islas','Una isla muy grande','Una península pequeña','Un grupo de montañas'],exp:'Un <b>archipiélago</b> es un conjunto de islas. España tiene dos: el canario y el balear.'},
 {id:'a02',t:'mc',q:'¿Dónde se localiza el archipiélago canario?',o:['En el océano Atlántico, al suroeste de la Península y frente a la costa occidental de África','En el mar Mediterráneo, al este de la Península','En el mar Cantábrico','En el estrecho de Gibraltar'],exp:'Canarias está en el <b>océano Atlántico</b>, al <b>suroeste</b> de la Península, frente a la costa occidental de <b>África</b>.'},
 {id:'a03',t:'mc',q:'¿Dónde se sitúa el archipiélago balear?',o:['Al este de la Península, en el mar Mediterráneo','Al suroeste de la Península, en el Atlántico','Al norte, en el mar Cantábrico','Frente a la costa de Galicia'],exp:'Las Islas Baleares están al <b>este</b> de la Península, en el <b>mar Mediterráneo</b>.'},
 {id:'a04',t:'num',q:'¿Cuántas islas forman el archipiélago canario?',ans:8,label:'Islas',exp:'Son <b>8</b>: La Graciosa, Lanzarote, Fuerteventura, Gran Canaria, Tenerife, La Gomera, El Hierro y La Palma (y varios islotes).'},
 {id:'a05',t:'num',q:'¿Cuántas islas forman el archipiélago balear?',ans:5,label:'Islas',exp:'Son <b>5</b>: Mallorca, Menorca, Ibiza, Formentera y Cabrera.'},
 {id:'a06',t:'multi',q:'Marca <b>todas</b> las islas del archipiélago canario.',o:[['La Graciosa',true],['Lanzarote',true],['Fuerteventura',true],['Gran Canaria',true],['Tenerife',true],['La Gomera',true],['El Hierro',true],['La Palma',true],['Cabrera',false],['Formentera',false]],exp:'Las ocho islas canarias. Cabrera y Formentera son <b>baleares</b>.'},
 {id:'a07',t:'cls',q:'¿Canaria o balear?',b:['Canarias','Baleares'],items:[['Menorca',1],['La Gomera',0],['Ibiza',1],['El Hierro',0],['Cabrera',1],['Lanzarote',0],['Formentera',1],['La Palma',0]],exp:'Baleares: Mallorca, Menorca, Ibiza, Formentera y Cabrera. El resto son canarias.'},
 {id:'a08',t:'mc',q:'¿Por qué en los mapas de España el archipiélago canario suele aparecer dentro de un recuadro?',o:['Porque está muy alejado de la Península; si se dibujara en su sitio, el mapa sería enorme','Porque no pertenece a España','Porque es muy pequeño','Porque está debajo del mar'],exp:'Canarias está muy <b>lejos</b> de la Península. Si se situara en su lugar real, el mapa tendría que ser muy grande, así que se coloca en un <b>recuadro</b>.'},
 {id:'a09',t:'mc',q:'¿Cuál es el origen del relieve canario?',o:['Volcánico: se formó por la acumulación de lava de erupciones durante miles de años','Es una prolongación de los Sistemas Béticos','Lo formaron los ríos','Lo formaron los glaciares'],exp:'El relieve canario es de <b>origen volcánico</b>: se formó por la acumulación de <b>lava</b> de reiteradas erupciones a lo largo de miles de años.'},
 {id:'a10',t:'multi',q:'Marca las formas de relieve volcánico que hay en Canarias, según tu libro.',o:[['Roques',true],['Malpaíses',true],['Fajanas',true],['Rías',false],['Marismas',false]],exp:'Al enfriarse la lava se formaron <b>roques, malpaíses y fajanas</b>. Las rías y las marismas son formas de la costa.'},
 {id:'a11',t:'multi',q:'¿Qué islas canarias son las más <b>antiguas</b> y tienen un relieve más <b>desgastado</b>?',o:[['La Graciosa',true],['Lanzarote',true],['Fuerteventura',true],['Tenerife',false],['La Palma',false],['El Hierro',false]],exp:'<b>La Graciosa, Lanzarote y Fuerteventura</b> son las más antiguas: su relieve está desgastado y es más bajo.'},
 {id:'a12',t:'cls',q:'Clasifica las islas canarias como en tus apuntes: ¿islas del oeste o islas del este?',b:['Islas del oeste','Islas del este'],items:[['La Palma',0],['La Gomera',0],['El Hierro',0],['Tenerife',0],['Gran Canaria',1],['Fuerteventura',1],['Lanzarote',1],['La Graciosa',1]],exp:'<b>Oeste:</b> La Palma, La Gomera, El Hierro y Tenerife (relieve más alto; allí está el Teide). <b>Este:</b> Gran Canaria, Fuerteventura, Lanzarote y La Graciosa (menor relieve, sobre todo en las tres más antiguas).'},
 {id:'a13',t:'mc',q:'En general, ¿dónde están las cumbres más altas de cada isla canaria?',o:['En el centro de la isla; la altitud desciende hacia la costa','Siempre junto a la costa','En el extremo norte','No hay montañas en Canarias'],exp:'Las cumbres más altas están en el <b>centro</b> de cada isla y la altitud va <b>descendiendo hacia la costa</b>.'},
 {id:'a14',t:'mc',q:'¿Cuál es la cima más alta de España y dónde está?',o:['El Teide, en Tenerife','El Mulhacén, en Sierra Nevada','El Aneto, en los Pirineos','El Puig Major, en Mallorca'],exp:'El volcán <b>Teide</b>, en <b>Tenerife</b>, es la cima más alta de España.'},
 {id:'a15',t:'num',q:'¿Cuántos metros mide el <b>Teide</b>?',ans:[3715,3718],label:'Metros',exp:'Según la medición más reciente del Instituto Geográfico Nacional, el Teide mide <b>3.715 m</b>. Tu libro da 3.718 m, una medida anterior: las dos se dan por buenas.'},
 {id:'a16',t:'mc',q:'¿Cómo es el relieve de las Islas Baleares?',o:['Es una prolongación de los Sistemas Béticos, pero con menor altura','Es de origen volcánico','Es una continuación de los Pirineos','Es totalmente llano'],exp:'El relieve balear es una <b>prolongación de los Sistemas Béticos</b> de la Península, con <b>menor altura</b>. En general, tiene escasa altitud y formas suaves.'},
 {id:'a17',t:'mc',q:'¿Cuál es la isla más grande de las Baleares?',o:['Mallorca','Menorca','Ibiza','Formentera'],exp:'<b>Mallorca</b> es la isla más grande y la de relieve más variado y montañoso.'},
 {id:'a18',t:'mc',q:'¿Cómo es el relieve de Mallorca?',o:['Al noroeste, la sierra de Tramuntana, paralela a la costa; en el centro, una llanura llamada Pla','Toda la isla es una gran montaña volcánica','Tiene una depresión triangular en el centro','Es completamente llana'],exp:'Mallorca tiene la <b>sierra de Tramuntana</b> al noroeste, paralela a la costa, y una llanura en el centro: el <b>Pla</b>.'},
 {id:'a19',t:'mc',q:'En Mallorca, ¿qué significa <i>Pla</i>?',o:['Llanura','Montaña','Volcán','Playa'],exp:'<b>Pla</b> significa <b>llanura</b>: es la zona llana del centro de Mallorca.'},
 {id:'a20',t:'mc',q:'¿Cuál es la cima más alta de las Islas Baleares?',o:['El Puig Major, en la sierra de Tramuntana (Mallorca)','El Teide','El Mulhacén','El Garajonay'],exp:'El <b>Puig Major</b> (1.436 m) está en la sierra de Tramuntana, en Mallorca.'},
 {id:'a21',t:'mc',q:'¿Qué archipiélago tiene un relieve más elevado?',o:['El canario, porque su relieve es volcánico y tiene cumbres muy altas, como el Teide','El balear, porque es una prolongación de los Pirineos','Los dos tienen la misma altura','Ninguno tiene montañas'],exp:'El <b>canario</b>: el Teide supera los 3.700 m, mientras que la cima más alta de Baleares, el Puig Major, mide 1.436 m.'},
 {id:'a22',t:'cls',q:'¿De qué archipiélago es cada característica?',b:['Canario','Balear','Los dos'],items:[['Relieve de origen volcánico',0],['Prolongación de los Sistemas Béticos',1],['Está en el océano Atlántico',0],['Está en el mar Mediterráneo',1],['Es un conjunto de islas',2],['Escasa altitud y formas suaves',1],['Tiene la cima más alta de España',0],['No tiene verdaderos ríos',2]],exp:'Se parecen en que son archipiélagos españoles y no tienen verdaderos ríos. Se diferencian en su origen (volcánico / bético), su localización y su altitud.'},
 {id:'a23',t:'num',q:'El Teide mide 3.715 m y el Puig Major, 1.436 m. ¿Cuántos metros más alto es el Teide?',ans:2279,label:'Metros',exp:'3.715 − 1.436 = <b>2.279 m</b>.'},

 {id:'c01',t:'multi',q:'Marca los mares y océanos que bañan las costas de España.',o:[['Océano Atlántico',true],['Mar Cantábrico',true],['Mar Mediterráneo',true],['Mar del Norte',false],['Océano Índico',false]],exp:'Las costas españolas están bañadas por el <b>océano Atlántico</b>, el <b>mar Cantábrico</b> y el <b>mar Mediterráneo</b>.'},
 {id:'c02',t:'mc',q:'¿Por qué España tiene una costa tan extensa y variada?',o:['Porque ocupa gran parte de la península ibérica y tiene dos archipiélagos','Porque es el país más grande del mundo','Porque no tiene montañas','Porque solo la baña un mar'],exp:'España ocupa gran parte de la <b>península</b> y comprende <b>dos archipiélagos</b>: por eso su costa es extensa y variada.'},
 {id:'c03',t:'mc',q:'¿Cómo es la costa <b>gallega</b>?',o:['Recortada: tiene muchos entrantes y salientes, con rías','Baja y arenosa, con marismas','Recta y sin playas','Volcánica'],exp:'La costa gallega es <b>recortada</b>, con muchos entrantes y salientes. Son características las <b>rías</b>.'},

 {id:'c05',t:'mc',q:'¿Cómo es la costa <b>canaria</b>?',o:['Varía de unas islas a otras: alta y rocosa en las del oeste y baja en las del este','Toda es baja y arenosa','Toda es recortada, con rías','Toda tiene marismas'],exp:'Varía: en las islas del <b>oeste</b> es <b>alta y rocosa</b> (acantilados de La Gomera) y en las del <b>este</b>, <b>baja</b>.'},
 {id:'c06',t:'mc',q:'¿Cómo es, en general, la costa <b>cantábrica</b>?',o:['Acantilada, con rías en la desembocadura de los ríos','Baja y arenosa, con marismas','Con amplias playas y lagunas','Volcánica'],exp:'La costa cantábrica es, en general, <b>acantilada</b>. También tiene <b>rías</b>, que se forman en la desembocadura de los ríos.'},
 {id:'c07',t:'mc',q:'¿Cuál es el litoral más extenso de España?',o:['El mediterráneo','El cantábrico','El atlántico gallego','El canario'],exp:'El litoral <b>mediterráneo</b> es el más extenso y en su recorrido hay diferentes tipos de costa.'},
 {id:'c08',t:'cls',q:'¿Cómo es cada tramo de la costa mediterránea?',b:['Acantilados y zonas bajas con calas','Amplias playas','Playas y acantilados','Baja','Alta y rocosa'],items:[['Costa catalana',0],['Costa balear',0],['Costa levantina (Comunitat Valenciana y Región de Murcia)',1],['Costa mediterránea andaluza',2],['Costa de Ceuta',3],['Costa de Melilla',4]],exp:'Catalana y balear: alternan acantilados con zonas bajas con pequeñas <b>calas</b>. Levantina: <b>amplias playas</b>. Andaluza: playas y acantilados. Ceuta: baja. Melilla: alta y rocosa.'},
 {id:'c09',t:'mc',q:'¿Dónde se forman las <i>rías</i>?',o:['En la desembocadura de los ríos, donde el mar entra en la tierra','En lo alto de las montañas','En el centro de la Meseta','En los volcanes'],exp:'Las <b>rías</b> se forman en la <b>desembocadura de los ríos</b>: el mar entra en la tierra por el valle del río. Son típicas de Galicia y del Cantábrico.'},

 {id:'c11',t:'mc',q:'¿Qué cabo era, para los romanos, el «fin del mundo»?',o:['Fisterra','Cabo de Gata','Cabo de Creus','Cabo de Palos'],exp:'En tiempos de los romanos se pensaba que <b>Fisterra</b> (Galicia) era el fin del mundo: más allá, solo había océano.'},

  <tr><td><b>Meseta</b></td><td>Extensa llanura elevada.</td></tr>
  <tr><td><b>Cordillera</b></td><td>Sucesión o cadena de montañas enlazadas entre sí que se extienden a lo largo de una región.</td></tr>
  <tr><td><b>Depresión</b></td><td>Zona del relieve que se encuentra a menor altura que los territorios que la rodean.</td></tr>
  <tr><td><b>Archipiélago</b></td><td>Conjunto de islas.</td></tr>
  <tr><td><b>Costa</b></td><td>Tierra próxima al mar o línea que forma el límite entre la tierra y el océano.</td></tr>
  <tr><td><b>Ría</b></td><td>Entrada del agua del mar u océano a un río como consecuencia de la subida de la marea.</td></tr>
  <tr><td><b>Marismas</b></td><td>Terreno bajo y pantanoso que se inunda por la marea y por las aguas de los ríos que desembocan cerca.</td></tr>
  <tr><td><b>Cabo / golfo</b></td><td>Porción de tierra que sobresale de la costa y se adentra en el mar u océano / entrante de mar en la tierra.</td></tr>
  <tr><td><b>Vertiente</b></td><td>Territorio que recorren todos los ríos que vierten sus aguas a un mismo mar u océano.</td></tr>
  <tr><td><b>Caudal</b></td><td>Cantidad de agua que lleva un río.</td></tr>
  <tr><td><b>Afluente</b></td><td>Río que desemboca en otro río.</td></tr>
  <tr><td><b>Torrente / barranco</b></td><td>Cauces por los que el agua corre de vez en cuando (Baleares / Canarias).</td></tr>
  <tr><td><b>Humedal</b></td><td>Terreno llano que se cubre de agua de forma temporal o permanente.</td></tr>
  <tr><td><b>Flora</b></td><td>Conjunto de especies vegetales (plantas, árboles, arbustos, flores…) que viven en un espacio determinado.</td></tr>
  <tr><td><b>Fauna</b></td><td>Conjunto de especies animales que habitan en una región determinada.</td></tr></table></div>`;
 return '';
}

   ========================================================= */
function takeFrom(id,n,allowReset){
  let pool=shuffle(BANK[id].filter(q=>!S.seen[id].includes(q.id)));
  /* que no salgan más de 4 retos de mapa por ronda ni más de 1 de colorear */
  const MAPT=['loc','paint','lab'];let out=[],nm=0,np=0;
  for(const q of pool){if(out.length>=n)break;const ism=MAPT.includes(q.t);if(ism&&nm>=4)continue;if(q.t==='paint'&&np>=1)continue;out.push(q);if(ism)nm++;if(q.t==='paint')np++}
  if(out.length<n){for(const q of pool){if(out.length>=n)break;if(!out.includes(q))out.push(q)}}
  if(out.length<n&&allowReset){
    const used=new Set(out.map(q=>q.id));S.seen[id]=[];save();
    out=out.concat(shuffle(BANK[id].filter(q=>!used.has(q.id))).slice(0,n-out.length));
    G&&(G.reshuffled=true);
  }
  if(out.length<n)out=out.concat(shuffle(BANK[id].filter(q=>!out.includes(q))).slice(0,n-out.length));
  return out.map(q=>({...q,zone:id}));
}
function spread(qs){
  const out=[];let rest=qs.slice();
  while(rest.length){const last=out.length?out[out.length-1].t:null;let i=rest.findIndex(q=>q.t!==last);if(i<0)i=0;out.push(rest.splice(i,1)[0])}
  return out;
}
function prep(q){
  q=clone(q);
  if(q.t==='mc'||q.t==='prof'){q._o=shuffle(q.o.map((t,i)=>({t,ok:i===0})))}
  if(q.t==='multi'){q._o=shuffle(q.o.map(([t,ok])=>({t,ok})))}
  if(q.t==='cls'){q._it=shuffle(q.items)}
  if(q.t==='ord'){let s;do{s=shuffle(q.items)}while(s.every((x,i)=>x===q.items[i]));q._src=s;q._dst=[]}
  if(q.t==='lab'){q._items=shuffle(q.items);q._names=shuffle(q.items.map(t=>tName(t).replace(/^Río /,'')).concat(q.extra||[]))}
  if(q.t==='paint'){q._fills={};q._cur=null}
  return q;
}
function start(id){
  G={id,z:zone(id),i:0,correct:0,streak:0,best:0,gained:0,res:[],hearts:id==='boss'?3:0,done:false};
  let qs;
  if(id==='boss'){const zs=shuffle(QZ).concat(shuffle(QZ).slice(0,BOSSN-QZ.length));const cnt={};zs.forEach(z=>cnt[z]=(cnt[z]||0)+1);qs=[];Object.keys(cnt).forEach(z=>qs=qs.concat(takeFrom(z,cnt[z],false)));qs=shuffle(qs)}
  else qs=takeFrom(id,ROUND,true);
  G.qs=spread(qs).map(prep);
  if(G.reshuffled)setTimeout(()=>toast('¡Has visto todos los retos de esta sala! Praliné los ha barajado de nuevo.'),500);
  $('#mapBtn').hidden=false;showQ();
}

const TAGS={mc:'Elige la respuesta',multi:'Marca todas las correctas',cls:'Clasifica',ord:'Ordena',num:'Calcula',loc:'Localiza en el mapa',paint:'Colorea el mapa',lab:'Rotula el mapa',prof:'El recorrido de un río'};

function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return null;const r=p.matrixTransform(m.inverse());return [r.x,r.y]}
function drawPin(svg,x,y,cls){const gp=svg.querySelector('.tapl');const c=cls==='ok'?'#1f9e6c':cls==='ko'?'#d93d5e':'#5a3220';
  gp.innerHTML=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><path d="M0 0 C-4 -10 -12 -14 -12 -22 a12 12 0 0 1 24 0 C12 -14 4 -10 0 0Z" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="0" cy="-22" r="4.5" fill="#fff"/></g>`}
function wire(q){
  $$('#qcard .opts').forEach(gp=>{const multi=gp.classList.contains('multi');gp.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(G.done)return;
    if(multi)b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');
    else{gp.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked','false'));b.setAttribute('aria-checked','true')}sfx.tap()})});
  $$('#qcard .crow').forEach(row=>row.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(G.done)return;row.querySelectorAll('.bin').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');sfx.tap()}));
  if(q.t==='ord')renderOrd(q);
  if(q.t==='loc'){const svg=$('#mapw svg');svg.classList.add('tap');svg.addEventListener('click',e=>{if(G.done)return;const p=svgPt(svg,e);if(!p)return;q._tap=p;drawPin(svg,p[0],p[1]);sfx.pin();$('#maptip').textContent='Chincheta colocada. Pulsa «Comprobar» o toca otro punto para moverla.'})}
  if(q.t==='paint')wirePaint(q);
  const ni=$('#numIn');if(ni){ni.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();G.done?next():check()}});if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>ni.focus({preventScroll:true}),60)}
}
function wirePaint(q){
  const C=paintCfg(q);
  $$('#qcard .sw').forEach(b=>b.onclick=()=>{if(G.done)return;q._cur=b.dataset.c;$$('#qcard .sw').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));sfx.tap()});
  const bindMap=()=>{const svg=$('#mapw svg');svg.querySelectorAll('.pu').forEach(el=>el.addEventListener('click',()=>{if(G.done)return;
    if(!q._cur){toast('Primero elige un color de la paleta.');return}
    const u=el.dataset.u;if(!C.units.includes(u))return;q._fills[u]=q._cur;sfx.tap();
    const f={};for(const k in q._fills)f[k]=C.pal[q._fills[k]];$('#mapw').innerHTML=mapSVG('P',C.opt(f));bindMap();
    const left=C.units.filter(k=>!q._fills[k]).length;$('#maptip').textContent=left?`Has pintado ${C.uname(u)}. Te faltan ${left}.`:`¡Todo pintado! Último: ${C.uname(u)}. Pulsa «Comprobar».`}))};
  bindMap();
}
function renderOrd(q){
  const src=$('#ordSrc'),dst=$('#ordDst');
  src.innerHTML=q._src.length?q._src.map((t,i)=>`<button type="button" class="chip" data-i="${i}">${t}</button>`).join(''):'<span class="ord-empty">¡Ya has colocado todas!</span>';
  dst.innerHTML=q._dst.length?q._dst.map((t,i)=>`<button type="button" class="chip" data-i="${i}" aria-label="Posición ${i+1}: ${esc(t)}. Toca para quitarla."><span class="n">${i+1}</span><span>${t}</span></button>`).join(''):'<span class="ord-empty">Toca las tarjetas de arriba en el orden correcto.</span>';
  src.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.done)return;const i=+b.dataset.i;q._dst.push(q._src.splice(i,1)[0]);sfx.tap();renderOrd(q);const f=$('#ordSrc .chip');if(f)f.focus({preventScroll:true})});
  dst.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.done)return;const i=+b.dataset.i;q._src.push(q._dst.splice(i,1)[0]);sfx.tap();renderOrd(q)});

/* ---------- comprobar un toque en el mapa ---------- */
function inPoly(d,x,y){let ins=false;pathPts(d).forEach(p=>{for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}});return ins}
function hitOne(t,x,y,tol){
  const [ty,k]=t.split(':');
  if(ty==='pt'||ty==='cpt'||ty==='bpt'){const a=anchor(t);return Math.hypot(x-a[0],y-a[1])<=tol*1.15}
  if(ty==='rng')return distPath(GP.ranges[k].d,x,y)<=tol+9;
  if(ty==='brng')return distPath(GEO.B.tram,x,y)<=tol+8;
  if(ty==='riv'){let best=null,bd=1e9;for(const r in GP.rivers){const d=distPath(GP.rivers[r],x,y);if(d<bd){bd=d;best=r}}return best===k&&bd<=tol}
  if(ty==='dep')return inPoly(GP.dep[k].d,x,y)||distPath(GP.dep[k].d,x,y)<=10;
  if(ty==='meseta')return inPoly(GP.meseta,x,y)||distPath(GP.meseta,x,y)<=10;
  if(ty==='bpla')return inPoly(GEO.B.pla,x,y)||distPath(GEO.B.pla,x,y)<=tol*.6;
  if(ty==='isl'){const a=GP.isl[k];return Math.hypot(x-a[0],y-a[1])<=(k==='Mallorca'?48:30)}
  if(ty==='cisl'||ty==='bisl'){const d=GEO[ty==='cisl'?'C':'B'].isl[k].d;return inPoly(d,x,y)||distPath(d,x,y)<=tol*.7}
  return false;
}
function hlTarget(svg,t){
  const [ty,k]=t.split(':');const gp=svg.querySelector('.hl');let s='';const G1='#ffc93c';
  if(ty==='pt'||ty==='cpt'||ty==='bpt'||ty==='isl'){const a=anchor(t);s=`<circle cx="${a[0]}" cy="${a[1]}" r="${ty==='isl'&&k==='Mallorca'?46:16}" fill="${G1}" fill-opacity=".35" stroke="#b88600" stroke-width="3.5"/><circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#b88600"/>`}
  if(ty==='rng')s=`<path d="${GP.ranges[k].d}" fill="none" stroke="${G1}" stroke-opacity=".8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(ty==='brng')s=`<path d="${GEO.B.tram}" fill="none" stroke="${G1}" stroke-opacity=".8" stroke-width="20" stroke-linecap="round"/>`;
  if(ty==='riv')s=`<path d="${GP.rivers[k]}" fill="none" stroke="${G1}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="${GP.rivers[k]}" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(ty==='dep')s=`<path d="${GP.dep[k].d}" fill="${G1}" fill-opacity=".55" stroke="#b88600" stroke-width="3"/>`;
  if(ty==='meseta')s=`<path d="${GP.meseta}" fill="${G1}" fill-opacity=".5" stroke="#b88600" stroke-width="3"/>`;
  if(ty==='bpla')s=`<path d="${GEO.B.pla}" fill="${G1}" fill-opacity=".55" stroke="#b88600" stroke-width="3"/>`;
  if(ty==='cisl'||ty==='bisl')s=`<path d="${GEO[ty==='cisl'?'C':'B'].isl[k].d}" fill="${G1}" fill-opacity=".7" stroke="#b88600" stroke-width="3"/>`;
  gp.insertAdjacentHTML('beforeend',s);
}

/* ---------- comprobar ---------- */
function parseInt2(s){const t=String(s).trim().replace(/[.\s]/g,'');if(!/^\d+$/.test(t))return NaN;return parseInt(t,10)}
function check(){
  if(G.done)return;const q=G.qs[G.i];const fb=$('#fb');let ok=false;let extra='';
  const warn=t=>{fb.className='fb warn';fb.innerHTML=`<div><p class="fbt">Espera…</p><div class="exp">${t}</div></div>`};
  if(q.t==='mc'||q.t==='multi'||q.t==='prof'){
    const bs=$$('#qcard .opt');const sel=bs.map(b=>b.getAttribute('aria-checked')==='true');
    if(!sel.some(Boolean))return warn(q.t==='multi'?'Marca al menos una respuesta.':'Elige una respuesta.');
    ok=q._o.every((o,j)=>o.ok===sel[j]);
    bs.forEach((b,j)=>{b.disabled=true;if(q._o[j].ok)b.classList.add(sel[j]?'right':'missed');else if(sel[j])b.classList.add('wrong')});
  }
  if(q.t==='cls'){
    const rows=$$('#qcard .crow');const ans=rows.map(r=>{const p=r.querySelector('.bin[aria-pressed="true"]');return p?+p.dataset.k:-1});
    if(ans.some(a=>a<0))return warn('Te falta clasificar alguna tarjeta.');
    ok=true;rows.forEach((r,i)=>{const good=q._it[i][1];const o=ans[i]===good;if(!o)ok=false;r.classList.add(o?'right':'wrong');r.querySelectorAll('.bin').forEach(b=>b.disabled=true);if(!o)r.querySelector('.sol').innerHTML=`Era: <b>${q.b[good]}</b>`});
  }
  if(q.t==='ord'){
    if(q._src.length)return warn('Coloca todas las tarjetas antes de comprobar.');
    ok=q._dst.every((t,i)=>t===q.items[i]);
    $$('#ordDst .chip').forEach((b,i)=>{b.disabled=true;b.classList.add(q._dst[i]===q.items[i]?'right':'wrong')});
    if(!ok)$('#ordDst').insertAdjacentHTML('afterend',`<p class="note" style="margin-top:6px"><b>Orden correcto:</b> ${q.items.map((t,i)=>(i+1)+'. '+t).join(' · ')}</p>`);
  }
  if(q.t==='num'){
    const inp=$('#numIn');if(!inp.value.trim())return warn('Escribe tu respuesta.');
    const n=parseInt2(inp.value);if(isNaN(n))return warn('Escribe solo cifras (puedes usar puntos para separar los miles).');
    const acc=[].concat(q.ans);ok=acc.includes(n);inp.disabled=true;inp.classList.add(ok?'right':'wrong');if(!ok)$('#qcard .numrow .sol').innerHTML=`Solución: <b class="nb">${fmtInt(acc[0])}</b>`;
  }
  if(q.t==='loc'){
    if(!q._tap)return warn('Toca el mapa para colocar tu chincheta.');
    const svg=$('#mapw svg');const V=GEO[q.v];const tol=Math.max(q.v==='P'?24:34,24*V.W/svg.getBoundingClientRect().width);
    const tgs=[].concat(q.tg);ok=tgs.some(t=>hitOne(t,q._tap[0],q._tap[1],tol));
    tgs.forEach(t=>hlTarget(svg,t));drawPin(svg,q._tap[0],q._tap[1],ok?'ok':'ko');
    $('#maptip').textContent=ok?'¡Chincheta en su sitio!':'El lugar correcto está marcado en dorado.';
  }
  if(q.t==='paint'){
    const C=paintCfg(q);const left=C.units.filter(k=>!q._fills[k]);
    if(left.length)return warn(`Te ${left.length===1?'falta':'faltan'} ${left.length} por pintar.`);
    const wrong=C.units.filter(k=>q._fills[k]!==C.ans(k));ok=!wrong.length;
    const f={};C.units.forEach(k=>f[k]=C.pal[C.ans(k)]);$('#mapw').innerHTML=mapSVG('P',C.opt(f));
    $$('#qcard .sw').forEach(b=>b.disabled=true);
    $('#maptip').textContent='Así queda el mapa bien coloreado.';
    $('#paintres').innerHTML=ok?`<b style="color:var(--ok)">¡${C.units.length} de ${C.units.length} bien pintados!</b>`:`<b>Has acertado ${C.units.length-wrong.length} de ${C.units.length}.</b> Revisa: ${wrong.map(k=>`<span>${C.uname(k)} → <b>${C.names[C.ans(k)]}</b></span>`).join('')}`;
  }
  if(q.t==='lab'){
    const rows=$$('#qcard .lrow');const v=rows.map(r=>r.querySelector('select').value);
    if(v.some(x=>!x))return warn('Elige un nombre para cada número.');
    ok=true;rows.forEach((r,i)=>{const p=r.dataset.p;const o=v[i]===p;if(!o)ok=false;r.classList.add(o?'right':'wrong');r.querySelector('select').disabled=true;if(!o)r.querySelector('.sol').innerHTML=`Era: <b>${esc(p)}</b>`});
  }
  G.done=true;G.res[G.i]=ok;
  if(q.zone&&S.seen[q.zone]&&!S.seen[q.zone].includes(q.id))S.seen[q.zone].push(q.id);
  if(ok){G.correct++;G.streak++;G.best=Math.max(G.best,G.streak);const gg=(G.hint?5:10)+(G.streak>=3?5:0);S.coins+=gg;G.gained+=gg;bump();sfx.ok()}
  else{G.streak=0;if(G.id==='boss')G.hearts--;sfx.bad()}
  save();header();$('#mapBtn').hidden=false;
  const praise=[g('¡Toda una chocolatera de mapas!','¡Todo un chocolatero de mapas!'),'¡Dulce como el praliné!','¡Exacto!','¡Eso merece una chocolatina!','¡Praliné aplaude con las alas!','¡Ni el señor Wonka lo habría hecho mejor!'];
  const oops=['¡Casi! Mira la explicación:','Este bombón se resiste. Fíjate:','Uy, a repasar en el Recetario:'];
  fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=`<span class="pip">${ART.praline(ok?'happy':'oops')}</span><div><p class="fbt">${ok?pick(praise)+(G.streak>=3?' Racha de '+G.streak+': +5 extra.':''):pick(oops)}</p><div class="exp">${q.exp}</div></div>`;
  const pr=$('.prog');if(pr)pr.outerHTML=progressBar();
  if(G.id==='boss'){const h=$('.hearts');if(h)h.innerHTML=[0,1,2].map(k=>ART.heart(k<G.hearts)).join('')}
  $('#hintBtn').hidden=true;
  const last=G.i===G.qs.length-1||(G.id==='boss'&&G.hearts<=0);
  const b=$('#checkBtn');b.textContent=last?'Ver resultado':'Siguiente reto';b.onclick=next;b.focus({preventScroll:true});
  fb.scrollIntoView({behavior:RM()?'auto':'smooth',block:'nearest'});
}
function next(){
  const last=G.i===G.qs.length-1||(G.id==='boss'&&G.hearts<=0);
  if(last){finish();return}
  G.i++;showQ();window.scrollTo({top:0,behavior:'auto'});
}
function finish(){
  const {id,correct,qs}=G;let stars;
  if(id==='boss')stars=G.hearts>0?G.hearts:0;
  else stars=correct>=7?3:correct>=6?2:correct>=PASS?1:0;
  const bonus=stars*20;S.coins+=bonus;G.gained+=bonus;
  const firstFind=stars>0&&!S.found[id];const improved=stars>S.stars[id];
  if(improved)S.stars[id]=stars;if(firstFind)S.found[id]=true;save();header();
  const z=G.z;
  const msg=stars===3?'¡Tres estrellas! Tienes brújula de chocolate.':stars===2?'¡Muy bien! Te falta muy poco para las tres estrellas.':stars===1?'¡Conseguido! Vuelve a por más estrellas: los retos no se repiten hasta que los veas todos.':(id==='boss'?'El Ascensor de Cristal es el reto más difícil. Repasa el Recetario y vuelve a intentarlo.':`Necesitas ${PASS} aciertos para ganar la chocolatina. ¡Repasa el Recetario y vuelve a intentarlo!`);
  const showRes=()=>{
    if(stars>0)sfx.win();
    showOv(`<h2>${stars>0?'¡Sala superada!':'¡Casi lo tienes!'}</h2>
    <div class="big-stars">${[0,1,2].map(i=>ART.star(i<stars)).join('')}</div>
    <p>${id==='boss'?(G.hearts>0?`Has llegado al final con ${G.hearts} ${G.hearts===1?'vida':'vidas'}.`:'Te has quedado sin vidas.'):`Has acertado ${correct} de ${qs.length}.`} Mejor racha: ${G.best}. Chocolatinas: <b class="gain">+${G.gained}</b></p>
    <p>${msg}${improved&&!firstFind&&stars>0?' ¡Nuevo récord de estrellas!':''}</p>
    <div class="center"><button class="btn ghost" id="again" type="button">Otra ronda aquí</button>${id==='boss'&&S.stars.boss?'<button class="btn ghost" id="seeC" type="button">Ver mi billete dorado</button>':''}<button class="btn" id="tomap" type="button">Volver a la fábrica</button></div>`);
    $('#again').onclick=()=>{hideOv();start(id)};$('#tomap').onclick=()=>{hideOv();map()};
    const sc=$('#seeC');if(sc)sc.onclick=carnet;
  };
  if(firstFind){
    showOv(`<div class="disc-art">${SPEC[z.spec]()}</div><h2>¡Nueva chocolatina: ${z.dname}!</h2><p class="note">${z.dtag}</p><p>${personal(BIO[id])}</p>
     <div class="center"><button class="btn" id="okfind" type="button">¡A mi colección!</button></div>`);
    confetti();sfx.win();$('#okfind').onclick=()=>{hideOv();setTimeout(showRes,120)};
  }else showRes();
}

function confetti(){
  if(RM())return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffb3d4','#cdb8ff','#9ff0e2','#7b4a2d','#ffc93c','#ff7fb2'];
  const L=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6}));
  const t0=performance.now();(function f(now){const t=(now-t0)/16.7;x.clearRect(0,0,c.width,c.height);L.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.a+=.2;x.save();x.globalAlpha=Math.max(0,1-t/110);x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-q.r/2,-q.r/3,q.r,q.r*.66);x.restore()});if(now-t0<2000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);}

   ========================================================= */
const midRound=()=>G&&G.qs&&(G.i>0||G.done)&&!(G.done&&G.i===G.qs.length-1)&&!(G.id==='boss'&&G.hearts<=0);
$('#mapBtn').onclick=()=>{if(midRound()){showOv(`<h2>¿Volver a la fábrica?</h2><p>Si sales ahora, perderás esta ronda (las chocolatinas ganadas se quedan).</p><div class="center"><button class="btn ghost" id="stay" type="button">Seguir jugando</button><button class="btn" id="leave" type="button">Salir</button></div>`);$('#stay').onclick=hideOv;$('#leave').onclick=()=>{hideOv();map()}}else map()};
$('#bookBtn').onclick=()=>book();
$('#atlasBtn').onclick=()=>{if(midRound()){showOv(`<h2>¿Ir a la colección?</h2><p>Si sales ahora, perderás esta ronda (las chocolatinas ganadas se quedan).</p><div class="center"><button class="btn ghost" id="stay" type="button">Seguir jugando</button><button class="btn" id="leave" type="button">Ir a la colección</button></div>`);$('#stay').onclick=hideOv;$('#leave').onclick=()=>{hideOv();atlas()}}else atlas()};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();header();sfx.tap()};
if(S.name&&S.gen)map();else welcome();

</script>
