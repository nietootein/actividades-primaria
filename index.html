<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actividades de primaria · 5.º y 6.º</title>
<meta name="description" content="Actividades interactivas para repasar en casa. Quinto y sexto de primaria, Comunidad de Madrid.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800;900&family=Nunito:wght@600;800;900&display=swap">
<style>
:root{
  --bg:#f3f7ff; --paper:#ffffff; --ink:#22264a; --soft:#5b6088; --line:#dfe3f3;
  --lengua:#8a5ce6; --lengua-bg:#efe8ff;
  --mates:#1f8fd6; --mates-bg:#e2f2ff;
  --cono:#22a36a; --cono-bg:#e0f6ea;
  --ingles:#e0603b; --ingles-bg:#ffe9e1;
  --f-display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15172b;--paper:#1f2240;--ink:#eef0ff;--soft:#b3b7da;--line:#33375e;
    --lengua:#b496ff;--lengua-bg:#2c2550;--mates:#6cc3ff;--mates-bg:#1c3047;--cono:#6ed9a4;--cono-bg:#1c3a2d;--ingles:#ff9a7a;--ingles-bg:#45281f;color-scheme:dark}
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:32px max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px))}
header h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:0 0 8px}
header p{margin:0;color:var(--soft);font-weight:700;max-width:60ch}
.subject{margin-top:36px}
.subject h2{font-family:var(--f-display);font-size:1.5rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.subject h2 .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:18px;padding:16px 18px;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.card .id{font-size:.85rem;font-weight:800;color:var(--soft)}
.card h3{font-family:var(--f-display);font-size:1.25rem;margin:0;line-height:1.2}
.card p{margin:0;color:var(--soft);font-weight:600;font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{background:var(--cbg);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800}
footer{margin-top:44px;color:var(--soft);font-size:.9rem;font-weight:600;border-top:2px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Actividades para repasar en casa</h1>
    <p>Juegos y retos interactivos para quinto y sexto de primaria, según el currículo de la Comunidad de Madrid. Elige una actividad, escribe tu nombre y ¡a jugar!</p>
  </header>
  <main id="lista"></main>
  <footer>El progreso de cada actividad se guarda solo en el navegador del dispositivo donde se juega.</footer>
</div>
<script>
/* ============================================================
   LISTA DE RECURSOS
   Para añadir uno nuevo, copia una línea y cambia los datos.
   El archivo debe llamarse  asignatura-recurso-NN.html
   Asignaturas: lengua, mates, conocimiento, ingles
   ============================================================ */
const RECURSOS=[
  {asig:'lengua', id:'01', curso:'5.º', titulo:'Academia de Dragones', desc:'Despierta cuatro huevos de dragón superando retos de lengua.', temas:['Sinónimos y antónimos','Clases de palabras','Lexema y morfemas','Mayúsculas','Acentuación']},
  {asig:'lengua', id:'02', curso:'5.º', titulo:'Reino Arcoíris', desc:'Viaja por el reino con tu dragoncito guía. Retos que no se repiten.', temas:['Sinónimos y antónimos','Variables e invariables','Prefijos y sufijos','Acentuación','Comprensión lectora']},
];
const ASIG={
  lengua:{nombre:'Lengua Castellana y Literatura',c:'var(--lengua)',cbg:'var(--lengua-bg)'},
  mates:{nombre:'Matemáticas',c:'var(--mates)',cbg:'var(--mates-bg)'},
  conocimiento:{nombre:'Conocimiento del Medio',c:'var(--cono)',cbg:'var(--cono-bg)'},
  ingles:{nombre:'Inglés',c:'var(--ingles)',cbg:'var(--ingles-bg)'}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const out=[];
Object.keys(ASIG).forEach(k=>{
  const rs=RECURSOS.filter(r=>r.asig===k);if(!rs.length)return;
  const a=ASIG[k];
  out.push(`<section class="subject" style="--c:${a.c};--cbg:${a.cbg}"><h2><span class="dot" aria-hidden="true"></span>${a.nombre}</h2><div class="grid">`+
    rs.map(r=>`<a class="card" href="${k}-recurso-${esc(r.id)}.html"><span class="id">Recurso ${esc(r.id)} · ${esc(r.curso)} de primaria</span><h3>${esc(r.titulo)}</h3><p>${esc(r.desc)}</p><div class="tags">${r.temas.map(t=>`<span>${esc(t)}</span>`).join('')}</div></a>`).join('')+
    `</div></section>`);
});
document.getElementById('lista').innerHTML=out.join('');
</script>
</body>
</html>
