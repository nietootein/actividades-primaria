<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="NietooteiN">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La Noche de los Números · Matemáticas 5.º</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mystery+Quest&family=Nunito:wght@500;700;800;900&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎃%3C/text%3E%3C/svg%3E">
<style>
:root{
  --night:#150b29;--night2:#21123d;--plum:#2d1a50;--card:#251641;--card2:#2f1d52;--line:#4b3478;
  --moon:#fff1c1;--pumpkin:#ff8a24;--pumpkin2:#ffb347;--gold:#ffd54a;--potion:#8be36b;--rose:#ff6f91;--lilac:#b892ff;
  --text:#f7efe0;--muted:#c4b4e2;--ink:#1a0f2e;
  --display:'Mystery Quest','Georgia',serif;--body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night2);scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100vh;font-family:var(--body);font-weight:700;color:var(--text);font-size:17px;line-height:1.5;
  background:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 72% 9%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 38% 62%,#fff6 50%,transparent 51%),radial-gradient(1.2px 1.2px at 86% 44%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 55% 30%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 22% 84%,#fff5 50%,transparent 51%),
  radial-gradient(ellipse at 85% -10%,#4a2a7a 0%,transparent 55%),linear-gradient(180deg,var(--night) 0%,var(--night2) 100%);background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.15;margin:0 0 .3em}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem);color:var(--moon)}
h2{font-size:clamp(1.5rem,3.6vw,2rem);color:var(--moon)}
h3{margin:.2em 0;font-weight:900}
p{margin:.4em 0}
.nb{font-variant-numeric:tabular-nums;color:var(--pumpkin2);font-weight:900;white-space:nowrap}
.lead{color:var(--muted);max-width:62ch}
.note{color:var(--muted);font-size:.9rem}
.center{text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* cabecera */
.top{position:sticky;top:0;z-index:20;background:rgba(21,11,41,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.25rem;color:var(--moon);margin-right:auto}
.brand .bi{width:34px;height:34px;display:inline-block}.brand svg{width:100%;height:100%}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.pill span:first-child{width:26px;height:26px;display:inline-block}.pill svg{width:100%;height:100%}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:800;font-size:.92rem}
.icon-btn:hover{background:var(--card2)}

main{max-width:1080px;margin:0 auto;padding:18px 14px 50px}

/* botones */
.btn{background:linear-gradient(180deg,var(--pumpkin2),var(--pumpkin));color:var(--ink);border:0;border-radius:14px;padding:11px 20px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #a8480a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8480a}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--card2)}
.btn.danger{background:var(--rose);box-shadow:0 4px 0 #a33456}
.btn.sm{padding:7px 14px;font-size:.92rem;border-radius:11px}
.linkb{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:4px}

/* bienvenida */
.welcome{position:relative;text-align:center;padding:30px 10px 10px;display:flex;flex-direction:column;align-items:center}
.w-moon{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,var(--moon) 55%,#f0d98c);box-shadow:0 0 80px 20px rgba(255,241,193,.25);margin-bottom:-60px}
.w-cast{display:flex;gap:4px;justify-content:center;align-items:flex-end;position:relative;margin-bottom:14px}
.wc{display:block;width:clamp(58px,13vw,96px)}.wc svg{width:100%;display:block}
.wc0{transform:translateY(-14px)}.wc1{transform:translateY(-40px)}.wc4{width:clamp(70px,15vw,112px)}
@media (prefers-reduced-motion:no-preference){.wc0{animation:float 4s ease-in-out infinite}.wc1{animation:float 3s ease-in-out infinite .5s}}
@keyframes float{50%{translate:0 -8px}}
.welcome h1{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--pumpkin2);text-shadow:0 3px 0 #6b2b05,0 0 30px rgba(255,138,36,.45)}
.namebox{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin:16px auto 6px;max-width:520px;width:100%}
.namebox label{display:block;font-family:var(--display);font-size:1.4rem;color:var(--moon);margin-bottom:8px}
.nrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.nrow input{flex:1 1 200px;min-width:0;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--night);font-size:1.1rem}
.gen{border:0;padding:0;margin:14px 0 0;min-width:0}
.gen legend{font-family:var(--display);font-size:1.25rem;color:var(--moon);margin:0 auto 8px;padding:0}
.gen-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.namebox .gen-row label{position:relative;cursor:pointer;display:inline-block;margin:0;font-family:var(--body);font-size:1rem;color:var(--text)}
.gen-row input{position:absolute;opacity:0;width:1px;height:1px}
.gen-row span{display:inline-block;padding:8px 20px;border-radius:999px;background:var(--night);border:2px solid var(--line);font-weight:900}
.gen-row input:checked+span{background:var(--pumpkin);color:var(--ink);border-color:var(--pumpkin2)}
.gen-row input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}

/* mapa */
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.map{position:relative;aspect-ratio:1000/620;border-radius:22px;overflow:hidden;border:2px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-62%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:clamp(40px,7.4vw,74px)}
.pin-ico{width:100%;aspect-ratio:1;display:block;border-radius:50%;filter:drop-shadow(0 0 10px rgba(255,138,36,.45));transition:transform .15s}
.pin-ico svg{width:100%;height:100%;display:block}
.pin:hover .pin-ico{transform:scale(1.1)}
.pin.freed .pin-ico{filter:drop-shadow(0 0 12px rgba(255,213,74,.75))}
.pin.boss{width:clamp(48px,9vw,90px)}
.pin.locked .pin-ico{color:var(--muted);background:var(--card2);border:2px solid var(--line);padding:22%;filter:none}
.pin-n{position:absolute;top:-2px;left:-4px;background:var(--moon);color:var(--ink);border-radius:50%;width:clamp(16px,2.4vw,22px);height:clamp(16px,2.4vw,22px);font-size:clamp(.62rem,1.4vw,.8rem);font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px var(--ink)}
.pin-st{display:flex;gap:1px;margin-top:-2px}.pin-st svg{width:clamp(9px,1.6vw,15px)}
svg.on path{fill:var(--gold);stroke:#7a4b00;stroke-width:1.2}svg.off path{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.3);stroke-width:1.2}
.sech{margin-top:26px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.zone{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.zone.zboss{background:linear-gradient(135deg,#3a1f6b,#251641);border-color:var(--lilac)}
.zone.locked{opacity:.75}
.z-ico{flex:0 0 64px;height:64px}.z-ico svg{width:100%;height:100%}
.sil svg{filter:brightness(0) opacity(.45)}
.z-body{flex:1;min-width:0}.z-body h3{font-size:1.02rem;color:var(--moon)}.z-body p{margin:.1em 0;color:var(--muted);font-size:.9rem}
.z-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stars{display:flex;gap:2px}.stars svg{width:20px}

/* juego */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ph-l{display:flex;align-items:center;gap:10px}.ph-ico{width:54px;height:54px;flex:0 0 54px}.ph-ico svg{width:100%;height:100%}
.playhead h1{font-size:clamp(1.3rem,3.4vw,1.9rem);margin:0}.playhead p{margin:0;color:var(--muted);font-size:.92rem}
.streak{display:inline-block;margin-left:8px;background:var(--card2);border:1px solid var(--pumpkin);color:var(--pumpkin2);border-radius:999px;padding:0 9px;font-size:.82rem}
.hearts{display:flex;gap:3px}.hearts svg{width:30px}.hearts svg.on path{fill:var(--rose);stroke:#7a1d3a}
.prog{display:flex;gap:4px;margin:6px 0 12px;flex-wrap:wrap}
.pp{width:clamp(26px,6vw,38px);aspect-ratio:1;display:block;opacity:.4;filter:grayscale(1)}
.pp svg{width:100%;height:100%}
.pp.ok{opacity:1;filter:none}.pp.ko{opacity:.55;filter:grayscale(1) brightness(.55)}.pp.cur{opacity:1;filter:none;transform:translateY(-3px);border-bottom:3px solid var(--pumpkin);border-radius:4px}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.qk{margin:0 0 6px;color:var(--lilac);font-size:.9rem;font-weight:800}
.qq{font-size:clamp(1.08rem,2.4vw,1.28rem);line-height:1.55;margin-bottom:12px}
.qq .say{display:block;margin-top:8px;padding:10px 14px;border-left:4px solid var(--pumpkin);background:var(--night);border-radius:0 12px 12px 0;color:var(--moon);font-style:italic}
.expr,.cmpq{display:inline-block;font-variant-numeric:tabular-nums;font-size:1.25em;font-weight:900;color:var(--moon);background:var(--night);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin:4px 0;letter-spacing:.02em;white-space:nowrap}
.cmpq .box{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border:2px dashed var(--pumpkin);border-radius:8px;color:var(--pumpkin2);margin:0 .3em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips span{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums;font-weight:900}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:9px;margin:4px 0 6px}
.opt{text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;font-weight:800;line-height:1.35;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--lilac)}
.opt[aria-checked="true"]{border-color:var(--pumpkin);background:#43275f;box-shadow:inset 0 0 0 1px var(--pumpkin)}
.opt.right{border-color:var(--potion);background:#24442a}.opt.wrong{border-color:var(--rose);background:#4a1f35}
.opt:disabled{cursor:default}
.parts{display:flex;flex-direction:column;gap:10px}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow label{flex:0 1 min(48%,330px);color:var(--muted);font-size:.98rem}
.mulhold{display:flex;justify-content:flex-end;max-width:520px}
.mulparts{max-width:520px}
.mulparts .numrow{justify-content:space-between}
.mulparts .numin{margin-right:calc(var(--sh,0) * .62em)}
.mulparts .numrow.total{border-top:3px solid var(--moon);padding-top:10px;margin-top:2px}
@media (max-width:560px){.numrow label{flex-basis:100%}.mulparts .numrow label{flex-basis:auto;flex:1}}
.inw{display:inline-flex;align-items:center;gap:6px}
.numin{width:9.5ch;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--night);font-size:1.25rem;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.numin.wide{width:13ch}
.numin:focus{border-color:var(--pumpkin);outline:none;box-shadow:0 0 0 3px rgba(255,138,36,.35)}
.numin.right,.gc.right{border-color:var(--potion);background:#1f3a24}.numin.wrong,.gc.wrong{border-color:var(--rose);background:#3f1a2d}
.sol{flex-basis:100%;margin:0;color:var(--potion);font-size:.95rem}.sol:empty{display:none}
.unit{color:var(--muted)}

.cuenta{display:inline-flex;background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:0 0 12px;font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:900;color:var(--moon);letter-spacing:.18em}
.mulbox{flex-direction:column;align-items:flex-end;min-width:9ch}.mulbox .op{color:var(--pumpkin2);margin-right:.5em}.mulbox .line{align-self:stretch;border-top:3px solid var(--moon);margin-top:4px}
.divbox{align-items:flex-start;gap:6px}.divbox .dd{padding:2px 10px 2px 0}.divbox .ds{border-left:3px solid var(--moon)}.divbox .dv{border-bottom:3px solid var(--moon);padding:2px 10px}.divbox .dq{padding:2px 10px;color:var(--pumpkin2)}

.gridw{overflow-x:auto;padding:4px 0}
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:900;margin:0 auto 0 0}
.grid td{width:1.7em;height:1.7em;text-align:center;padding:0;color:var(--moon)}
.grid td.sg{color:var(--pumpkin2);width:1.2em}.grid td.cm{width:.7em;color:var(--pumpkin2)}.grid td.gh{color:#6c5a92}
.grid tr.ln td{height:6px;border-top:3px solid var(--moon)}
.gc{width:1.45em;height:1.6em;text-align:center;border-radius:8px;border:2px solid var(--line);background:var(--night);font-weight:900;font-size:1em;padding:0;caret-color:var(--pumpkin)}
.gc:focus{border-color:var(--pumpkin);outline:none;box-shadow:0 0 0 3px rgba(255,138,36,.35)}
.gnote{margin:6px 0 0;font-size:.82rem;color:var(--muted)}

.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px}
.sn{flex:0 0 34px;height:34px;border-radius:50%;background:var(--pumpkin);color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:1.05rem}
.steps li>div{flex:1;min-width:0}.steps h3{color:var(--moon);font-size:1.05rem}.steps .sub{color:var(--muted);font-size:.93rem;margin:.1em 0 .5em}

.hintbox{margin-top:12px;background:#2c2150;border:1px dashed var(--lilac);border-radius:14px;padding:10px 14px;color:var(--text)}
.fb{margin-top:12px;border-radius:16px}.fb:empty{display:none}
.fb.good,.fb.bad,.fb.warn{padding:12px 16px}
.fb.good{background:#1d3a24;border:2px solid var(--potion)}.fb.bad{background:#3d1a2e;border:2px solid var(--rose)}.fb.warn{background:#3a2a10;border:2px solid var(--gold)}
.fbt{font-weight:900;font-size:1.08rem;margin:0 0 4px}.exp{color:#efe6d6;line-height:1.6}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}

/* rincón */
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.friend{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.f-art{width:110px;height:110px;margin:0 auto}.f-art svg{width:100%;height:100%}
.friend h3{color:var(--moon)}.friend p{color:var(--muted);font-size:.9rem}

/* capas */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,4,22,.78);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto}
.ov-card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:calc(100vh - 32px);overflow:auto}
.ov-card.wide{max-width:780px;text-align:left}
.big-stars{display:flex;gap:8px;justify-content:center;margin:8px 0}.big-stars svg{width:56px}
.gain{color:var(--gold)}
.free-art{width:150px;height:150px;margin:0 auto}.free-art svg{width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.free-art{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.book h2{text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:8px 0}
.tab{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:800;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--pumpkin);color:var(--ink);border-color:var(--pumpkin)}
.bookc h3{color:var(--pumpkin2);margin-top:14px}.bookc p{line-height:1.6}
.bookc .eq{background:var(--night);border-left:4px solid var(--lilac);padding:8px 12px;border-radius:0 10px 10px 0;font-variant-numeric:tabular-nums}
.tblw{overflow-x:auto}
.pv{border-collapse:collapse;margin:6px 0;font-variant-numeric:tabular-nums}
.pv th,.pv td{border:1px solid var(--line);padding:4px 8px;text-align:center;font-size:.9rem}
.pv th{background:var(--card2);color:var(--moon)}.pv tr.ex td{color:var(--pumpkin2);font-weight:900;font-size:1.1rem}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--moon);color:var(--ink);padding:10px 18px;border-radius:14px;font-weight:900;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (max-width:560px){
  body{font-size:16px}
  .brand>span:last-child{font-size:1.02rem}
  .icon-btn{padding:4px 9px;font-size:.84rem}
  .pin-n{display:none}
  .acts .btn{flex:1}
  .grid{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.credit{text-align:center;font-size:.8rem;color:var(--muted);padding:0 14px 18px}
.credit a{color:inherit}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" id="brand"></div>
  <span class="pill" title="Caramelos"><span id="candyIco"></span><span id="candy">0</span></span>
  <button class="icon-btn" id="mapBtn" type="button" hidden>Mapa</button>
  <button class="icon-btn" id="nestBtn" type="button" hidden>Amigos</button>
  <button class="icon-btn" id="bookBtn" type="button" hidden>Grimorio</button>
  <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">Sonido: sí</button>
</div></header>
<main id="app"></main>

<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
/* =========================================================
   NÚCLEO MATEMÁTICO Y GENERADORES (sin DOM)
   ========================================================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const P10=e=>Math.pow(10,e);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};

/* ---------- formato español ---------- */
function fmtInt(n){const s=String(Math.trunc(Math.abs(n)));return (n<0?'−':'')+(s.length>=4?s.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):s)}
// v entero con e decimales; fix=true mantiene todos los decimales
function fmtS(v,e,fix){
  if(e===0)return fmtInt(v);
  const neg=v<0;v=Math.abs(v);
  const ip=Math.floor(v/P10(e));let d=String(v%P10(e)).padStart(e,'0');
  if(!fix)d=d.replace(/0+$/,'');
  return (neg?'−':'')+fmtInt(ip)+(d?','+d:'');
}
const fmtM=m=>fmtS(m,3);              // milésimas → texto
const fmtX=x=>fmtS(Math.round(x*1000),3); // número JS (≤3 decimales)
const M=x=>Math.round(x*1000);        // número → milésimas

/* ---------- lectura de números ---------- */
const UN=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const DE=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const CE=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
// modo: 'm' (uno), 'a' (apócope: un, veintiún), 'f' (femenino: una, veintiuna, doscientas)
function w99(r,mode){
  if(r<30){
    if(r===1)return mode==='a'?'un':mode==='f'?'una':'uno';
    if(r===21)return mode==='a'?'veintiún':mode==='f'?'veintiuna':'veintiuno';
    return UN[r];
  }
  const t=Math.floor(r/10),u=r%10;
  if(!u)return DE[t];
  return DE[t]+' y '+(u===1?(mode==='a'?'un':mode==='f'?'una':'uno'):UN[u]);
}
function w999(n,mode){
  const h=Math.floor(n/100),r=n%100;let s='';
  if(h){s=h===1?(r?'ciento':'cien'):(mode==='f'?CE[h].replace('ientos','ientas'):CE[h])}
  if(r)s+=(s?' ':'')+w99(r,mode);
  return s;
}
function words(n){
  if(n===0)return 'cero';
  const mi=Math.floor(n/1e6),th=Math.floor(n/1000)%1000,re=n%1000;const p=[];
  if(mi)p.push(mi===1?'un millón':w999(mi,'a')+' millones');
  if(th)p.push(th===1?'mil':w999(th,'a')+' mil');
  if(re)p.push(w999(re,'m'));
  return p.join(' ');
}
const PLACE_DEC=['','décima','centésima','milésima'];
// lectura escolar de un decimal: v entero con e decimales (e=1..3), parte entera 2..999
function wordsDec(v,e){
  const ip=Math.floor(v/P10(e)),dp=v%P10(e);
  const a=ip===1?'una unidad':w999(ip,'f')+' unidades';
  if(!dp)return a;
  const b=dp===1?'una '+PLACE_DEC[e]:w999(dp,'f')+' '+PLACE_DEC[e]+'s';
  return a+' y '+b;
}

/* ---------- lectura de entradas ---------- */
function parseNum(str,expectInt){
  let s=String(str).trim().replace(/[\s€]/g,'').replace(/[’']/g,'');
  if(!s)return NaN;
  if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){if(expectInt||(s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'')}
  if(!/^\d+(\.\d+)?$/.test(s)&&!/^\d*\.\d+$/.test(s))return NaN;
  return parseFloat(s);
}
const decimalsTyped=str=>{const s=String(str).trim().replace(/\s/g,'');const i=s.indexOf(',')>=0?s.indexOf(','):s.lastIndexOf('.');return i<0?0:s.length-i-1};
const near=(a,b)=>Math.abs(a-b)<1e-9*Math.max(1,Math.abs(b));

/* ---------- evaluador exacto de expresiones (fracciones) ---------- */
function fr(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return {n:n/g,d:d/g}}
const fadd=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d),fsub=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d),fmul=(a,b)=>fr(a.n*b.n,a.d*b.d),fdiv=(a,b)=>fr(a.n*b.d,a.d*b.n);
// devuelve {v:fracción, ok:bool, steps:[...]} ; ok=false si hay restas negativas, divisiones no exactas (modo natural) o división entre 0
function evalExpr(src,natural){
  const toks=src.replace(/\s+/g,'').match(/\d+(?:\.\d{3})*(?:,\d+)?|[+−×:()]/g);
  let i=0,ok=true;const steps=[];
  const num=t=>{let [a,b='']=t.replace(/\./g,'').split(',');return fr(parseInt(a+b,10),P10(b.length))};
  const show=f=>f.d===1?fmtInt(f.n):(Number.isInteger(f.n*1000/f.d)?fmtM(f.n*1000/f.d):f.n+'/'+f.d);
  function prim(){const t=toks[i++];if(t==='('){const v=sum();i++;return v}return num(t)}
  function prod(){let v=prim();while(toks[i]==='×'||toks[i]===':'){const o=toks[i++],w=prim();
      if(o==='×'){const r=fmul(v,w);steps.push(show(v)+' × '+show(w)+' = '+show(r));v=r}
      else{if(w.n===0){ok=false;return v}const r=fdiv(v,w);if(natural&&r.d!==1)ok=false;steps.push(show(v)+' : '+show(w)+' = '+show(r));v=r}}
    return v}
  function sum(){let v=prod();while(toks[i]==='+'||toks[i]==='−'){const o=toks[i++],w=prod();
      const r=o==='+'?fadd(v,w):fsub(v,w);if(r.n<0)ok=false;steps.push(show(v)+' '+o+' '+show(w)+' = '+show(r));v=r}
    return v}
  const v=sum();
  return {v,ok:ok&&i===toks.length,steps,val:v.n/v.d};
}

/* ---------- utilidades de números ---------- */
const PLN=['unidades','decenas','centenas','unidades de millar','decenas de millar','centenas de millar','unidades de millón','decenas de millón','centenas de millón'];
const PLN1=['unidad','decena','centena','unidad de millar','decena de millar','centena de millar','unidad de millón','decena de millón','centena de millón'];
const digitsOf=n=>String(n).split('').map(Number);
function randNat(len,zeroP=.3){let s=String(R(1,9));for(let i=1;i<len;i++)s+=Math.random()<zeroP?'0':String(R(1,9));return parseInt(s,10)}
// variantes cercanas para distractores: intercambia cifras vecinas distintas
function variants(n,count){
  const s=String(n),out=new Set();
  for(let i=0;i<s.length-1;i++){if(s[i]!==s[i+1]){const t=s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2);if(t[0]!=='0')out.add(parseInt(t,10))}}
  for(let k=0;k<20&&out.size<count+4;k++){const i=R(1,s.length-1);const t=s.slice(0,i)+String((+s[i]+R(1,9))%10)+s.slice(i+1);out.add(parseInt(t,10))}
  out.delete(n);return shuffle([...out]).slice(0,count);
}
function decompose(n){const s=String(n),L=s.length,p=[];for(let i=0;i<L;i++)if(s[i]!=='0')p.push(fmtInt(+s[i]*P10(L-1-i)));return p.join(' + ')}
function roundTo(v,unit){return Math.floor((v+unit/2)/unit)*unit} // redondeo hacia arriba en el 5 (enteros no negativos)

/* ---------- construcción de preguntas ----------
   Cada pregunta: {k:etiqueta, q:enunciado html, parts:[...], exp:explicación html, hint}
   part choice: {t:'c', opts:[html], ans:índice}
   part num:    {t:'n', label, ans:número, alts:[...], int:bool, check?:fn(str)->bool, show:texto respuesta}
   part grid:   {t:'g', a,b (enteros), e (decimales), ea, eb, op:'+'|'-'}
*/
function choice(correct,wrongs){
  const w=[...new Set(wrongs)].filter(x=>x!==correct);
  const opts=shuffle([correct,...w]);return {t:'c',opts,ans:opts.indexOf(correct)};
}
const num=(ans,o={})=>({t:'n',ans,alts:o.alts||[],int:Number.isInteger(ans),label:o.label||'',show:o.show||fmtX(ans),unit:o.unit||'',check:o.check,wide:o.wide});

function randDec(e,ipMin=2,ipMax=99,noEndOne=true){
  for(;;){const ip=R(ipMin,ipMax);const dp=R(1,P10(e)-1);if(dp%10===0)continue;if(noEndOne&&(dp%10===1||ip%10===1))continue;return ip*P10(e)+dp}
}

   for(const e2 of [1,2,3])if(e2!==e&&dp<P10(e2))cand.push([ip*P10(e2)+dp,e2]);
   const s=String(dp).padStart(e,'0');

/* ======================= ZONA 4: COMPARACIÓN ======================= */

/* ======================= ZONA 5: SUMAS Y RESTAS ======================= */

/* ======================= ZONA 7: DIVISIÓN ======================= */

/* ======================= ZONA 8: OPERACIONES COMBINADAS ======================= */
const TPL=[
  v=>`${v[0]} + ${v[1]} × ${v[2]} − ${v[3]}`,
  v=>`${v[0]} − ${v[1]} × (${v[2]} − ${v[3]})`,
  v=>`(${v[0]} + ${v[1]}) : ${v[2]} + ${v[3]} × ${v[4]}`,
  v=>`${v[0]} × ${v[1]} − ${v[2]} : ${v[3]}`,
  v=>`${v[0]} − (${v[1]} + ${v[2]}) : ${v[3]} × ${v[4]}`,
  v=>`(${v[0]} − ${v[1]}) × (${v[2]} + ${v[3]}) : ${v[4]}`,
  v=>`${v[0]} + ${v[1]} × ${v[2]} : ${v[3]} − ${v[4]}`,
  v=>`${v[0]} : ${v[1]} × ${v[2]} + ${v[3]}`,
  v=>`${v[0]} × (${v[1]} − ${v[2]} : ${v[3]}) − ${v[4]}`
];
function genExpr(){
  for(let t=0;t<5000;t++){
    const f=pick(TPL);const v=[R(10,99),R(2,15),R(2,15),R(2,12),R(2,9)];
    if(Math.random()<.5)v[0]=R(2,15);
    const s=f(v);const r=evalExpr(s,true);
    if(r.ok&&r.v.d===1&&r.val>0&&r.val<=999&&r.steps.length>=3&&!r.steps.some(x=>/= [01]$/.test(x)))return {s,r};
  }
}
const OPC=[
 function combinada(){
   const {s,r}=genExpr();
   return {k:'Operaciones combinadas',q:`Calcula: <span class="expr">${s}</span>`,parts:[num(r.val)],
     exp:`Orden: paréntesis → multiplicaciones y divisiones (de izquierda a derecha) → sumas y restas (de izquierda a derecha).<br>${r.steps.join('<br>')}<br>Resultado: ${B(fmtInt(r.val))}.`,hint:'Primero los paréntesis; luego × y : de izquierda a derecha; al final + y −.'};
 },
 function combinada2(){return OPC[0]()},
 function primera(){
   const T=[
    ()=>{const a=R(10,40),b=R(2,9)*R(2,5),c=0;const bb=R(2,9),cc=R(2,9),dd=R(2,9);const B1=bb*cc;return [`${a} + ${B1} : ${cc} × ${dd}`,`${B1} : ${cc}`,[`${a} + ${B1}`,`${cc} × ${dd}`,`${a} + ${B1} : ${cc}`]]},
    ()=>{const a=R(3,9),b=R(2,9),c=R(10,30),d=R(2,9);return [`${a} × ${b} − ${c} + ${d}`,`${a} × ${b}`,[`${c} + ${d}`,`${b} − ${c}`,`${a} × ${b} − ${c}`]]},
    ()=>{const a=R(20,60),b=R(2,9),c=R(10,20),d=R(2,9);return [`${a} − ${b} × (${c} − ${d})`,`${c} − ${d}`,[`${a} − ${b}`,`${b} × ${c}`,`${a} − ${b} × ${c}`]]},
    ()=>{const a=R(20,60),b=R(2,9),c=R(2,9),d=R(2,9);return [`${a} − ${b} + ${c} × ${d}`,`${c} × ${d}`,[`${a} − ${b}`,`${b} + ${c}`,`${a} − ${b} + ${c}`]]},
    ()=>{const c=R(2,9),b=c*R(2,9),a=R(10,50),d=R(2,9);return [`${a} + ${d} × ${b} : ${c}`,`${d} × ${b}`,[`${b} : ${c}`,`${a} + ${d}`,`${a} + ${d} × ${b}`]]}
   ];const [e,ok,wr]=pick(T)();
   return {k:'Jerarquía de operaciones',q:`En <span class="expr">${e}</span>, ¿qué operación se hace ${B('en primer lugar')}?`,parts:[choice(ok,wr)],
     exp:`Primero: ${B(ok)}. Los paréntesis van antes que nada; después, multiplicaciones y divisiones en el orden en que aparecen (de izquierda a derecha); al final, sumas y restas.`,hint:'Si hay × y : seguidas, gana la que está más a la izquierda.'};
 },
 function parentesis(){
   for(let t=0;t<500;t++){
     const a=R(2,12),b=R(2,12),c=R(2,12),d=R(2,9);
     const plain=`${a} + ${b} × ${c} − ${d}`;
     const forms=[`(${a} + ${b}) × ${c} − ${d}`,`${a} + ${b} × (${c} − ${d})`,`(${a} + ${b}) × (${c} − ${d})`,plain];
     const ev=forms.map(f=>evalExpr(f,true));if(!ev.every(x=>x.ok&&x.val>0))continue;
     if(new Set(ev.map(x=>x.val)).size<4)continue;
     const target=pick([0,1,2]);const val=ev[target].val;
     return {k:'Uso del paréntesis',q:`¿Dónde hay que poner paréntesis para que ${B(plain)} dé ${B(val)}?`,
       parts:[choice(forms[target],forms.filter((_,i)=>i!==target).map(f=>f===plain?f+' (sin paréntesis)':f))],
       exp:`${forms[target]}:<br>${ev[target].steps.join('<br>')}<br>= ${B(val)}. Sin paréntesis saldría ${ev[3].val}.`,hint:'Calcula cada opción. El paréntesis cambia qué se hace primero.'};
   }
 },
 function decimalComb(){
   for(let t=0;t<3000;t++){
     const f=pick([v=>`${v[0]} × ${v[1]} + ${v[2]} : ${v[3]}`,v=>`${v[0]} − ${v[1]} × ${v[2]}`,v=>`(${v[0]} + ${v[1]}) × ${v[3]}`,v=>`${v[2]} : ${v[3]} + ${v[0]}`]);
     const v=[fmtS(decN(1,1,9),1,true),String(R(2,9)),fmtS(decN(1,2,40),1,true),String(R(2,8))];
     const s=f(v);const r=evalExpr(s,false);
     if(!r.ok||r.val<=0)continue;const m=r.v.n*1000/r.v.d;if(!Number.isInteger(m))continue;
     return {k:'Combinadas con decimales',q:`Calcula: <span class="expr">${s}</span>`,parts:[num(m/1000,{dec:1,show:fmtM(m)})],
       exp:`${r.steps.join('<br>')}<br>Resultado: ${B(fmtM(m))}.`,hint:'Respeta la jerarquía igual que con naturales. Cuidado con la coma en cada paso.'};
   }
 },
 function expresion(){
   const name='{N}';const T=[
    ()=>{const a=R(3,9),b=R(12,25),c=R(4,11);return [`${name} compra ${a} paquetes de ${b} caramelos y regala ${c}. ¿Qué expresión calcula los caramelos que le quedan?`,`${a} × ${b} − ${c}`,[`${a} × (${b} − ${c})`,`${a} + ${b} − ${c}`,`(${a} − ${c}) × ${b}`]]},
    ()=>{const a=R(3,6),b=R(2,4)*a*R(2,5),c=R(2,5);return [`Hay ${b} calabazas y se reparten entre ${a} casas. Después, cada casa compra ${c} más. ¿Qué expresión indica las calabazas de cada casa?`,`${b} : ${a} + ${c}`,[`${b} : (${a} + ${c})`,`(${b} + ${c}) : ${a}`,`${b} − ${a} + ${c}`]]},
    ()=>{const a=R(3,8),b=R(2,6),c=R(2,6);return [`Una bruja tiene ${a} gatos y ${b} murciélagos. Cada animal recibe ${c} galletas. ¿Qué expresión calcula el total de galletas?`,`(${a} + ${b}) × ${c}`,[`${a} + ${b} × ${c}`,`${a} × ${b} + ${c}`,`${a} × ${c} + ${b}`]]},
    ()=>{const a=R(20,50),b=R(2,6),c=R(2,5);return [`${name} tiene ${a} €. Compra ${b} máscaras de ${c} € cada una. ¿Qué expresión calcula el dinero que le queda?`,`${a} − ${b} × ${c}`,[`(${a} − ${b}) × ${c}`,`${a} − ${b} + ${c}`,`${a} × ${b} − ${c}`]]}
   ];const [q,ok,wr]=pick(T)();const ev=evalExpr(ok,true);
   return {k:'Expresiones y problemas',q,parts:[choice(ok,wr)],
     exp:`La expresión es ${B(ok)}${ev.ok?' = '+fmtX(ev.val):''}. ¡El paréntesis solo hace falta si una suma o resta debe hacerse antes!`,hint:'Piensa qué se calcula primero en la historia y comprueba si la jerarquía lo respeta.'};
 }
];

 <p class="eq">4.738.512 a las centenas de millar → 4.700.000<br>15,768 a las décimas → 15,8 &nbsp; a las centésimas → 15,77 &nbsp; a las unidades → 16</p>
 <h3>¡Cuidado con los nueves!</h3><p>3,97 redondeado a las décimas → 4,0 (el 9 sube y se lleva una).</p>
 <h3>Estimar</h3><p>Redondea los números antes de operar para saber más o menos el resultado: 4.682 + 2.317 ≈ 4.700 + 2.300 = 7.000.</p>
 <h3>En los problemas</h3><p>A veces no sirve redondear al más cercano: si necesitas 1.432 caramelos y van en bolsas de 100, necesitas 15 bolsas, no 14.</p>`,
 cmp:`<h3>Comparar decimales</h3><p>1. Compara la parte entera.<br>2. Si es igual, compara las décimas; después, centésimas; después, milésimas.</p>
 <h3>El truco de los ceros</h3><p>Iguala las cifras decimales añadiendo ceros: 3,9 y 3,45 → 3,90 &gt; 3,45.</p>
 <h3>¡No te dejes engañar!</h3><p>Tener más cifras no significa ser mayor: 4,07 &lt; 4,7 y 2,999 &lt; 3.</p>
 <h3>Siempre cabe otro</h3><p>Entre dos decimales siempre hay más números. Entre 6,4 y 6,5: 6,41, 6,42… Entre 6,45 y 6,46: 6,451, 6,452…<br>El número del medio entre 7,3 y 7,4 es 7,35.</p>`,
 sum:`<h3>Sumar y restar decimales</h3><p>Colócalos en columna con las <b>comas alineadas</b> (unidades debajo de unidades). Rellena con ceros los huecos de la derecha.</p>
 <p class="eq">52 − 7,36 → 52,00 − 7,36 = 44,64</p>
 <h3>Prueba de la resta</h3><p>diferencia + sustraendo = minuendo</p>
 <h3>Término desconocido</h3><p>? + 3,75 = 10 → 10 − 3,75 = 6,25<br>15,2 − ? = 7,85 → 15,2 − 7,85 = 7,35</p>`,
 mul:`<h3>Multiplicar por tres cifras</h3><p>Multiplica por las unidades, después por las decenas (corriendo un lugar a la izquierda) y después por las centenas (corriendo dos lugares). Suma los productos parciales.</p>
 <p>Si el multiplicador tiene un 0 en medio, puedes saltar esa fila, pero la siguiente se corre <b>dos</b> lugares.</p>
 <h3>Multiplicar decimales</h3><p>Multiplica sin comas. El producto lleva tantas cifras decimales como tengan los dos factores juntos.</p>
 <p class="eq">2,6 × 1,35 → 26 × 135 = 3.510 → 1 + 2 = 3 decimales → 3,510 = 3,51</p>
 <h3>Por 10, 100 y 1.000</h3><p>La coma se mueve a la derecha 1, 2 o 3 lugares. Si faltan cifras, se añaden ceros: 4,07 × 1.000 = 4.070.</p>`,
 div:`<h3>Los términos</h3><p>Dividendo : divisor = cociente, y queda un resto.</p>
 <p class="eq">Dividendo = divisor × cociente + resto<br>El resto siempre es menor que el divisor</p>
 <p>Si el resto es 0, la división es <b>exacta</b>; si no, es <b>entera</b>.</p>
 <h3>Dividir entre dos cifras</h3><p>1. Toma cifras del dividendo hasta que el divisor quepa (dos o tres).<br>2. Estima cuántas veces cabe, multiplica y resta.<br>3. Baja la siguiente cifra y repite.<br>4. Si al bajar una cifra el divisor no cabe, escribe <b>0</b> en el cociente.</p>
 <h3>¿Cuántas cifras tendrá el cociente?</h3><p>Una por la primera parte que tomas y otra por cada cifra que bajas. 7.452 : 86 → empiezo con 745 → quedan por bajar 1 cifra → 2 cifras.</p>`,
 opc:`<h3>El orden de las operaciones</h3><p>1. Primero, lo que está entre <b>paréntesis</b>.<br>2. Después, <b>multiplicaciones y divisiones</b>, de izquierda a derecha.<br>3. Al final, <b>sumas y restas</b>, de izquierda a derecha.</p>
 <p class="eq">48 − 6 × (12 − 5) + 36 : 4<br>= 48 − 6 × 7 + 36 : 4<br>= 48 − 42 + 9<br>= 6 + 9 = 15</p>
 <h3>El poder del paréntesis</h3><p>(8 + 4) × 3 = 36, pero 8 + 4 × 3 = 20. ¡El paréntesis cambia el resultado!</p>`,
 pro:`<h3>Los cuatro pasos</h3><p><b>1. Comprendo.</b> Leo despacio. ¿Qué me preguntan? ¿Qué datos tengo? ¿Sobra algún dato?<br>
 <b>2. Planifico.</b> ¿Qué operaciones necesito y en qué orden? Puedo escribirlo como una operación combinada.<br>
 <b>3. Calculo.</b> Hago las operaciones con cuidado.<br>
 <b>4. Compruebo.</b> ¿He respondido a la pregunta? ¿El resultado es razonable? (Estima.) ¿He puesto las unidades: €, kg, caramelos…?</p>
 <h3>Pistas</h3><p>«Repartir a partes iguales» → división. «En total» con grupos iguales → multiplicación. «¿Cuánto le devuelven?» → resta. Si la pregunta es «como mínimo», piensa si hay que redondear por arriba.</p>`
};

function buildRound(id){
  const qs=[];const seen=new Set();
  if(id==='boss'){
    const zs=shuffle(ZID.filter(k=>k!=='boss'));const list=[...zs,...shuffle(zs).slice(0,3)];
    list.forEach(z=>{let q,t=0;do{q=pick(BANKS[z])();t++}while(seen.has(q.q)&&t<20);seen.add(q.q);q.zone=z;qs.push(q)});
    return shuffle(qs);
  }
  const bank=BANKS[id];let order=[];
  while(order.length<8){let s=shuffle(bank.map((_,i)=>i));if(order.length&&s[0]===order[order.length-1])s.push(s.shift());order=order.concat(s)}
  order=order.slice(0,8);
  order.forEach(i=>{let q,t=0;do{q=bank[i]();t++}while(seen.has(q.q)&&t<20);seen.add(q.q);q.zone=id;qs.push(q)});
  return qs;
}

function layoutHTML(q){

function partHTML(p,k,sh){
  if(p.t==='c')return `<div class="opts" role="radiogroup" data-p="${k}">${p.opts.map((o,j)=>`<button type="button" class="opt" role="radio" aria-checked="false" data-j="${j}">${o}</button>`).join('')}</div>`;

  if(p.t==='g')return gridHTML(p,k);

function digitsSplit(v,ea,e){const ip=String(Math.floor(v/Math.pow(10,ea)));const dp=ea?String(v%Math.pow(10,ea)).padStart(ea,'0'):'';return {ip,dp,ghost:e-ea}}
function gridHTML(p,k){
  const A=digitsSplit(p.a,p.ea,p.e),Bv=digitsSplit(p.b,p.eb,p.e);
  const I=Math.max(A.ip.length,Bv.ip.length)+(p.op==='+'?1:0);const E=p.e;
  const row=(D,sign)=>{let h=`<td class="sg">${sign}</td>`;const pad=I-D.ip.length;for(let i=0;i<I;i++)h+=`<td>${i<pad?'':D.ip[i-pad]}</td>`;if(E){h+=`<td class="cm">,</td>`;for(let i=0;i<E;i++)h+=i<D.dp.length?`<td>${D.dp[i]}</td>`:`<td class="gh">0</td>`}else if(D.ip)h+='';return `<tr>${h}</tr>`};
  let res=`<td class="sg"></td>`;for(let i=0;i<I+E;i++){if(E&&i===I)res+=`<td class="cm">,</td>`;res+=`<td><input class="gc" data-c="${i}" inputmode="numeric" maxlength="1" aria-label="Cifra ${i+1} del resultado" autocomplete="off"></td>`}
  return `<div class="gridw" data-p="${k}"><table class="grid" data-i="${I}" data-e="${E}">${row(A,'')}${row(Bv,p.op)}<tr class="ln"><td colspan="${I+E+(E?2:1)}"></td></tr><tr class="res">${res}</tr></table><p class="gnote">Los ceros grises no se ven en el número, pero ayudan a colocar bien la coma.</p><p class="sol"></p></div>`;
}
function wireParts(q){
  document.querySelectorAll('#qcard .opts').forEach(g=>{g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(G.done)return;g.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked','false'));b.setAttribute('aria-checked','true');sfx.tap()})});
  document.querySelectorAll('#qcard .numin').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();G.done?next():check()}}));
  document.querySelectorAll('#qcard .grid').forEach(t=>{
    const cells=[...t.querySelectorAll('input.gc')];
    cells.forEach((c,i)=>{
      c.addEventListener('input',()=>{c.value=c.value.replace(/\D/g,'').slice(-1);if(c.value&&i>0)cells[i-1].focus()});
      c.addEventListener('keydown',e=>{
        if(e.key==='Backspace'&&!c.value&&i<cells.length-1){e.preventDefault();cells[i+1].focus();cells[i+1].value=''}
        else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();cells[i-1].focus()}
        else if(e.key==='ArrowRight'&&i<cells.length-1){e.preventDefault();cells[i+1].focus()}
        else if(e.key==='Enter'){e.preventDefault();G.done?next():check()}});
    });
  });
}
function readGrid(el,p){
  const t=el.querySelector('.grid');const I=+t.dataset.i,E=+t.dataset.e;const v=[...t.querySelectorAll('input.gc')].map(c=>c.value);
  if(v.every(x=>!x))return null;
  let ip=v.slice(0,I),dp=v.slice(I);
  let s=0;while(s<ip.length&&!ip[s])s++;ip=ip.slice(s);if(ip.some(x=>!x))return NaN;
  let e=dp.length;while(e>0&&!dp[e-1])e--;const dd=dp.slice(0,e);if(dd.some(x=>!x))return NaN;
  const str=(ip.join('')||'0')+dd.join('').padEnd(E,'0');
  return parseInt(str,10);
}
function evalPart(p,k){
  const el=document.querySelector(`#qcard [data-p="${k}"]`);
  if(p.t==='c'){const s=el.querySelector('.opt[aria-checked="true"]');if(!s)return {empty:true};return {ok:+s.dataset.j===p.ans,el}}
  if(p.t==='n'){const v=el.querySelector('input').value;if(!v.trim())return {empty:true};
    if(p.check)return {ok:p.check(v),el};
    const n=parseNum(v,p.int);if(isNaN(n))return {ok:false,el,bad:true};return {ok:[p.ans,...p.alts].some(a=>near(n,a)),el}}
  if(p.t==='g'){const r=readGrid(el,p);if(r===null)return {empty:true};return {ok:r===p.res,el}}
}
function check(){
  if(G.done)return;
  const q=G.qs[G.i];const all=[...(q.plan?[[q.plan,'plan']]:[]),...q.parts.map((p,k)=>[p,k])];
  const R=all.map(([p,k])=>({p,k,...evalPart(p,k)}));
  if(R.some(r=>r.empty)){$('#fb').className='fb warn';$('#fb').innerHTML=q.prob?'Completa todos los pasos antes de comprobar.':'Te falta responder alguna parte.';return}
  G.done=true;const ok=R.every(r=>r.ok);
  R.forEach(({p,k,ok:o,el})=>{
    if(p.t==='c'){el.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===p.ans)b.classList.add('right');else if(b.getAttribute('aria-checked')==='true')b.classList.add('wrong')})}
    if(p.t==='n'){const i=el.querySelector('input');i.disabled=true;i.classList.add(o?'right':'wrong');if(!o)el.querySelector('.sol').innerHTML=`Solución: <b class="nb">${p.show}${p.unit?' '+p.unit:''}</b>`}
    if(p.t==='g'){el.querySelectorAll('input').forEach(i=>{i.disabled=true;i.classList.add(o?'right':'wrong')});if(!o)el.querySelector('.sol').innerHTML=`Solución: <b class="nb">${fmtS(p.res,p.e,true)}</b>`}
  });
  G.res[G.i]=ok;
  if(ok){G.correct++;G.streak++;G.best=Math.max(G.best,G.streak);const g=10+(G.streak>=3?5:0);S.candy+=g;G.gained+=g;save();header();bump();sfx.ok()}
  else{G.streak=0;if(G.id==='boss')G.hearts--;sfx.bad()}
  const praise=['¡Hechizo perfecto!',personal('{¡Bruja-genial!|¡Brujo-genial!}'),'¡Calabaza encendida!','¡Eso es magia de la buena!','¡Exacto!','¡Brillante como la luna!'];
  const oops=['¡Casi! Mira cómo se hace:','Este hechizo se resiste. Fíjate:','Uy, se ha escapado un murciélago. Revisa:'];
  $('#fb').className='fb '+(ok?'good':'bad');
  $('#fb').innerHTML=`<p class="fbt">${ok?pick(praise)+(G.streak>=3?' Racha de '+G.streak+': +5 caramelos extra.':''):pick(oops)}</p><div class="exp">${q.exp}</div>`;
  const pr=document.querySelector('.prog');if(pr)pr.outerHTML=progressBar();
  if(G.id==='boss'){const h=document.querySelector('.hearts');if(h)h.innerHTML=[0,1,2].map(k=>ART.heart(k<G.hearts)).join('')}
  $('#hintBtn').hidden=true;
  const last=G.i===G.qs.length-1||(G.id==='boss'&&G.hearts<=0);
  const b=$('#checkBtn');b.textContent=last?'Ver resultado':'Siguiente';b.onclick=next;b.focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:RM()?'auto':'smooth',block:'nearest'});
}
function next(){
  const last=G.i===G.qs.length-1||(G.id==='boss'&&G.hearts<=0);
  if(last){finish();return}
  G.i++;G.done=false;showQ();window.scrollTo({top:0,behavior:'auto'});
}
function finish(){
  const {id,correct,qs}=G;let stars;
  if(id==='boss')stars=G.hearts>0?G.hearts:0;
  else stars=correct>=7?3:correct>=5?2:correct>=4?1:0;
  const bonus=stars*20;S.candy+=bonus;G.gained+=bonus;
  const firstFree=stars>0&&!S.freed[id];const improved=stars>S.stars[id];
  if(improved)S.stars[id]=stars;if(firstFree)S.freed[id]=true;save();header();
  const z=G.z;
  const msg=stars===3?'¡Tres estrellas! Eres pura magia matemática.':stars===2?'¡Muy bien! Te falta muy poco para las tres estrellas.':stars===1?'¡Conseguido! Vuelve otro día a por más estrellas: las preguntas cambian cada vez.':(id==='boss'?'El Castillo de la Luna es el reto más difícil. Repasa el Grimorio y vuelve a intentarlo.':(S.freed[id]?'Esta vez no has conseguido estrellas. Repasa el Grimorio y vuelve a intentarlo: ¡las preguntas cambian cada vez!':`${z.fname} sigue atrapado: necesitas 4 aciertos. Repasa el Grimorio y vuelve a intentarlo.`));
  const showRes=()=>{
    if(stars>0)sfx.win();
    showOv(`<h2>${stars>0?'¡Reto superado!':'¡Casi lo tienes!'}</h2>
    <div class="big-stars">${[0,1,2].map(i=>ART.star(i<stars)).join('')}</div>
    <p>${id==='boss'?(G.hearts>0?`Has llegado con ${G.hearts} ${G.hearts===1?'vida':'vidas'}.`:'Te has quedado sin vidas.'):`Has acertado ${correct} de ${qs.length}.`} Mejor racha: ${G.best}. Caramelos: <b class="gain">+${G.gained}</b></p>
    <p>${msg}${improved&&!firstFree&&stars>0?' ¡Nuevo récord de estrellas!':''}</p>
    <div class="center"><button class="btn ghost" id="again" type="button">Otra ronda aquí</button><button class="btn" id="tomap" type="button">Volver al mapa</button></div>`);
    $('#again').onclick=()=>{hideOv();start(id)};$('#tomap').onclick=()=>{hideOv();map()};
  };
  if(firstFree){
    showOv(`<div class="free"><div class="free-art">${ART[z.friend]()}</div><h2>${id==='boss'?'¡Ha aparecido '+z.fname+'!':'¡Has liberado a '+z.fname+'!'}</h2><p>${personal(BIO[id])}</p>
     <div class="center"><button class="btn" id="okfree" type="button">¡Genial!</button></div></div>`);
    confetti();sfx.win();
    $('#okfree').onclick=()=>{hideOv();setTimeout(showRes,120)};
  }else showRes();
}

/* =========================================================
   RINCÓN ENCANTADO (colección)
   ========================================================= */
function nest(){
  G=null;header();$('#mapBtn').hidden=false;
  const n=ZID.filter(k=>S.freed[k]).length;
  $('#app').innerHTML=`<section class="nest"><h1>El rincón encantado de ${NM()}</h1><p class="lead">Amigos liberados: ${n} de ${ZID.length}. Caramelos: ${S.candy}. Rango: ${rank()}.</p>
  <div class="friends">${ZONES.map(z=>{const f=S.freed[z.id];return `<article class="friend ${f?'':'sil'}"><div class="f-art">${ART[z.friend]()}</div><h3>${f?z.fname.charAt(0).toUpperCase()+z.fname.slice(1):'¿Quién será?'}</h3><p>${f?personal(BIO[z.id]):'Sigue atrapado en '+z.name+'.'}</p></article>`}).join('')}</div>
  <div class="center"><button class="btn ghost" id="reset" type="button">Borrar mi progreso</button><button class="btn" id="back" type="button">Volver al mapa</button></div></section>`;
  $('#back').onclick=()=>map();
  $('#reset').onclick=()=>{showOv(`<h2>¿Borrar el progreso?</h2><p>Se perderán las estrellas, los caramelos y los amigos liberados de ${NM()}. No se puede deshacer.</p><div class="center"><button class="btn ghost" id="no" type="button">No, mejor no</button><button class="btn danger" id="yes" type="button">Sí, borrar</button></div>`);
    $('#no').onclick=hideOv;$('#yes').onclick=()=>{const nm=S.name,gn=S.gen,snd=S.sound;S=JSON.parse(JSON.stringify(DEF));S.name=nm;S.gen=gn;S.sound=snd;save();hideOv();map(true)}};
}

/* =========================================================
   GRIMORIO
   ========================================================= */
function book(tab){
  tab=tab||(G&&G.id!=='boss'?G.id:'nat');
  showOv(`<div class="book"><h2>El Grimorio de ${NM()}</h2><p class="center">Los conjuros de los números naturales y decimales.</p>
  <div class="tabs" role="tablist">${ZONES.filter(z=>z.id!=='boss').map(z=>`<button class="tab" type="button" role="tab" aria-selected="${z.id===tab}" data-k="${z.id}">${['Naturales','Decimales','Aproximar','Comparar','Sumar y restar','Multiplicar','Dividir','Combinadas','Problemas'][ZID.indexOf(z.id)]}</button>`).join('')}</div>
  <div class="bookc">${BOOK[tab]}</div>
  <div class="center"><button class="btn" id="bookClose" type="button">Cerrar el Grimorio</button></div></div>`,true);
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>book(t.dataset.k));
  $('#bookClose').onclick=hideOv;
  const sel=document.querySelector('.tab[aria-selected="true"]');if(sel)sel.scrollIntoView({block:'nearest',inline:'center'});
}

/* =========================================================
   CAPAS, AVISOS Y EFECTOS
   ========================================================= */
let lastFocus=null;
function showOv(html,wide){lastFocus=document.activeElement;$('#ovRoot').innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="ov-card ${wide?'wide':''}">${html}</div></div>`;const b=$('#ovRoot').querySelector('button');if(b)b.focus({preventScroll:true})}
function hideOv(){$('#ovRoot').innerHTML='';if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ovRoot').innerHTML&&$('#bookClose'))hideOv()});
let tT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2600)}
function confetti(){
  if(RM())return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff8a24','#ffd54a','#8be36b','#b892ff','#ff6f91','#fff1c1'];
  const L=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*6+5,c:pick(cols),a:Math.random()*6,s:Math.random()<.4}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);L.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.a+=.2;x.save();x.globalAlpha=Math.max(0,1-t/110);x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;if(q.s){x.beginPath();x.arc(0,0,q.r/2,0,7);x.fill()}else{x.fillRect(-q.r/2,-q.r/4,q.r,q.r/2);x.beginPath();x.moveTo(-q.r/2,0);x.lineTo(-q.r,-q.r/3);x.lineTo(-q.r,q.r/3);x.fill();x.beginPath();x.moveTo(q.r/2,0);x.lineTo(q.r,-q.r/3);x.lineTo(q.r,q.r/3);x.fill()}x.restore()});if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

/* =========================================================
   ARRANQUE
   ========================================================= */
$('#mapBtn').onclick=()=>{if(G&&(G.i>0||G.done)&&!(G.done&&G.i===G.qs.length-1)){showOv(`<h2>¿Volver al mapa?</h2><p>Si sales ahora, perderás esta ronda (los caramelos ganados se quedan).</p><div class="center"><button class="btn ghost" id="stay" type="button">Seguir jugando</button><button class="btn" id="leave" type="button">Volver al mapa</button></div>`);$('#stay').onclick=hideOv;$('#leave').onclick=()=>{hideOv();map()}}else map()};
$('#bookBtn').onclick=()=>book();
$('#nestBtn').onclick=()=>nest();
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();header();sfx.tap()};
if(S.name&&S.gen)map();else welcome();

</script>
</body>
