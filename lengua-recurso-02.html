<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reino Arcoíris · Lengua 5.º</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800;900&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: a portal opens into a panoramic world map; each place zooms in ("¡PUM!") to a themed scene where challenge cards pop up. Deliberate single pastel-rainbow theme. */
:root{
  --ink:#2b2350; --ink-soft:#5d5487; --card:#ffffff; --card-2:#f6f3ff; --line:#ddd5f5;
  --gold:#ffc83d; --gold-dk:#a86f00; --good:#1f9d5a; --good-bg:#dcf7e8; --bad:#d63a52; --bad-bg:#ffe3e8;
  --accent:#8a5ce6; --accent-dk:#5f37b5;
  --bgA:#bde4ff; --bgB:#ffe9f4;
  --f-display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--bgA),var(--bgB));background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100vh;transition:background .6s}
body[data-scene="voc"]{--bgA:#c4e6ff;--bgB:#efe4ff;--accent:#8a5ce6;--accent-dk:#5f37b5}
body[data-scene="gra"]{--bgA:#d3f6e0;--bgB:#fff8d6;--accent:#22a36a;--accent-dk:#167049}
body[data-scene="ort"]{--bgA:#ffe0d6;--bgB:#fff3d4;--accent:#ec5a6e;--accent-dk:#a8283d}
body[data-scene="lec"]{--bgA:#dfe2ff;--bgB:#ffe6f6;--accent:#5b7ff0;--accent-dk:#3451b5}
body[data-scene="boss"]{--bgA:#ffe1e1;--bgB:#e2f3ff;--accent:#c0751a;--accent-dk:#8a4f05}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:0 2px 0 var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:900;font-size:1.1rem;margin-right:auto;min-width:0}
.brand svg{width:54px;height:39px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.icon-btn{background:var(--card-2);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:800;font-size:.9rem}
@media (max-width:480px){.brand span{font-size:.95rem}.brand svg{width:42px;height:30px}.icon-btn{padding:4px 8px;font-size:.8rem}}

main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-block:18px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{border:0;border-radius:16px;padding:12px 22px;font-weight:900;font-size:1.05rem;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-dk);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-dk)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.green{background:#22a36a;box-shadow:0 5px 0 #167049}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* portal */
.portal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:auto;background:radial-gradient(circle at 50% 45%,#5a3f9e 0%,#2a1d5c 55%,#170f38 100%);color:#fff;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));transition:opacity .5s}
.portal.out{opacity:0;pointer-events:none}
.portal-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:560px}
.ring{position:relative;width:min(72vw,340px);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#a0c4ff,#bdb2ff,#ffc6ff,#ffadad);-webkit-mask:radial-gradient(circle,transparent 54%,#000 56%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 54%,#000 56%,#000 70%,transparent 72%);animation:spin 6s linear infinite;filter:drop-shadow(0 0 18px rgba(255,200,255,.7))}
.ring::after{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
.ring svg{position:relative;width:78%;z-index:1}
.portal.go .ring{animation:zoomin .9s cubic-bezier(.6,0,.4,1) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes zoomin{to{transform:scale(9);opacity:0}}
.portal h1{font-size:clamp(1.8rem,6vw,2.8rem);background:linear-gradient(90deg,#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#bdb2ff,#ffc6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.portal p{margin:0;color:#e9e2ff;font-weight:700;max-width:52ch}
.portal label{font-weight:800}
.portal input{font:inherit;font-weight:800;font-size:1.1rem;border-radius:14px;border:3px solid #bdb2ff;padding:8px 14px;width:min(100%,280px);text-align:center;color:var(--ink);background:#fff}
.stars-bg{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 50%,#fff,transparent);opacity:.8}

/* PUM */
.pum{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
.pum-flash{position:absolute;inset:0;background:#fff;animation:flash .9s forwards}
.pum-rays{position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:repeating-conic-gradient(#ffd6a5 0 8deg,#fff 8deg 16deg,#bdb2ff 16deg 24deg,#fff 24deg 32deg,#9bf6ff 32deg 40deg,#fff 40deg 48deg,#ffadad 48deg 56deg,#fff 56deg 64deg);animation:rays .95s ease-out forwards;opacity:.9}
.pum-word{position:relative;font-family:var(--f-display);font-weight:900;font-size:clamp(4rem,18vw,9rem);color:#ffd84d;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);animation:pumword .95s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes rays{0%{transform:scale(.1) rotate(0);opacity:1}80%{opacity:.9}100%{transform:scale(1) rotate(40deg);opacity:0}}
@keyframes pumword{0%{transform:scale(.2) rotate(-12deg);opacity:0}35%{transform:scale(1.2) rotate(4deg);opacity:1}75%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.05);opacity:0}}

/* hero + world */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--card);border-radius:28px;padding:14px 22px;box-shadow:0 6px 0 var(--line)}
.hero .guide-big{width:150px}
.hero h1{font-size:clamp(1.4rem,4vw,2rem)}
.hero p{margin:.3rem 0 0;color:var(--ink-soft);max-width:62ch;font-weight:700}
.rank{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-weight:900}
.rank-bar{flex:1 1 160px;height:14px;background:var(--card-2);border:2px solid var(--line);border-radius:999px;overflow:hidden;min-width:120px}
.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#bdb2ff);border-radius:999px;transition:width .6s}
.rank small{color:var(--ink-soft);font-weight:700}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .guide-big{margin:0 auto;width:130px}.rank{justify-content:center}}
.sec-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:22px 4px 10px;flex-wrap:wrap}
.sec-title h2{font-size:1.45rem}
.sec-title small{color:var(--ink-soft);font-weight:800}
.world-wrap{border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--line);background:#cfe9ff;position:relative}
.world-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
svg.world{display:block;width:100%;min-width:760px;height:auto;transition:transform .85s cubic-bezier(.6,0,.4,1),filter .85s}
svg.world.zoom{transform:scale(3.4);filter:blur(2px) brightness(1.25)}
.place{cursor:pointer}
.place .bobber{animation:float 4.5s ease-in-out infinite;transform-box:fill-box}
.place:nth-of-type(2n) .bobber{animation-delay:-2s}
.place:hover .plaque rect,.place:focus-visible .plaque rect{stroke-width:5}
.place.locked{cursor:not-allowed}
.place:focus{outline:none}
.place:focus-visible .plaque rect{stroke:var(--ink)}
@keyframes float{50%{transform:translateY(-8px)}}
.scroll-hint{display:none;text-align:center;font-weight:800;color:var(--ink-soft);font-size:.85rem;padding:6px}
@media (max-width:760px){.scroll-hint{display:block}}

.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.quest{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:0;border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--line)}
.quest:disabled{opacity:.6;cursor:not-allowed}
.quest .ico{width:84px;height:62px;display:grid;place-items:center}
.quest .ico svg{width:100%;height:100%}
.quest h3{font-size:1.05rem}
.quest .sub{color:var(--ink-soft);font-weight:700;font-size:.85rem;display:block}
.quest .meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.stars{display:inline-flex;gap:1px}.stars svg{width:20px;height:20px}
.new-tag{font-size:.75rem;font-weight:900;background:#efe6ff;color:#5f37b5;border-radius:999px;padding:1px 8px}

.nest-row{margin-top:22px;background:var(--card);border-radius:26px;padding:14px 18px;box-shadow:0 6px 0 var(--line)}
.nest-row h2{font-size:1.3rem;margin-bottom:6px}
.nest-list{display:flex;flex-wrap:wrap;gap:10px}
.nest-slot{width:136px;text-align:center;font-weight:900;font-size:.9rem}
.nest-slot svg{width:120px;height:86px}
.nest-slot .who{color:var(--ink-soft);font-weight:700;font-size:.78rem;display:block}

/* play */
.scene-strip{position:fixed;left:0;right:0;bottom:0;height:200px;z-index:0;pointer-events:none;opacity:.85}
.scene-strip svg{width:100%;height:100%;display:block}
.play{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.where{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:1.25rem}
.where svg{width:70px;height:50px;flex:none}
.where small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--ink-soft);font-weight:800}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex:1;min-width:140px}
.dots i{flex:1;height:12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.dots i.now{background:var(--gold);border-color:var(--gold-dk)}
.hud-egg{width:48px;height:58px}
.hud-egg svg{width:100%;height:100%}
.hud-egg.wob{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.hearts{display:flex;gap:2px}.hearts svg{width:26px;height:26px}
.streak{display:inline-flex;align-items:center;gap:3px;font-weight:900;color:#c2410c;background:#fff1e4;border:2px solid #ffc9a3;border-radius:999px;padding:2px 10px 2px 4px}
.streak svg{width:22px;height:22px}

.qcard{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);animation:pumin .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pumin{0%{transform:scale(.55) rotate(-3deg);opacity:0}60%{transform:scale(1.04) rotate(.5deg);opacity:1}100%{transform:scale(1)}}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:900;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.qhead{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.qhead .mini{width:84px;flex:none}
.qhead .mini svg{width:100%;height:auto}
.q{font-weight:800;font-size:clamp(1.05rem,3vw,1.28rem);background:var(--card-2);border-radius:18px;padding:12px 16px;position:relative;min-width:0;flex:1}
.q::before{content:"";position:absolute;left:-10px;top:20px;border:10px solid transparent;border-right-color:var(--card-2);border-left:0}
.q u{text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.area{margin-top:16px}
.hint{color:var(--ink-soft);font-weight:700;margin:0 0 10px;font-size:.95rem}
.parch{background:#fffaf0;border:3px solid #f0dfb8;border-radius:20px;padding:14px 18px;margin-top:12px;box-shadow:inset 0 0 0 4px #fff}
.parch h3{font-size:1.1rem;margin-bottom:6px;color:#7a5410}
.parch p{margin:.35em 0;max-width:70ch;font-weight:600;line-height:1.6}
.parch .pre{white-space:pre-line}
.parch-tog{margin-top:8px;font-weight:800;font-size:.85rem;background:none;border:0;color:#7a5410;text-decoration:underline;padding:0}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.opt{text-align:left;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 16px;font-weight:800;font-size:1.02rem;box-shadow:0 4px 0 var(--line)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:7px 13px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.chip.sel{border-color:var(--accent);background:#efe6ff;transform:translateY(-3px)}
.chip.shake{animation:shake .4s;border-color:var(--bad)}
.chip.gone{display:none}
.nests{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.nest{border:3px dashed #c9b98f;background:#fff8e6;border-radius:22px;padding:10px;min-height:104px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.nest:hover{border-color:var(--gold-dk)}
.nest.shake{animation:shake .4s}
.nest-label{font-family:var(--f-display);font-weight:800;font-size:1.02rem}
.nest-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.nest-items span{background:var(--good-bg);border:2px solid var(--good);border-radius:10px;padding:1px 8px;font-size:.85rem;font-weight:800}
.word{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;margin:10px 0 18px}
.let{font-family:var(--f-display);font-size:clamp(1.7rem,7vw,2.7rem);font-weight:800;min-width:.6em;text-align:center;border-radius:10px;padding:0 2px}
.let.lex{background:#d4f7e2;color:#11663a}
.let.mor{background:#ffe7c7;color:#9a4b00}
.gap{width:18px;height:52px;border:0;border-radius:8px;background:transparent;position:relative}
.gap::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--line)}
.gap:hover::after{background:var(--accent)}
.gap.on::after{background:#ec5a6e;width:5px;margin-left:-2.5px;top:0;bottom:0}
.vow{font-family:var(--f-display);font-size:clamp(1.7rem,7vw,2.7rem);font-weight:800;border:3px solid var(--line);background:var(--card);border-radius:12px;min-width:1.1em;padding:0 4px;box-shadow:0 4px 0 var(--line);line-height:1.3}
.vow:hover:not(:disabled){border-color:#ec5a6e}
.vow.ok{background:var(--good-bg);border-color:var(--good)}
.vow.no{background:var(--bad-bg);border-color:var(--bad)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:.9rem;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:16px;height:16px;border-radius:5px;display:inline-block}
.sent{display:flex;flex-wrap:wrap;gap:6px;line-height:1.2;margin-bottom:16px}
.tok{border:3px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-weight:800;font-size:1.12rem;box-shadow:0 3px 0 var(--line)}
.tok.up{border-color:var(--accent);background:#efe6ff}
.tok.ok{border-color:var(--good);background:var(--good-bg)}
.tok.miss{border-color:var(--bad);background:var(--bad-bg);outline:2px dashed var(--bad);outline-offset:2px}
.tok.extra{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}

.feedback{margin-top:16px;border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.feedback.good{background:var(--good-bg);border:3px solid var(--good)}
.feedback.bad{background:var(--bad-bg);border:3px solid var(--bad)}
.feedback .mini{width:76px}.feedback .mini svg{width:100%;height:auto}
.feedback h3{font-size:1.2rem}
.feedback p{margin:.2rem 0 0;font-weight:700}
.feedback .btn{grid-column:1/-1;justify-self:end}
.gain{font-weight:900;color:var(--gold-dk)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(43,35,80,.6);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.ov-card{background:var(--card);border-radius:30px;padding:22px;max-width:580px;width:100%;text-align:center;box-shadow:0 8px 0 var(--line);animation:pumin .45s cubic-bezier(.3,1.6,.5,1)}
.ov-card h2{font-size:clamp(1.4rem,5vw,1.9rem)}
.ov-card p{color:var(--ink-soft);font-weight:700}
.big-stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.big-stars svg{width:54px;height:54px}
.big-stars svg.on{animation:pop .5s backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.hatch-stage{height:190px;display:grid;place-items:center}
.hatch-stage svg{width:min(260px,80%);height:auto;max-height:180px}
.egg-shake{animation:eggshake .45s infinite}
@keyframes eggshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.dragon-pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1);width:100%;display:grid;place-items:center}
.bob{animation:float 3s ease-in-out infinite}

.book{text-align:left;max-width:720px}
.book h3{font-size:1.15rem;margin:14px 0 6px}
.book ul{margin:0;padding-left:1.2em}
.book li{margin:.25em 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{border:3px solid var(--line);background:var(--card-2);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rule-box{background:var(--card-2);border-radius:16px;padding:10px 14px;margin-top:6px}

.diploma{border:6px double var(--gold-dk);border-radius:24px;padding:20px 14px;background:linear-gradient(#fffbea,#fff0f7)}
.diploma .name{font-family:var(--f-display);font-size:clamp(2rem,8vw,3rem);font-weight:900;background:linear-gradient(90deg,#e8707a,#e0a03a,#5fb878,#4d9de0,#9a6be0);-webkit-background-clip:text;background-clip:text;color:transparent}
.diploma .row{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.diploma .row svg{width:clamp(78px,20vw,96px);height:auto}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:8px 18px;z-index:55;animation:pop .25s;max-width:calc(100% - 32px);text-align:center}

/* ===== Nombre del jugador ===== */
.namebox{display:grid;gap:10px;justify-items:center;margin:14px 0 6px}
.namebox>label{font-weight:800}
.namebox input[type=text]{font:inherit;font-weight:800;font-size:1.1rem;border-radius:14px;border:3px solid #bdb2ff;padding:8px 14px;width:min(100%,280px);text-align:center;color:#2b2350;background:#fff}
.namebox input[type=text]:focus{outline:3px solid var(--accent);outline-offset:2px}
.gen{border:0;padding:0;margin:0;min-width:0}
.gen legend{font-weight:800;margin:0 auto 8px;padding:0}
.gen-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gen-row label{position:relative;cursor:pointer}
.gen-row input{position:absolute;opacity:0;width:1px;height:1px}
.gen-row span{display:inline-block;padding:8px 18px;border-radius:999px;background:#fff;color:#2b2350;border:3px solid #bdb2ff;font-weight:900}
.gen-row input:checked+span{background:#ffc83d;border-color:#a86f00}
.gen-row input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.nm-err{margin:0;min-height:1.3em;font-weight:800;color:#d63a52}
.portal .nm-err{color:#ffb3c1}
.linkbtn{background:none;border:0;padding:2px 0;font:inherit;font-size:.92rem;font-weight:800;color:var(--accent-dk);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.portal .linkbtn{color:#e9e2ff}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =========================================================
   ARTE: dragoncitos articulados de impresora 3D, arcoíris
   ========================================================= */
const PAL={
  guia:{body:['#f7b3d8','#cdb4f5','#a5e6ec','#c9b3f2','#f7b6d9','#ffe2b8'],headT:'#a8e8ee',headB:'#f5b4d6',crest:'#9fe3e8',snout:['#f6a5cd','#fff0d8'],wing:'#ffdcc0'},
  lila:{body:['#f2a7f0','#c2a3ff','#98c8ff','#a8eedd'],headT:'#c7a9ff',headB:'#f2b0e8',crest:'#b99bff',snout:['#f3a8de','#fff0e0'],wing:'#ffd9ef'},
  verdin:{body:['#a8efc0','#93e2dc','#fff09a','#ffc7a2'],headT:'#8fe6c0',headB:'#d8f7a8',crest:'#6fd8a6',snout:['#bff2c8','#fffbe0'],wing:'#fff1b8'},
  rubi:{body:['#ff9fa6','#ffc394','#ffe791','#ffb0d2'],headT:'#ff9fb0',headB:'#ffd0a0',crest:'#ff8fa3',snout:['#ffb3b8','#fff2dc'],wing:'#ffe0b0'},
  brisa:{body:['#9fd1ff','#bfb6ff','#ffbfe4','#fff0bd'],headT:'#a9cfff',headB:'#d9c2ff',crest:'#8fbfff',snout:['#d6c6ff','#fff4e4'],wing:'#ffe6f4'},
  iris:{body:['#ff9a9a','#ffc78a','#fff08a','#a8f0b0','#9ad0ff','#c8a8ff'],headT:'#ffd36b',headB:'#ffb0c8',crest:'#ffd36b',snout:['#ffc2d0','#fff6dc'],wing:'#fff2b0',crown:true}
};
let UID=0;
function dragon(p,attrs=''){
  const u='dg'+(++UID);
  const O='stroke="rgba(60,40,90,.30)" stroke-width="1.6" stroke-linejoin="round"';
  const st=p.body.map((c,i)=>`<stop offset="${(i/(p.body.length-1)).toFixed(2)}" stop-color="${c}"/>`).join('');
  const segs=[[186,90,8],[173,86,11],[157,83,14],[138,82,17],[116,84,19],[93,88,21]];
  const ball=(cx,cy,r,fill)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" ${O}/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${u}l)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${u}s)"/>`;
  const spike=(cx,cy,r)=>{const h=Math.max(7,r*.8),w=Math.max(4,r*.36),b=cy-r+3;return `<path d="M${cx-w} ${b} Q${cx-w*.3} ${b-h*.55} ${cx+w*.1} ${b-h} Q${cx+w*.55} ${b-h*.45} ${cx+w} ${b} Z" fill="#fffaf2" ${O}/>`};
  const leg=(x1,y1,x2,y2,far)=>`<g ${far?'opacity=".8"':''}><path d="M${x1} ${y1} L${x2} ${y2}" stroke="url(#${u}g)" stroke-width="13" stroke-linecap="round"/><path d="M${x1} ${y1} L${x2} ${y2}" stroke="url(#${u}l)" stroke-width="13" stroke-linecap="round"/><ellipse cx="${x2-3}" cy="${y2+3}" rx="8.5" ry="5" fill="#ffe8c4" ${O}/></g>`;
  const wing=(x,y,a0,a1,len,far)=>{let f='';const n=5;for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(n-1);const l=len*(.72+.28*Math.sin(Math.PI*i/(n-1)));f+=`<g transform="translate(${x} ${y}) rotate(${a.toFixed(1)})"><ellipse cx="${(l/2).toFixed(1)}" cy="0" rx="${(l/2).toFixed(1)}" ry="${(l*.16).toFixed(1)}" fill="#ffffff" ${O}/></g>`}return `<g ${far?'opacity=".78"':''}>${f}<ellipse cx="${x}" cy="${y}" rx="10" ry="7" fill="${p.wing}" ${O}/><ellipse cx="${x}" cy="${y}" rx="10" ry="7" fill="url(#${u}l)"/></g>`};
  let crest='';
  for(let i=0;i<6;i++){const a=(-168+i*19)*Math.PI/180,b1=a-.17,b2=a+.17,R=30,T=44+(i%2?5:0);
    crest+=`<path d="M${(58+R*Math.cos(b1)).toFixed(1)} ${(70+R*Math.sin(b1)).toFixed(1)} L${(58+T*Math.cos(a)).toFixed(1)} ${(70+T*Math.sin(a)).toFixed(1)} L${(58+R*Math.cos(b2)).toFixed(1)} ${(70+R*Math.sin(b2)).toFixed(1)} Z" fill="${p.crest}" ${O}/>`}
  const crown=p.crown?`<path d="M42 34 L46 18 L53 28 L58 14 L64 28 L71 18 L74 34 Z" fill="#ffd54d" ${O}/><circle cx="58" cy="15" r="3" fill="#ff8fbf"/><circle cx="46" cy="19" r="2.4" fill="#9ad0ff"/><circle cx="71" cy="19" r="2.4" fill="#a8f0b0"/>`:'';
  return `<svg viewBox="0 0 210 150" ${attrs} aria-hidden="true">
  <defs>
    <linearGradient id="${u}g" gradientUnits="userSpaceOnUse" x1="40" y1="50" x2="200" y2="110">${st}</linearGradient>
    <linearGradient id="${u}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.headT}"/><stop offset="1" stop-color="${p.headB}"/></linearGradient>
    <linearGradient id="${u}n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.snout[0]}"/><stop offset="1" stop-color="${p.snout[1]}"/></linearGradient>
    <pattern id="${u}l" patternUnits="userSpaceOnUse" width="8" height="2.6" patternTransform="rotate(-12)"><rect width="8" height="1" fill="#ffffff" opacity=".30"/></pattern>
    <radialGradient id="${u}s" cx=".35" cy=".28" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="112" cy="126" rx="86" ry="7" fill="#2b2350" opacity=".12"/>
  ${leg(104,102,108,117,1)}${leg(150,96,154,111,1)}
  ${wing(102,66,-128,-62,36,1)}${wing(146,64,-100,-32,32,1)}
  ${wing(192,88,-36,30,18,0)}
  ${segs.map(([x,y,r])=>ball(x,y,r,`url(#${u}g)`)).join('')}
  ${segs.map(([x,y,r])=>spike(x,y,r)).join('')}
  ${leg(88,104,85,120,0)}${leg(133,98,130,114,0)}
  ${wing(96,70,-150,-82,40,0)}${wing(140,68,-118,-46,34,0)}
  ${crest}
  <ellipse cx="86" cy="54" rx="13" ry="6" transform="rotate(-35 86 54)" fill="${p.crest}" ${O}/>
  ${ball(58,70,31,`url(#${u}h)`)}
  ${crown}
  <path d="M39 47 L43 30 L50 45 Z" fill="#fff3dc" ${O}/>
  <ellipse cx="34" cy="88" rx="19" ry="14" fill="url(#${u}n)" ${O}/><ellipse cx="34" cy="88" rx="19" ry="14" fill="url(#${u}l)"/>
  <circle cx="23" cy="84" r="1.7" fill="#5d3a6e" opacity=".6"/>
  <path d="M22 94 Q30 100 41 95" fill="none" stroke="#5d3a6e" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="62" cy="90" rx="6.5" ry="3.6" fill="#ff8fbf" opacity=".45"/>
  <ellipse cx="76" cy="69" rx="7" ry="9" fill="#fff" ${O}/><ellipse cx="77" cy="70" rx="5.2" ry="6.8" fill="#1d1530"/><circle cx="78.6" cy="67" r="1.9" fill="#fff"/>
  <ellipse cx="50" cy="73" rx="10.5" ry="11.5" fill="#fff" ${O}/><ellipse cx="51" cy="74" rx="8" ry="9" fill="#1d1530"/><circle cx="54" cy="69.5" r="3" fill="#fff"/><circle cx="47.5" cy="78.5" r="1.4" fill="#fff"/>
</svg>`;
}
const CRACKS=['M30 44 L40 52 L34 58 L44 64','M70 36 L62 46 L70 52 L62 60','M28 78 L40 74 L46 82 L56 76','M72 72 L64 82 L74 88'];
function egg(p,cracks=0,attrs=''){
  const u='eg'+(++UID);
  const st=p.body.map((c,i)=>`<stop offset="${(i/(p.body.length-1)).toFixed(2)}" stop-color="${c}"/>`).join('');
  const shape='M50 8 C76 8 90 50 90 72 C90 96 72 110 50 110 C28 110 10 96 10 72 C10 50 24 8 50 8 Z';
  return `<svg viewBox="0 0 100 120" ${attrs} aria-hidden="true"><defs>
  <linearGradient id="${u}g" x1="0" y1="0" x2=".4" y2="1">${st}</linearGradient>
  <pattern id="${u}l" patternUnits="userSpaceOnUse" width="8" height="2.6"><rect width="8" height="1" fill="#fff" opacity=".35"/></pattern>
  <radialGradient id="${u}s" cx=".35" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <ellipse cx="50" cy="112" rx="30" ry="5" fill="#2b2350" opacity=".12"/>
  <path d="${shape}" fill="url(#${u}g)" stroke="rgba(60,40,90,.35)" stroke-width="2"/><path d="${shape}" fill="url(#${u}l)"/><path d="${shape}" fill="url(#${u}s)"/>
  <circle cx="34" cy="44" r="4" fill="#fff" opacity=".8"/><circle cx="64" cy="62" r="5" fill="#fff" opacity=".7"/><circle cx="42" cy="88" r="4.5" fill="#fff" opacity=".7"/><circle cx="66" cy="92" r="3" fill="#fff" opacity=".8"/>
  ${CRACKS.slice(0,cracks).map(d=>`<path d="${d}" fill="none" stroke="#4a2f6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
</svg>`;
}
const ICON={
  gem:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" fill="#9bdcf5" stroke="#4a6fae" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 9h20M9 3 7.5 9 12 21 16.5 9 15 3" fill="none" stroke="#4a6fae" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
  star:on=>`<svg viewBox="0 0 24 24" class="${on?'on':''}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="${on?'#ffc83d':'#e7e2f5'}" stroke="${on?'#a86f00':'#c9c0e6'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
  heart:on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="${on?'#ff7a8f':'#e7e2f5'}" stroke="${on?'#a3233a':'#c9c0e6'}" stroke-width="1.6"/></svg>`,
  flame:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#ff8a3d" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 13c1 1.5 3 2.5 3 4.5a3 3 0 0 1-6 0c0-1.5 1-2.5 2-3 0 1 .5 1.5 1 1.5z" fill="#ffd84d"/></svg>`,
  lock:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3" fill="#ffc83d" stroke="#8a5a00" stroke-width="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#8a5a00" stroke-width="2"/></svg>`
};
const starPath=(x,y,s,on)=>`<path transform="translate(${x} ${y}) scale(${s/24})" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="${on?'#ffc83d':'#e7e2f5'}" stroke="${on?'#a86f00':'#c9c0e6'}" stroke-width="1.5"/>`;

/* =========================================================
   MUNDO
   ========================================================= */
const ISLANDS=[
  {id:'voc',name:'Lago de los Espejos',topic:'Sinónimos y antónimos',pal:'lila',dragon:'Lila',total:8,x:170,y:420},
  {id:'gra',name:'Bosque de las Raíces',topic:'La palabra: clases, estructura, variables e invariables',pal:'verdin',dragon:'Verdín',total:8,x:395,y:275},
  {id:'ort',name:'Volcán de las Tildes',topic:'Mayúsculas y acentuación',pal:'rubi',dragon:'Rubí',total:8,x:660,y:430},
  {id:'lec',name:'Biblioteca de las Nubes',topic:'Comprensión lectora',pal:'brisa',dragon:'Brisa',total:8,x:855,y:255},
  {id:'boss',name:'Castillo Arcoíris',topic:'Gran Desafío: todo mezclado',pal:'iris',dragon:'Iris',total:12,x:600,y:138}
];
const BIO={
  voc:'Lila es una dragoncita lila y azul del Lago de los Espejos. Dice que los sinónimos son reflejos gemelos y los antónimos, su lado contrario.',
  gra:'Verdín es un dragoncito verde limón del Bosque de las Raíces. Sabe que cada palabra tiene una raíz, el lexema, y que algunas cambian de forma y otras nunca.',
  ort:'Rubí es una dragoncita coral del Volcán de las Tildes. Lanza chispas justo encima de la sílaba tónica y nunca se olvida de una mayúscula.',
  lec:'Brisa es una dragoncita azul cielo que vive entre libros en la Biblioteca de las Nubes. Lee tan atenta que encuentra las pistas escondidas en cada texto.',
  boss:'Iris es la Reina Arcoíris, la dragona de todos los colores. Solo nace cuando {una Guardiana|un Guardián} domina las palabras de verdad. ¡Y {esa|ese} eres tú, {N}!'
};
const RANKS=[[0,'Aprendiz de {Guardiana|Guardián}'],[200,'{Cuidadora|Cuidador} de Huevos'],[500,'{Domadora|Domador} de Dragones'],[900,'{Gran Maestra Dragona|Gran Maestro Dragón}'],[1400,'Leyenda Arcoíris']];

const cloud=(x,y,s,o=.92)=>`<g opacity="${o}" fill="#fff"><circle cx="${x}" cy="${y}" r="${22*s}"/><circle cx="${x+26*s}" cy="${y-10*s}" r="${28*s}"/><circle cx="${x+56*s}" cy="${y}" r="${22*s}"/><rect x="${x}" y="${y}" width="${56*s}" height="${20*s}" rx="${10*s}"/></g>`;
const floatBase=(x,y,w,top,cliff)=>`<path d="M${x-w/2} ${y} Q${x-w*.2} ${y+w*.45} ${x} ${y+w*.5} Q${x+w*.2} ${y+w*.45} ${x+w/2} ${y} Z" fill="${cliff}"/><path d="M${x-w*.18} ${y+w*.3} l6 22 l6-22 M${x+w*.1} ${y+w*.36} l5 16 l5-16" fill="${cliff}" opacity=".8"/><ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${w*.12}" fill="${top}"/>`;
const cloudBase=(x,y,w)=>`<g fill="#fff"><ellipse cx="${x}" cy="${y+10}" rx="${w/2}" ry="${w*.14}"/><circle cx="${x-w*.3}" cy="${y+4}" r="${w*.14}"/><circle cx="${x+w*.28}" cy="${y+2}" r="${w*.16}"/><circle cx="${x}" cy="${y-2}" r="${w*.12}"/></g><ellipse cx="${x}" cy="${y+18}" rx="${w/2}" ry="${w*.08}" fill="#dcd6ff" opacity=".7"/>`;
const LAND={
  voc:(x,y)=>floatBase(x,y,230,'#b7ecc4','#c9a8e0')+`<ellipse cx="${x}" cy="${y+2}" rx="80" ry="16" fill="#86cff5"/><ellipse cx="${x-20}" cy="${y-1}" rx="36" ry="5" fill="#d8f2ff"/><path d="M${x-96} ${y-2} l0 -22 M${x-90} ${y} l2 -28 M${x+92} ${y} l0 -24 M${x+98} ${y-2} l-2 -18" stroke="#5cae7a" stroke-width="4" stroke-linecap="round"/>`,
  gra:(x,y)=>floatBase(x,y,240,'#a8e6b0','#b98b6a')+`<rect x="${x-92}" y="${y-36}" width="8" height="30" fill="#8a5a2b"/><circle cx="${x-88}" cy="${y-48}" r="26" fill="#7fd8a0"/><circle cx="${x-100}" cy="${y-38}" r="16" fill="#a5e8b6"/><rect x="${x+82}" y="${y-30}" width="7" height="26" fill="#8a5a2b"/><circle cx="${x+86}" cy="${y-42}" r="22" fill="#fff09a"/><circle cx="${x+98}" cy="${y-34}" r="13" fill="#ffd27a"/>`,
  ort:(x,y)=>floatBase(x,y,240,'#ffe0b0','#d68e7a')+`<path d="M${x+40} ${y+4} L${x+80} ${y-62} L${x+96} ${y-56} L${x+110} ${y-64} L${x+130} ${y+4} Z" fill="#e8977f"/><path d="M${x+80} ${y-62} L${x+96} ${y-56} L${x+110} ${y-64} L${x+104} ${y-46} L${x+96} ${y-50} L${x+86} ${y-44} Z" fill="#ff8a5c"/><circle cx="${x+90}" cy="${y-84}" r="9" fill="#ffd9cc"/><circle cx="${x+106}" cy="${y-98}" r="12" fill="#ffd9cc"/><path d="M${x+118} ${y-122} l10 -12" stroke="#ff8a5c" stroke-width="6" stroke-linecap="round"/>`,
  lec:(x,y)=>cloudBase(x,y,240)+`<g transform="translate(${x-112} ${y-62})"><rect width="16" height="58" rx="3" fill="#ffadad"/><rect x="18" y="8" width="14" height="50" rx="3" fill="#fdffb6"/><rect x="34" y="2" width="16" height="56" rx="3" fill="#9bf6ff"/><rect x="52" y="12" width="12" height="46" rx="3" fill="#bdb2ff"/></g><g transform="translate(${x+70} ${y-36}) rotate(-12)"><rect width="44" height="30" rx="4" fill="#fff" stroke="#bdb2ff" stroke-width="3"/><path d="M22 2 V28 M6 10 H18 M6 16 H18 M26 10 H38 M26 16 H38" stroke="#bdb2ff" stroke-width="2"/></g>`,
  boss:(x,y)=>cloudBase(x,y,250)+`<g><rect x="${x-110}" y="${y-70}" width="34" height="74" fill="#ece4ff" stroke="#c8b8f0" stroke-width="2"/><path d="M${x-116} ${y-70} L${x-93} ${y-104} L${x-70} ${y-70} Z" fill="#ffadad"/><path d="M${x-93} ${y-104} v-16 l14 6 l-14 6" fill="#9bf6ff" stroke="#8a7cc8" stroke-width="1.5"/><rect x="${x+78}" y="${y-62}" width="34" height="66" fill="#ece4ff" stroke="#c8b8f0" stroke-width="2"/><path d="M${x+72} ${y-62} L${x+95} ${y-96} L${x+118} ${y-62} Z" fill="#bdb2ff"/><path d="M${x+95} ${y-96} v-16 l14 6 l-14 6" fill="#fdffb6" stroke="#8a7cc8" stroke-width="1.5"/></g>`
};
function worldSVG(){
  const rb=['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#bdb2ff'];
  const pts=ISLANDS.map(i=>[i.x,i.y]);
  let path=`M${pts[0][0]} ${pts[0][1]+20}`;for(let i=1;i<pts.length;i++){const [a,b]=pts[i-1],[c,d]=pts[i];path+=` Q${(a+c)/2} ${Math.min(b,d)-60} ${c} ${d+20}`}
  return `<svg class="world" id="world" viewBox="0 0 1000 640" role="group" aria-label="Mapa del Reino Arcoíris">
  <defs><linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9e2ff"/><stop offset=".6" stop-color="#efe6ff"/><stop offset="1" stop-color="#ffe6f2"/></linearGradient>

function guidePos(id){const i=isle(id||S.last||'voc');return [i.x-150,i.y-130]}
function placeSVG(i){
  const locked=i.id==='boss'&&!unlockedBoss();
  const hatched=S.hatched[i.id];
  const ico=hatched?dragon(PAL[i.pal],`x="${i.x-70}" y="${i.y-112}" width="140" height="100"`):egg(PAL[i.pal],0,`x="${i.x-34}" y="${i.y-98}" width="68" height="82"`);
  const left=leftCount(i.id);
  return `<g class="place ${locked?'locked':''}" data-id="${i.id}" role="button" tabindex="0" aria-label="${i.name}. ${i.topic}${locked?'. Bloqueado':''}">
   <g class="bobber">${LAND[i.id](i.x,i.y)}${ico}
   ${locked?`<g transform="translate(${i.x-22} ${i.y-80}) scale(1.8)">${ICON.lock.replace('<svg viewBox="0 0 24 24" aria-hidden="true">','').replace('</svg>','')}</g>`:''}
   <g class="plaque"><rect x="${i.x-100}" y="${i.y+44}" width="200" height="${locked?50:62}" rx="16" fill="#fff" stroke="${PAL[i.pal].crest}" stroke-width="3"/>
   <text x="${i.x}" y="${i.y+68}" text-anchor="middle" font-family="Grandstander, Trebuchet MS, sans-serif" font-weight="800" font-size="18" fill="#2b2350">${i.name}</text>
   ${locked?`<text x="${i.x}" y="${i.y+86}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="12" fill="#5d5487">Despierta a los otros 4 dragones</text>`:
   `${[0,1,2].map(k=>starPath(i.x-58+k*20,i.y+77,18,k<S.stars[i.id])).join('')}<text x="${i.x+10}" y="${i.y+92}" font-family="Nunito, sans-serif" font-weight="800" font-size="12" fill="#5d5487">${left} nuevos</text>`}
   </g></g></g>`;
}

const KEY='lengua-recurso-02-v1';
const DEF={gems:0,stars:{voc:0,gra:0,ort:0,lec:0,boss:0},hatched:{},seen:{voc:[],gra:[],ort:[],lec:[]},sound:true,pet:'',last:'voc',name:'',gen:''};
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(!v)return structuredClone(DEF);return {...structuredClone(DEF),...v,stars:{...DEF.stars,...(v.stars||{})},seen:{...structuredClone(DEF.seen),...(v.seen||{})},hatched:{...(v.hatched||{})}}}catch(e){return structuredClone(DEF)}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let G=null;
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const isle=id=>ISLANDS.find(x=>x.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pet=()=>esc(S.pet||'Algodón');

const NM=()=>escN(S.name||'');
const g=(a,o)=>S.gen==='o'?o:a;
// Sustituye {N} por el nombre y {femenino|masculino} según la elección
const pers=s=>String(s).replace(/\{N\}/g,NM()).replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(m,a,o)=>g(a,o));
function nameForm(){
  return `<div class="namebox">

      <div class="gen-row">
        <label><input type="radio" name="gen" value="a" ${S.gen==='a'?'checked':''}><span>Guardiana</span></label>
        <label><input type="radio" name="gen" value="o" ${S.gen==='o'?'checked':''}><span>Guardián</span></label>
      </div></fieldset>

}
function readName(){
  const v=($('#nmIn').value||'').replace(/\s+/g,' ').trim();

  const err=$('#nmErr');
  if(!v){err.textContent='Escribe tu nombre para empezar.';$('#nmIn').focus();return false}
  if(!r){err.textContent='Elige «Guardiana» o «Guardián».';return false}
  S.name=v;S.gen=r.value;save();return true;
}
function bindNameEnter(go){const i=$('#nmIn');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});setTimeout(()=>i.focus(),50)}}
function changeName(after){
  showOv(`<h2>Cambiar nombre</h2>${nameForm()}<p>Tu progreso se mantiene. Se guarda solo en este navegador.</p>
  <div class="center"><button class="btn ghost" id="nmCancel" type="button">Cancelar</button><button class="btn gold" id="nmSave" type="button">Guardar</button></div>`);
  const ok=()=>{if(!readName())return;hideOv();after()};
  $('#nmCancel').onclick=hideOv;$('#nmSave').onclick=ok;bindNameEnter(ok);
}
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const unlockedBoss=()=>['voc','gra','ort','lec'].every(id=>S.stars[id]>0);
function leftCount(id){
  if(id==='boss')return ['voc','gra','ort','lec'].reduce((n,k)=>n+leftCount(k),0);
  if(id==='lec')return TEXTS.filter(T=>!S.seen.lec.includes(T.id)).length*4;
  return BANK[id].filter(q=>!S.seen[id].includes(q.id)).length;
}

let AC=null;
function tone(f,d=.12,type='sine',when=0,vol=.15){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d+.02)}catch(e){}
}
const sfx={
  ok:()=>{tone(660,.1,'triangle');tone(880,.15,'triangle',.09)},
  no:()=>{tone(220,.18,'sawtooth',0,.07);tone(180,.2,'sawtooth',.12,.07)},
  tap:()=>tone(520,.05,'square',0,.04),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.12)),
  hatch:()=>[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',i*.1)),
  pum:()=>{tone(110,.35,'sine',0,.35);tone(70,.4,'triangle',.02,.3);[784,988,1175].forEach((f,i)=>tone(f,.15,'triangle',.12+i*.06,.08))},
  fly:()=>[400,500,620,760].forEach((f,i)=>tone(f,.08,'sine',i*.07,.06))
};

    gra:[120,380,700,1040].map((x,i)=>`<rect x="${x-4}" y="${110+i%2*12}" width="8" height="40" fill="#a07850" opacity=".6"/><circle cx="${x}" cy="${105+i%2*12}" r="${26-i%2*6}" fill="${i%2?'#fff09a':'#7fd8a0'}" opacity=".75"/>`).join(''),
    ort:`<path d="M780 200 L880 70 L900 78 L920 66 L1010 200 Z" fill="#e8977f" opacity=".6"/><circle cx="900" cy="48" r="12" fill="#fff" opacity=".6"/><circle cx="920" cy="28" r="16" fill="#fff" opacity=".5"/>`,
    lec:[160,520,980].map(x=>cloud(x,110,1.2,.8)).join('')+`<g opacity=".7" transform="translate(620 110)"><rect width="16" height="50" rx="3" fill="#ffadad"/><rect x="18" y="8" width="14" height="42" rx="3" fill="#fdffb6"/><rect x="34" y="2" width="16" height="48" rx="3" fill="#9bf6ff"/></g>`,
    boss:['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#bdb2ff'].map((c,i)=>{const r=560-i*16;return `<path d="M${600-r} 260 A${r} ${r*.45} 0 0 1 ${600+r} 260" fill="none" stroke="${c}" stroke-width="16" opacity=".5"/>`}).join('')

function portal(edit=false){
  setScene(null);
  const needPet=!S.pet, ask=edit||!S.name||needPet;
  $('#portalRoot').innerHTML=`<div class="portal" id="portal"><div class="stars-bg"></div>
   <div class="portal-in">
    <div class="ring">${dragon(PAL.guia,'class="bob"')}</div>
    <h1>El Reino Arcoíris</h1>
    <p>${ask?(S.name&&!edit?`¡Hola otra vez, ${NM()}! Antes de entrar, ponle nombre a tu dragoncito guía.`:'El portal mágico se ha abierto. Al otro lado te esperan cinco huevos de dragón arcoíris y un montón de retos de Lengua. Antes de entrar, dinos quién eres'+(needPet?' y ponle nombre a tu dragoncito guía, un dragón articulado de todos los colores.':'.')):`¡Hola otra vez, ${NM()}! ${pet()} te está esperando al otro lado del portal.`}</p>
    ${ask&&(edit||!S.name)?nameForm():''}
    ${needPet?'<label for="petName">¿Cómo se llama tu dragoncito?</label><input id="petName" maxlength="16" autocomplete="off" placeholder="Algodón">':''}
    <button class="btn gold" id="enter" type="button">¡Entrar en el reino!</button>
    ${ask?'':`<button class="linkbtn" id="notMe" type="button">¿No eres ${NM()}? Cambiar nombre</button>`}
   </div></div>`;
  const go=()=>{
    if($('#nmIn')&&!readName())return;
    if(needPet){const v=($('#petName').value||'').trim();S.pet=v||'Algodón';save()}
    const p=$('#portal');p.classList.add('go');sfx.pum();
    setTimeout(()=>{pum(()=>{});p.classList.add('out');renderWorld()},RM()?0:650);
    setTimeout(()=>{$('#portalRoot').innerHTML=''},RM()?10:1300);
  };
  $('#enter').onclick=go;
  const nm=$('#notMe');if(nm)nm.onclick=()=>portal(true);
  if($('#nmIn'))bindNameEnter(go);
  const inp=$('#petName');if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});if(!$('#nmIn'))inp.focus()}
}
function pum(cb){
  if(RM()){cb&&cb();return}
  const d=document.createElement('div');d.className='pum';d.innerHTML='<div class="pum-flash"></div><div class="pum-rays"></div><div class="pum-word">¡PUM!</div>';
  document.body.appendChild(d);sfx.pum();
  setTimeout(()=>{cb&&cb()},380);
  setTimeout(()=>d.remove(),1000);
}

function renderWorld(){

  const {cur,next}=rankInfo();

  const n=Object.keys(S.hatched).length;
  $('#app').innerHTML=`
  <section class="hero">
    <div class="guide-big">${dragon(PAL.guia,'class="bob"')}</div>
    <div>
      <h1>${S.name?`¡${pers('{Bienvenida|Bienvenido}')} al Reino Arcoíris, ${NM()}!`:'¡Hola!'}</h1>
      <button class="linkbtn" id="nmBtn" type="button">Cambiar nombre</button>
      <p>${n===0?`Soy ${pet()}, tu dragoncito guía. En cada lugar del reino hay un huevo de dragón arcoíris. Toca un lugar, vuela hasta él y… ¡PUM! Aparecerán los retos. Si los superas, el huevo se abrirá.`:n<5?`${pet()} está muy orgulloso: ya has despertado a ${n} ${n===1?'dragón':'dragones'}. ¡Quedan huevos por abrir!`:'¡Has despertado a todos los dragones! Sigue jugando: cada vez aparecen retos nuevos hasta que los hayas visto todos.'}</p>
      <div class="rank"><span>${pers(cur[1])}</span><span class="rank-bar" aria-hidden="true"><i style="width:${pct}%"></i></span><small>${next?`${next[0]-S.gems} gemas para «${pers(next[1])}»`:'¡Rango máximo!'}</small></div>
    </div>
  </section>
  <div class="sec-title"><h2>Mapa del reino</h2>${S.hatched.boss?'<button class="btn gold" id="dipBtn" type="button">Ver mi diploma</button>':'<small>Toca un lugar para viajar</small>'}</div>
  <div class="world-wrap"><div class="world-scroll" id="wscroll">${worldSVG()}</div><div class="scroll-hint">Desliza el mapa hacia los lados para ver todo el reino</div></div>
  <div class="sec-title"><h2>Retos del reino</h2><small>Los retos no se repiten hasta que los hayas visto todos</small></div>
  <div class="quests">${ISLANDS.map(questCard).join('')}</div>
  <section class="nest-row"><h2>Mi nido de dragones</h2><div class="nest-list">
    <div class="nest-slot">${dragon(PAL.guia)}<div>${pet()}</div><span class="who">Tu dragoncito guía</span></div>
    ${ISLANDS.map(i=>`<div class="nest-slot">${S.hatched[i.id]?dragon(PAL[i.pal]):egg(PAL[i.pal],0,'style="width:70px;height:86px"')}<div>${S.hatched[i.id]?i.dragon:'Huevo sin abrir'}</div><span class="who">${i.name}</span></div>`).join('')}
  </div></section>`;
  document.querySelectorAll('.place,.quest').forEach(el=>{
    const act=()=>{const id=el.dataset.id;if(id==='boss'&&!unlockedBoss()){toast('El Castillo se abre cuando despiertes a los otros cuatro dragones');return}travel(id)};
    el.addEventListener('click',act);
    if(el.classList.contains('place'))el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
  });
  const d=$('#dipBtn');if(d)d.onclick=()=>diploma();
  $('#nmBtn').onclick=()=>changeName(renderWorld);

}
function questCard(i){
  const locked=i.id==='boss'&&!unlockedBoss();
  const left=leftCount(i.id);
  return `<button class="quest" type="button" data-id="${i.id}" ${locked?'aria-disabled="true"':''}>
    <span class="ico">${S.hatched[i.id]?dragon(PAL[i.pal]):egg(PAL[i.pal],0)}</span>
    <span><h3>${i.name}</h3><span class="sub">${i.topic}</span>
    <span class="meta">${locked?`<span class="new-tag">Bloqueado</span>`:`<span class="stars">${starsHTML(S.stars[i.id])}</span><span class="new-tag">${left} retos nuevos</span>`}</span></span></button>`;
}
function travel(id){
  sfx.fly();
  const svg=$('#world'),g=$('#guide'),I=isle(id);
  const go=()=>{S.last=id;save();pum(()=>{window.scrollTo(0,0);start(id)})};
  if(RM()||!svg||!g){go();return}
  // asegurar que el mapa está visible
  svg.scrollIntoView({behavior:'smooth',block:'center'});
  const ws=$('#wscroll');if(ws.scrollWidth>ws.clientWidth)ws.scrollTo({left:Math.max(0,I.x/1000*ws.scrollWidth-ws.clientWidth/2),behavior:'smooth'});
  const m=/translate\(([-\d.]+)[ ,]([-\d.]+)\)/.exec(g.getAttribute('transform'));
  const [x0,y0]=[+m[1],+m[2]],[x1,y1]=guidePos(id);
  const t0=performance.now(),D=900;
  (function step(t){const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const x=x0+(x1-x0)*e,y=y0+(y1-y0)*e-Math.sin(Math.PI*e)*90;
    g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    if(k<1)requestAnimationFrame(step);
    else{svg.style.transformOrigin=`${I.x/10}% ${(I.y-30)/6.4}%`;svg.classList.add('zoom');setTimeout(go,650)}
  })(t0);
}

/* =========================================================
   PARTIDA
   ========================================================= */
function drawFrom(id,n,silent){
  let pool=BANK[id].filter(q=>!S.seen[id].includes(q.id));
  if(pool.length<n){S.seen[id]=[];pool=BANK[id].slice();if(!silent)setTimeout(()=>toast('¡Has visto todos los retos de esta isla! Los barajamos de nuevo.'),600);save()}
  return balanced(pool,n);
}
function drawTexts(n,silent){
  let pool=TEXTS.filter(T=>!S.seen.lec.includes(T.id));
  if(pool.length<n){S.seen.lec=[];pool=TEXTS.slice();if(!silent)setTimeout(()=>toast('¡Has leído todos los textos! Los barajamos de nuevo.'),600);save()}
  return shuffle(pool).slice(0,n);
}
function balanced(bank,n){
  const byType={};bank.forEach(q=>(byType[q.t]=byType[q.t]||[]).push(q));
  Object.keys(byType).forEach(t=>byType[t]=shuffle(byType[t]));
  const out=[];const types=Object.keys(byType);
  while(out.length<n){
    const avail=types.filter(t=>byType[t].length);if(!avail.length)break;
    const last2=out.slice(-2).map(q=>q.t);
    const okT=avail.filter(t=>!(last2.length===2&&last2[0]===t&&last2[1]===t));
    out.push(byType[pick(okT.length?okT:avail)].pop());
  }
  return out;
}
function start(id){
  const I=isle(id);let qs;
  if(id==='boss'){
    const T=drawTexts(1,true)[0];
    qs=[...shuffle([...drawFrom('voc',3,true),...drawFrom('gra',3,true),...drawFrom('ort',3,true)]),...shuffle(T.qs).slice(0,3)];
  }else if(id==='lec'){qs=drawTexts(2).flatMap(T=>T.qs)}
  else qs=drawFrom(id,I.total);
  G={id,I,qs,idx:0,correct:0,results:[],streak:0,best:0,hearts:id==='boss'?3:null,gained:0,locked:false};
  setScene(id);header(true);renderQ();
}
const TYPE_LABEL={mc:'Elige la respuesta',cls:'Clasifica',split:'Zarpazo de lexema',acc:'Chispa de tilde',caps:'Caza de mayúsculas',hunt:'Caza de palabras'};
const SRC_PAL={voc:'lila',gra:'verdin',ort:'rubi',lec:'brisa'};
function passage(id,open=true){
  const T=TEXTS.find(x=>x.id===id);
  const body=pers(T.body);
  const paras=T.pre?`<p class="pre">${body}</p>`:body.split('\n').map(p=>`<p>${p}</p>`).join('');
  return `<div class="parch" id="parch"><h3>${pers(T.title)}</h3><div id="parchBody" ${open?'':'hidden'}>${paras}</div><button class="parch-tog" id="parchTog" type="button">${open?'Ocultar el texto':'Volver a leer el texto'}</button></div>`;
}
function renderQ(){
  const {I,qs,idx}=G;const q=qs[idx];G.locked=false;
  const p=PAL[I.pal];
  const cracks=Math.min(4,Math.ceil(G.correct/(I.total/4)));
  const firstOfText=q.txt&&(idx===0||qs[idx-1].txt!==q.txt);
  $('#app').innerHTML=`
  <div class="play">

    <div class="hud">
      <div class="dots" aria-label="Reto ${idx+1} de ${qs.length}">${qs.map((_,i)=>`<i class="${G.results[i]===true?'ok':G.results[i]===false?'no':i===idx?'now':''}"></i>`).join('')}</div>
      ${G.hearts!==null?`<div class="hearts" aria-label="${G.hearts} vidas">${[0,1,2].map(i=>ICON.heart(i<G.hearts)).join('')}</div>`:''}
      ${G.streak>=3?`<span class="streak">${ICON.flame}×${G.streak}</span>`:''}
      <div class="hud-egg" id="hudEgg">${egg(p,cracks)}</div>
    </div>
    <article class="qcard">
      <div class="qmeta"><span>Reto ${idx+1} de ${qs.length} · ${TYPE_LABEL[q.t]}</span><span>${q.k}</span></div>
      ${q.txt?passage(q.txt,firstOfText||true):''}
      <div class="qhead"><div class="mini">${dragon(PAL[SRC_PAL[q.src]])}</div><div class="q" id="qtext"></div></div>
      <div class="area" id="area"></div>
      <div id="fb"></div>
    </article>
  </div>`;
  const tog=$('#parchTog');if(tog)tog.onclick=()=>{const b=$('#parchBody');b.hidden=!b.hidden;tog.textContent=b.hidden?'Volver a leer el texto':'Ocultar el texto'};
  ({mc:rMC,cls:rCLS,split:rSPLIT,acc:rACC,caps:rCAPS,hunt:rHUNT})[q.t](q);
  if(!RM())setTimeout(()=>{const c=$('.qcard');if(c){const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top+40,PAL[I.pal],26)}},120);
}
function markSeen(q){
  if(q.src==='lec'){if(!S.seen.lec.includes(q.txt))S.seen.lec.push(q.txt)}
  else if(!S.seen[q.src].includes(q.id))S.seen[q.src].push(q.id);
}
function answer(ok,exp){
  if(G.locked)return;G.locked=true;
  const q=G.qs[G.idx];markSeen(q);
  G.results[G.idx]=ok;
  let gain=0,extra='';
  if(ok){G.correct++;G.streak++;G.best=Math.max(G.best,G.streak);gain=10;if(G.streak>=3){gain+=5;extra='¡Racha de fuego arcoíris! +5'}sfx.ok();
    const e=$('#hudEgg');if(e){e.innerHTML=egg(PAL[G.I.pal],Math.min(4,Math.ceil(G.correct/(G.I.total/4))));e.classList.remove('wob');void e.offsetWidth;e.classList.add('wob')}}
  else{G.streak=0;sfx.no();if(G.hearts!==null)G.hearts--}
  S.gems+=gain;G.gained+=gain;save();header(true);
  const last=G.idx>=G.qs.length-1||G.hearts===0;
  const title=ok?pick([`¡Fantástico, ${NM()}!`,'¡Llamarada de sabiduría!',pers('¡Eso es, {Guardiana|Guardián}!'),'¡Perfecto!','¡Brillas como un arcoíris!',`¡${pet()} da volteretas de alegría!`]):pick(['¡Uy, casi!',pers('Vamos a verlo {juntas|juntos}'),'¡Así se aprende!','¡Era difícil! Mira:']);
  $('#fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}" role="status">
    <div class="mini">${dragon(PAL[SRC_PAL[q.src]])}</div>
    <div><h3>${title}${ok?` <span class="gain">+${gain}</span>`:''}</h3><p>${exp}${extra?`<br><b>${extra}</b>`:''}${!ok&&G.hearts!==null?`<br>Te ${G.hearts===1?'queda 1 vida':`quedan ${G.hearts} vidas`}.`:''}</p></div>
    <button class="btn ${ok?'green':''}" id="next" type="button">${last?'Ver resultado':'Siguiente reto →'}</button></div>`;
  const n=$('#next');n.onclick=()=>{sfx.tap();if(last)finish();else{G.idx++;renderQ();window.scrollTo({top:0,behavior:RM()?'auto':'smooth'})}};
  n.scrollIntoView({behavior:RM()?'auto':'smooth',block:'nearest'});n.focus({preventScroll:true});
  const dots=document.querySelectorAll('.dots i');if(dots[G.idx])dots[G.idx].className=ok?'ok':'no';
  const h=document.querySelector('.hearts');if(h)h.innerHTML=[0,1,2].map(i=>ICON.heart(i<G.hearts)).join('');
  if(ok&&!RM()){const r=n.getBoundingClientRect();burst(r.left+r.width/2,r.top,PAL[G.I.pal],18)}
}

/* --- opción múltiple --- */
function rMC(q){
  $('#qtext').innerHTML=pers(q.q);
  const opts=shuffle(q.o.map((t,i)=>({t:pers(t),ok:i===0})));
  const area=$('#area');
  area.innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${o.t}</button>`).join('')}</div>`;
  const btns=[...area.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    if(G.locked)return;const o=opts[+b.dataset.i];
    b.classList.add(o.ok?'ok':'no');
    btns.forEach((bb,j)=>{bb.disabled=true;if(opts[j].ok)bb.classList.add('ok')});
    answer(o.ok,pers(q.exp));
  });
}
/* --- clasificar en nidos --- */
function rCLS(q){
  $('#qtext').innerHTML=q.q;
  const items=shuffle(q.items.map(([t,c])=>({t,c})));
  let sel=null,errors=0,placed=0;
  const area=$('#area');
  area.innerHTML=`<p class="hint">Toca una tarjeta y después el nido donde va. Para ganar el reto, ¡todas a la primera!</p>
    <div class="chips">${items.map((it,i)=>`<button class="chip" type="button" data-i="${i}">${it.t}</button>`).join('')}</div>
    <div class="nests">${q.b.map((b,j)=>`<button class="nest" type="button" data-j="${j}"><span class="nest-label">${b}</span><span class="nest-items"></span></button>`).join('')}</div>`;
  const chips=[...area.querySelectorAll('.chip')];
  chips.forEach(c=>c.onclick=()=>{if(G.locked)return;sfx.tap();chips.forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=+c.dataset.i});
  area.querySelectorAll('.nest').forEach(n=>n.onclick=()=>{
    if(G.locked)return;
    if(sel===null){toast('Primero toca una tarjeta');return}
    const it=items[sel],chip=chips[sel],j=+n.dataset.j;
    if(it.c===j){
      sfx.ok();chip.classList.add('gone');n.querySelector('.nest-items').insertAdjacentHTML('beforeend',`<span>${it.t}</span>`);placed++;sel=null;
      if(placed===items.length)answer(errors===0,(errors===0?'¡Todo en su sitio a la primera! ':`Has tenido ${errors} ${errors===1?'despiste':'despistes'}. `)+q.exp);
    }else{
      errors++;sfx.no();
      [chip,n].forEach(el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')});
      toast('Ese no es su nido. ¡Prueba otro!');
    }
  });
}
/* --- separar lexema y morfemas --- */
function rSPLIT(q){
  $('#qtext').innerHTML=`Separa el <b>lexema</b> (la raíz) de los <b>morfemas</b> en <i>${q.w}</i>. Toca el hueco entre dos letras para dar el zarpazo.`;
  const L=[...q.w];let cut=null,done=false;
  const area=$('#area');
  const draw=(show)=>{
    const c=show??cut;
    area.innerHTML=`<div class="legend"><span><b style="background:#d4f7e2;border:2px solid #11663a"></b>Lexema</span><span><b style="background:#ffe7c7;border:2px solid #9a4b00"></b>Morfemas</span></div>
    <div class="word">${L.map((ch,i)=>`<span class="let ${c===null?'':(i<c?'lex':'mor')}">${ch}</span>${i<L.length-1?`<button class="gap ${cut===i+1?'on':''}" type="button" data-c="${i+1}" aria-label="Cortar entre ${ch} y ${L[i+1]}" ${done?'disabled':''}></button>`:''}`).join('')}</div>
    <div class="center"><button class="btn" id="chk" type="button" ${cut===null||done?'disabled':''}>¡Zarpazo!</button></div>`;
    area.querySelectorAll('.gap').forEach(g=>g.onclick=()=>{if(done)return;sfx.tap();cut=+g.dataset.c;draw()});
    const b=$('#chk');if(b)b.onclick=()=>{if(done)return;const ok=cut===q.cut;done=true;draw(q.cut);answer(ok,(ok?'':`Se corta así: <b>${q.w.slice(0,q.cut)}</b> | ${q.w.slice(q.cut)}. `)+q.exp)};
  };
  draw();
}
/* --- ¿dónde va la tilde? --- */
const TILDE={a:'á',e:'é',i:'í',o:'ó',u:'ú'};
function rACC(q){
  $('#qtext').innerHTML=`Rubí quiere lanzar una chispa de tilde. ¿Sobre qué vocal de <i>${q.w}</i> cae? Si no lleva tilde, pulsa «No lleva tilde».`;
  const L=[...q.w];
  const right=q.i<0?q.w:q.w.slice(0,q.i)+TILDE[q.w[q.i]]+q.w.slice(q.i+1);
  const area=$('#area');
  area.innerHTML=`<div class="word">${L.map((ch,i)=>'aeiou'.includes(ch)?`<button class="vow" type="button" data-i="${i}" aria-label="Vocal ${ch}">${ch}</button>`:`<span class="let">${ch}</span>`).join('')}</div>
  <div class="center"><button class="btn ghost" id="none" type="button">No lleva tilde</button></div>`;
  const vows=[...area.querySelectorAll('.vow')];
  const done=(i,el)=>{
    if(G.locked)return;const ok=i===q.i;
    vows.forEach(v=>{v.disabled=true;if(+v.dataset.i===q.i){v.classList.add('ok');v.textContent=TILDE[v.textContent]}});
    if(!ok&&el)el.classList.add('no');
    $('#none').disabled=true;
    answer(ok,`Se escribe <b>${right}</b>. ${q.exp}`);
  };
  vows.forEach(v=>v.onclick=()=>done(+v.dataset.i,v));
  $('#none').onclick=e=>done(-1,e.currentTarget);
}
/* --- caza de mayúsculas --- */
const firstL=t=>t.search(/[a-záéíóúüñ]/i);
const capT=t=>{const k=firstL(t);return k<0?t:t.slice(0,k)+t[k].toUpperCase()+t.slice(k+1)};
function rCAPS(q){
  $('#qtext').innerHTML='¡Un dragón travieso ha borrado las mayúsculas! Toca las palabras que deberían empezar con mayúscula y pulsa «Comprobar».';
  const toks=q.s.split(' ');
  const need=toks.map(t=>{const k=firstL(t);return k>=0&&t[k]!==t[k].toLowerCase()});
  const st=toks.map(()=>false);
  const area=$('#area');
  area.innerHTML=`<div class="sent">${toks.map((t,i)=>`<button class="tok" type="button" data-i="${i}" aria-pressed="false">${t.toLowerCase()}</button>`).join('')}</div>
  <div class="center"><button class="btn" id="chk" type="button">Comprobar</button></div>`;
  const tb=[...area.querySelectorAll('.tok')];
  tb.forEach(b=>b.onclick=()=>{if(G.locked)return;sfx.tap();const i=+b.dataset.i;st[i]=!st[i];b.textContent=st[i]?capT(toks[i].toLowerCase()):toks[i].toLowerCase();b.classList.toggle('up',st[i]);b.setAttribute('aria-pressed',st[i])});
  $('#chk').onclick=()=>{
    if(G.locked)return;let ok=true;
    tb.forEach((b,i)=>{b.disabled=true;b.classList.remove('up');
      if(need[i]&&st[i])b.classList.add('ok');
      else if(need[i]&&!st[i]){b.classList.add('miss');b.textContent=toks[i];ok=false}
      else if(!need[i]&&st[i]){b.classList.add('extra');ok=false}
    });
    $('#chk').disabled=true;
    answer(ok,(ok?'':`Así queda bien: «${q.s}» `)+q.exp);
  };
}
/* --- caza de palabras en una frase --- */
const norm=t=>t.toLowerCase().replace(/[¿?¡!.,;:«»"]/g,'');
function rHUNT(q){
  $('#qtext').innerHTML=q.q+' Después pulsa «Comprobar».';
  const toks=q.s.split(' ');
  const need=toks.map(t=>q.ans.includes(norm(t)));
  const st=toks.map(()=>false);
  const area=$('#area');
  area.innerHTML=`<div class="sent">${toks.map((t,i)=>`<button class="tok" type="button" data-i="${i}" aria-pressed="false">${t}</button>`).join('')}</div>
  <div class="center"><button class="btn" id="chk" type="button">Comprobar</button></div>`;
  const tb=[...area.querySelectorAll('.tok')];
  tb.forEach(b=>b.onclick=()=>{if(G.locked)return;sfx.tap();const i=+b.dataset.i;st[i]=!st[i];b.classList.toggle('up',st[i]);b.setAttribute('aria-pressed',st[i])});
  $('#chk').onclick=()=>{
    if(G.locked)return;
    if(!st.some(Boolean)){toast('Toca al menos una palabra');return}
    let ok=true;
    tb.forEach((b,i)=>{b.disabled=true;b.classList.remove('up');
      if(need[i]&&st[i])b.classList.add('ok');
      else if(need[i]&&!st[i]){b.classList.add('miss');ok=false}
      else if(!need[i]&&st[i]){b.classList.add('extra');ok=false}
    });
    $('#chk').disabled=true;
    answer(ok,(ok?'':'Las palabras con borde punteado eran las que faltaban. ')+q.exp);
  };
}

   FINAL DE PARTIDA, ECLOSIÓN Y DIPLOMA
   ========================================================= */
function finish(){
  const {id,I,correct,qs}=G;
  let stars;
  if(id==='boss')stars=G.hearts>0?G.hearts:0;
  else stars=correct>=7?3:correct>=5?2:correct>=4?1:0;
  const bonus=stars*20;S.gems+=bonus;G.gained+=bonus;
  const firstHatch=stars>0&&!S.hatched[id];
  const improved=stars>S.stars[id];
  if(improved)S.stars[id]=stars;
  if(firstHatch)S.hatched[id]=true;
  save();header(true);
  const msg=stars===3?'¡Puntuación perfecta de dragón!':stars===2?'¡Muy bien! Estás muy cerca de las tres estrellas.':stars===1?'¡Conseguido! Vuelve a intentarlo para ganar más estrellas.':(id==='boss'?'El Castillo es muy difícil. Repasa el Grimorio y vuelve a intentarlo: ¡tú puedes!':'El huevo aún no se ha abierto: necesitas 4 aciertos. Repasa el Grimorio y vuelve a intentarlo.');
  const show=()=>{
    if(stars>0)sfx.win();
    showOv(`<h2>${stars>0?'¡Reto superado!':'¡Casi lo tienes!'}</h2>
    <div class="big-stars">${[0,1,2].map(i=>ICON.star(i<stars).replace('class="on"',`class="on" style="animation-delay:${i*.2}s"`)).join('')}</div>
    <p>${id==='boss'?`Has llegado con ${G.hearts} ${G.hearts===1?'vida':'vidas'}`:`Has acertado ${correct} de ${qs.length}`}. Mejor racha: ${G.best}. Gemas ganadas: <b class="gain">+${G.gained}</b></p>
    <p>${msg}${improved&&!firstHatch&&stars>0?' ¡Nuevo récord de estrellas!':''}</p>
    <div class="center"><button class="btn ghost" id="again" type="button">Más retos aquí</button><button class="btn" id="tomap" type="button">Volver al mapa</button></div>`);

    $('#tomap').onclick=()=>{hideOv();pum(()=>{renderWorld();window.scrollTo(0,0);if(id!=='boss'&&unlockedBoss()&&firstHatch)setTimeout(()=>toast('¡El Castillo Arcoíris se ha abierto!'),500)})};

 <h3>Antónimos</h3><div class="rule-box">Palabras que significan <b>lo contrario</b>: <i>escaso – abundante</i>. Muchos se forman con prefijos:
 <ul><li><b>des-</b>: confiar → desconfiar</li><li><b>in-</b>: útil → inútil</li><li><b>im-</b> (delante de p, b): posible → imposible</li><li><b>i-</b> (delante de l): legal → ilegal</li><li><b>ir-</b> (delante de r): regular → irregular</li></ul></div>`,
 gra:`<h3>Clases de palabras</h3><div class="rule-box"><ul>
 <li><b>Sustantivo</b>: nombra (dragón, alegría).</li><li><b>Adjetivo</b>: dice cómo es el sustantivo (verde, feroz).</li>
 <li><b>Determinante</b>: acompaña al sustantivo (el, una, mis, este, tres).</li><li><b>Pronombre</b>: sustituye al sustantivo (ella, nos, este cuando va solo).</li>
 <li><b>Verbo</b>: acción o estado (volar, es).</li><li><b>Adverbio</b>: lugar, tiempo, modo, cantidad (aquí, mañana, despacio, muy).</li>
 <li><b>Preposición</b>: a, ante, bajo, con, contra, de, desde, en, entre, hacia, hasta, para, por, según, sin, sobre, tras.</li>
 <li><b>Conjunción</b>: une (y, o, pero). <b>Interjección</b>: emoción (¡ay!, ¡bravo!).</li></ul>
 Truco: una misma palabra puede cambiar de clase según la frase. «<i>Este</i> huevo» (determinante) / «<i>Este</i> es mío» (pronombre).</div>
 <h3>Variables e invariables</h3><div class="rule-box"><b>Variables</b> (cambian de género, número, persona o tiempo): sustantivo, adjetivo, determinante, pronombre y verbo.<br><b>Invariables</b> (nunca cambian): adverbio, preposición, conjunción e interjección.<br>Si una palabra cambia aunque sea solo de número (verde → verdes), ya es variable.</div>
 <h3>Estructura de la palabra</h3><div class="rule-box"><b>Lexema</b>: la raíz, que da el significado (<i>carn</i>-icero). <b>Morfemas</b>: lo que se añade. De género y número (gat-<b>a</b>-<b>s</b>), <b>prefijos</b> delante (<b>re</b>leer, <b>sub</b>terráneo) y <b>sufijos</b> detrás (zapat<b>ero</b>, perr<b>azo</b>, gat<b>ito</b>).</div>
 <h3>Primitivas, derivadas y compuestas</h3><div class="rule-box"><b>Primitiva</b>: no viene de otra (sol). <b>Derivada</b>: lexema + prefijo o sufijo (soleado). <b>Compuesta</b>: dos palabras unidas (girasol). Las que comparten lexema forman una <b>familia de palabras</b>.</div>`,
 ort:`<h3>Mayúsculas</h3><div class="rule-box"><b>Sí</b>: al empezar un escrito, después de punto, después de ? o ! si termina la oración, nombres propios (Lucía, Tajo, Aranjuez), instituciones y museos (Museo del Prado), festividades (Navidad) y la primera palabra de un título (Las aventuras de la dragona Brisa).<br><b>No</b>: días, meses, estaciones, idiomas, gentilicios y títulos como rey, reina o profesora.</div>
 <h3>Reglas generales de acentuación</h3><div class="rule-box"><ul>
 <li><b>Agudas</b> (última sílaba): tilde si acaban en <b>vocal, n o s</b>. Autobús, ciempiés. Pared, bondad: sin tilde.</li>
 <li><b>Llanas</b> (penúltima): tilde si <b>no</b> acaban en vocal, n ni s. Cárcel, álbum, carácter. Imagen, joven: sin tilde.</li>
 <li><b>Esdrújulas</b> y <b>sobresdrújulas</b>: tilde <b>siempre</b>. Jóvenes, imágenes, explícamelo.</li></ul>
 Truco: al pasar al plural, algunas palabras cambian de grupo: joven (llana) → jóvenes (esdrújula).</div>`,
 lec:`<h3>Trucos para comprender un texto</h3><div class="rule-box"><ul>
 <li>Lee el título y piensa de qué tratará.</li><li>Lee todo el texto una vez, sin prisa.</li>
 <li>Lee la pregunta y vuelve al texto a buscar la pista.</li>
 <li>Algunas respuestas están escritas en el texto; otras hay que <b>deducirlas</b> con las pistas.</li>
 <li>Si una palabra es difícil, fíjate en las de alrededor para adivinar su significado.</li></ul></div>
 <h3>Tipos de texto</h3><div class="rule-box"><b>Narrativo</b>: cuenta una historia (cuento). <b>Descriptivo</b>: cuenta cómo es algo o alguien. <b>Informativo</b>: explica cosas reales. <b>Instructivo</b>: da pasos u órdenes (receta, normas). <b>Poema</b>: versos y estrofas, a menudo con rima. También hay <b>cartas</b> (fecha, saludo, cuerpo, despedida y firma), <b>diarios</b> y <b>carteles</b>.</div>`
};
function book(tab='voc'){
  showOv(`<div class="book"><h2 style="text-align:center">El Grimorio de ${NM()}</h2><p style="text-align:center">Las reglas mágicas para despertar a los dragones.</p>
  <div class="tabs" role="tablist">${[['voc','Vocabulario'],['gra','Gramática'],['ort','Ortografía'],['lec','Lectura']].map(([k,l])=>`<button class="tab" type="button" role="tab" aria-selected="${k===tab}" data-k="${k}">${l}</button>`).join('')}</div>
  <div>${BOOK[tab]}</div>
  <div class="center" style="margin-top:14px"><button class="btn" id="bookClose" type="button">Cerrar el Grimorio</button></div></div>`);
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>book(t.dataset.k));
  $('#bookClose').onclick=hideOv;
}

/* =========================================================
   EFECTOS
   ========================================================= */
function particles(list,frames){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);list.forEach(q=>{q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.a+=.2;x.save();x.globalAlpha=Math.max(0,1-t/frames);x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;if(q.s){x.beginPath();x.arc(0,0,q.r/2,0,7);x.fill()}else x.fillRect(-q.r/2,-q.r/4,q.r,q.r/2);x.restore()});if(++t<frames)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
const RAINBOW=['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#bdb2ff','#ffc6ff'];
function confetti(p){if(RM())return;particles(Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,g:.35,r:Math.random()*6+4,c:pick([...RAINBOW,...p.body]),a:Math.random()*6,s:Math.random()<.5})),150)}
function burst(x0,y0,p,n){particles(Array.from({length:n},()=>{const a=Math.random()*Math.PI*2,v=Math.random()*5+2;return {x:x0,y:y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.08,r:Math.random()*5+3,c:pick([...RAINBOW,...p.body]),a:0,s:true}}),50)}

/* =========================================================
   ARRANQUE
   ========================================================= */
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();header(!!G);if(S.sound)sfx.tap()};
$('#bookBtn').onclick=()=>book(G&&G.id!=='boss'?G.id:'voc');
$('#mapBtn').onclick=()=>{
  if(!G){renderWorld();return}
  showOv(`<h2>¿Volver al mapa?</h2><p>Si sales ahora, perderás el progreso de esta partida (las gemas ganadas se quedan).</p><div class="center"><button class="btn ghost" id="stay" type="button">Seguir jugando</button><button class="btn" id="leave" type="button">Volver al mapa</button></div>`);
  $('#stay').onclick=hideOv;$('#leave').onclick=()=>{hideOv();pum(()=>{renderWorld();window.scrollTo(0,0)})};
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#bookClose'))hideOv()});
header(false);
portal();
</script>
