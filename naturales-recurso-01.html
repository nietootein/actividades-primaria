<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Laboratorio de las Mil Especies · Ciencias de la Naturaleza 5.º</title>
<meta name="author" content="NietooteiN">
<meta name="description" content="Una gran variedad de seres vivos: funciones vitales, células, niveles de organización y los cinco reinos. Quinto de primaria, Comunidad de Madrid.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#fff8ef;--bg2:#f4efff;--paper:#ffffff;--ink:#2b2346;--muted:#655d88;--line:#e6dcf5;
  --rosa:#ffb3d4;--rosa2:#ff7fb2;--lila:#cdb8ff;--lila2:#7d5ae6;--agua:#9ff0e2;--agua2:#1fa58f;--crema:#fff1d6;
  --ok:#1f9e6c;--okbg:#e2f8ee;--ko:#d93d5e;--kobg:#ffe6ec;--gold:#ffc93c;--warnbg:#fff3d1;
  --display:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100vh;font-family:var(--body);font-weight:700;color:var(--ink);font-size:17px;line-height:1.5;
  background:radial-gradient(circle at 8% 12%,rgba(255,179,212,.35) 0,transparent 28%),radial-gradient(circle at 92% 6%,rgba(159,240,226,.45) 0,transparent 30%),radial-gradient(circle at 80% 90%,rgba(205,184,255,.35) 0,transparent 32%),var(--bg);background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lila2);outline-offset:3px;border-radius:10px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.15;margin:0 0 .3em}
h1{font-size:clamp(1.6rem,4.4vw,2.4rem)}
h2{font-size:clamp(1.35rem,3.4vw,1.8rem)}
h3{margin:.2em 0;font-weight:900}
p{margin:.4em 0}
.lead{color:var(--muted);max-width:64ch}
.note{color:var(--muted);font-size:.9rem}
.center{text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.nb{font-variant-numeric:tabular-nums;color:var(--lila2);font-weight:900;white-space:nowrap}

/* cabecera */
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,239,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.15rem;margin-right:auto}
.brand .bi{width:36px;height:36px;display:inline-block}.brand svg{width:100%;height:100%}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 12px 2px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.pill span:first-child{width:26px;height:26px;display:inline-block}.pill svg{width:100%;height:100%}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.icon-btn{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800;font-size:.92rem}
.icon-btn:hover{border-color:var(--lila)}
main{max-width:1080px;margin:0 auto;padding:18px 14px 50px}

/* botones */
.btn{background:var(--lila2);color:#fff;border:0;border-radius:14px;padding:11px 20px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #5634b8;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5634b8}
.btn:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.danger{background:var(--ko);box-shadow:0 4px 0 #94233c}
.btn.sm{padding:7px 14px;font-size:.92rem;border-radius:11px}
.linkb{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:4px}

/* bienvenida */
.welcome{text-align:center;padding:16px 6px 6px;display:flex;flex-direction:column;align-items:center}
.w-scene{width:min(420px,90vw);margin-bottom:6px}.w-scene svg{width:100%;display:block}
@media (prefers-reduced-motion:no-preference){.floaty{animation:float 4s ease-in-out infinite}}
@keyframes float{50%{translate:0 -7px}}
.welcome h1{font-size:clamp(2rem,6.5vw,3.2rem);color:var(--lila2);text-shadow:0 3px 0 var(--rosa)}
.namebox{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;margin:14px auto 6px;max-width:520px;width:100%;box-shadow:0 8px 0 var(--line)}
.namebox>label{display:block;font-family:var(--display);font-size:1.35rem;margin-bottom:8px}
.nrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.nrow input{flex:1 1 200px;min-width:0;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.1rem}
.gen{border:0;padding:0;margin:14px 0 0;min-width:0}
.gen legend{font-family:var(--display);font-size:1.2rem;margin:0 auto 8px;padding:0}
.gen-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gen-row label{position:relative;cursor:pointer;display:inline-block}
.gen-row input{position:absolute;opacity:0;width:1px;height:1px}
.gen-row span{display:inline-block;padding:8px 20px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-weight:900}
.gen-row input:checked+span{background:var(--lila2);color:#fff;border-color:var(--lila2)}
.gen-row input:focus-visible+span{outline:3px solid var(--lila2);outline-offset:2px}

/* mapa del laboratorio */
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:stretch;background:linear-gradient(180deg,#fff 0,#fff 72%,var(--crema) 72%);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 0 var(--line)}
.bench .speech{align-self:center}
.bench-art svg{width:100%;height:auto;display:block}
@media (max-width:640px){.bench{grid-template-columns:1fr}.bench-art{max-width:200px;margin:0 auto}}
.speech{background:var(--bg2);border:2px solid var(--lila);border-radius:18px;padding:12px 16px;position:relative}
.speech b{color:var(--lila2)}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.slide{display:flex;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px;position:relative;box-shadow:0 5px 0 var(--line)}
.slide.boss{background:linear-gradient(135deg,#fff0f7,#f1ebff 60%,#e6fbf7);border-color:var(--lila)}
.slide.locked{opacity:.8}
.lens{flex:0 0 84px;height:84px;border-radius:50%;background:#eaf7f4;border:6px solid #3d3557;overflow:hidden;position:relative}
.lens svg{width:100%;height:100%;display:block}
.lens.dim svg{filter:blur(5px) grayscale(.4);opacity:.7}
.lens .lk{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(43,35,70,.45)}
.lens .lk svg{width:40%;height:40%;filter:none;opacity:1}
.s-body{flex:1;min-width:0}
.s-num{font-size:.8rem;color:var(--muted);font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.s-body h3{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0;line-height:1.2}
.s-body p{margin:.15em 0;color:var(--muted);font-size:.9rem}
.s-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stars{display:flex;gap:2px}.stars svg{width:22px}
.left{font-size:.78rem;color:var(--muted);font-weight:800}
svg.on path{fill:var(--gold);stroke:#9b6b00;stroke-width:1.2}svg.off path{fill:#efe9f7;stroke:#cfc4e4;stroke-width:1.2}

/* juego */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.ph-l{display:flex;align-items:center;gap:10px;min-width:0}.ph-ico{width:54px;height:54px;flex:0 0 54px;border-radius:50%;border:4px solid #3d3557;overflow:hidden;background:#eaf7f4}.ph-ico svg{width:100%;height:100%;display:block}
.playhead h1{font-size:clamp(1.2rem,3.2vw,1.7rem);margin:0}.playhead p{margin:0;color:var(--muted);font-size:.92rem}
.streak{display:inline-block;margin-left:8px;background:var(--crema);border:2px solid var(--gold);border-radius:999px;padding:0 9px;font-size:.82rem;color:#7a5200}
.hearts{display:flex;gap:3px}.hearts svg{width:30px}.hearts svg.on path{fill:var(--rosa2);stroke:#a3275a}.hearts svg.off path{fill:#efe9f7;stroke:#cfc4e4}
.prog{display:flex;gap:5px;margin:6px 0 12px;flex-wrap:wrap}
.pp{width:clamp(22px,5vw,30px);height:clamp(22px,5vw,30px);border-radius:50%;border:3px solid var(--line);background:var(--paper)}
.pp.cur{border-color:var(--lila2);box-shadow:0 0 0 3px var(--lila)}
.pp.ok{background:var(--agua2);border-color:var(--agua2)}.pp.ko{background:var(--rosa2);border-color:var(--rosa2)}
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 0 var(--line)}
.qk{display:inline-block;margin:0 0 8px;background:var(--bg2);color:var(--lila2);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:900}
.qq{font-size:1.1rem;margin-bottom:12px}
.qq i{color:var(--lila2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:800;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--lila)}
.opt .bx{flex:0 0 22px;height:22px;border-radius:50%;border:3px solid var(--lila);margin-top:2px;background:#fff}
.multi .opt .bx{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--lila2);background:var(--bg2)}
.opt[aria-checked="true"] .bx{background:var(--lila2);border-color:var(--lila2);box-shadow:inset 0 0 0 3px #fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .bx{border-color:var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--kobg)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt:disabled{cursor:default}

/* clasificar */
.cls{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.crow .it{flex:1 1 180px;font-weight:900}
.crow .bins{display:flex;gap:6px;flex-wrap:wrap}
.bin{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800;font-size:.9rem}
.bin[aria-pressed="true"]{background:var(--lila2);border-color:var(--lila2);color:#fff}
.crow.right{border-color:var(--ok);background:var(--okbg)}.crow.wrong{border-color:var(--ko);background:var(--kobg)}
.crow .sol{flex-basis:100%;font-size:.88rem;color:var(--ko)}
.bin:disabled{cursor:default}

/* ordenar */
.ordw{display:grid;gap:10px}
.ord-src,.ord-dst{display:flex;flex-direction:column;gap:6px;min-height:46px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:8px}
.ord-dst{border-style:solid;background:#fff}
.ord-lab{font-size:.85rem;color:var(--muted);font-weight:900;margin:2px 0}
.chip{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:800;display:flex;gap:10px;align-items:center}
.ord-dst .chip{background:var(--bg2);border-color:var(--lila)}
.chip .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--lila2);color:#fff;display:grid;place-items:center;font-size:.85rem}
.chip.right{border-color:var(--ok);background:var(--okbg)}.chip.wrong{border-color:var(--ko);background:var(--kobg)}
.chip:disabled{cursor:default}
.ord-empty{color:var(--muted);font-size:.9rem;padding:6px}

/* rotular */
.lblw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:640px){.lblw{grid-template-columns:1fr}}
.lblart{background:#f7fbff;border:2px solid var(--line);border-radius:18px;padding:6px}
.lblart svg{width:100%;height:auto;display:block}
.lblsel{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 10px;flex-wrap:wrap}
.lrow .n{flex:0 0 28px;height:28px;border-radius:50%;background:#3d3557;color:#fff;display:grid;place-items:center;font-weight:900}
.lrow select{flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800}
.lrow.right{border-color:var(--ok);background:var(--okbg)}.lrow.wrong{border-color:var(--ko);background:var(--kobg)}
.lrow .sol{flex-basis:100%;font-size:.88rem;color:var(--ko);padding-left:38px}

/* microscopio */
.micw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:12px}
@media (max-width:640px){.micw{grid-template-columns:1fr;justify-items:center}}
.eyepiece{width:min(240px,64vw);aspect-ratio:1;border-radius:50%;background:#1e1a30;padding:14px;box-shadow:0 0 0 6px #3d3557,0 10px 0 6px #2a2440;position:relative}
.eyepiece .view{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#eef9f6;position:relative}
.eyepiece .view svg{width:100%;height:100%;display:block;transition:filter .12s}
.eyepiece .view::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 30px 12px rgba(30,26,48,.55);pointer-events:none}
.eyepiece .zoom{position:absolute;right:-6px;bottom:-6px;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:.85rem;box-shadow:0 3px 0 #b88600}
.focus{width:100%;max-width:340px}
.focus label{display:block;font-weight:900;margin-bottom:4px}
.focus input[type=range]{width:100%;accent-color:var(--lila2);height:30px}
.fstate{font-size:.9rem;color:var(--muted);min-height:1.5em}
.fstate.ok{color:var(--ok)}
.micq{font-size:1.05rem}

/* número */
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow label{font-weight:900}
.numin{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.15rem;width:12ch;font-variant-numeric:tabular-nums}
.numin.right{border-color:var(--ok);background:var(--okbg)}.numin.wrong{border-color:var(--ko);background:var(--kobg)}
.numrow .sol{flex-basis:100%;color:var(--ko);font-size:.92rem}
.sol:empty{display:none}
.btn[aria-disabled="true"]{filter:grayscale(.7);opacity:.6}
.icon-btn svg{width:20px;height:20px;display:block}
@media (max-width:560px){.brand span:last-child{display:none}.icon-btn{padding:3px 9px;font-size:.86rem}.top-in{gap:6px}}
@media (max-width:420px){.brand .bi{display:none}.top-in{padding:8px 10px}.pill{padding:2px 10px 2px 4px}}

/* gráfico */
.chart{max-width:520px;margin:6px auto 12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px}
.chart svg{width:100%;height:auto;display:block}

/* pistas y respuestas */
.hintbox{margin-top:12px;background:var(--warnbg);border:2px solid var(--gold);border-radius:14px;padding:10px 14px}
.fb{margin-top:14px;border-radius:16px;display:flex;gap:12px;align-items:flex-start}
.fb:empty{display:none}
.fb.good,.fb.bad,.fb.warn{padding:12px 14px}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--kobg);border:2px solid var(--ko)}
.fb.warn{background:var(--warnbg);border:2px solid var(--gold)}
.fb .pip{flex:0 0 58px}.fb .pip svg{width:100%;display:block}
.fbt{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 4px}
.exp{font-size:.98rem}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* capas */
.ov{position:fixed;inset:0;z-index:50;background:rgba(43,35,70,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.ov-card{background:var(--paper);border-radius:24px;padding:22px;max-width:560px;width:100%;box-shadow:0 14px 0 rgba(0,0,0,.15);text-align:center;max-height:calc(100vh - 32px);overflow:auto}
.ov-card.wide{max-width:860px;text-align:left}
.big-stars{display:flex;gap:6px;justify-content:center;margin:8px 0}.big-stars svg{width:56px}
.gain{color:var(--lila2)}
.disc-art{width:170px;height:170px;margin:0 auto 8px;border-radius:50%;border:8px solid #3d3557;overflow:hidden;background:#eaf7f4}
.disc-art svg{width:100%;height:100%;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:8px 0}
.tab{flex:0 0 auto;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:900}
.tab[aria-selected="true"]{background:var(--lila2);border-color:var(--lila2);color:#fff}
.bookc h3{font-family:var(--display);font-weight:600;color:var(--lila2);margin-top:14px}
.bookc .eq{background:var(--bg2);border-radius:12px;padding:8px 12px}
.tblw{overflow-x:auto}
.bookc table{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}
.bookc th,.bookc td{border:2px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.bookc th{background:var(--bg2)}

/* atlas */
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:12px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:center;box-shadow:0 5px 0 var(--line)}
.card .disc-art{width:120px;height:120px;border-width:6px}
.card.sil .disc-art svg{filter:blur(7px) grayscale(1);opacity:.5}
.card h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:4px 0}
.card .tag{display:inline-block;background:var(--agua);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:900;margin-bottom:4px}
.card p{font-size:.9rem;color:var(--muted);margin:.2em 0;text-align:left}

/* carnet */
.carnet{border:4px solid var(--lila2);border-radius:22px;padding:18px;background:linear-gradient(135deg,#fff0f7,#f1ebff 55%,#e6fbf7);text-align:center}
.carnet h2{color:var(--lila2)}
.carnet .who{font-family:var(--display);font-size:2rem;margin:4px 0}
.carnet .pipc{width:110px;margin:0 auto}
@media print{body *{visibility:hidden}.carnet,.carnet *{visibility:visible}.carnet{position:absolute;left:0;top:0;width:100%}}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast:empty{display:none}
#toast{visibility:hidden}
#toast.on{transform:translate(-50%,0);visibility:visible}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.credit{text-align:center;color:var(--muted);font-size:.85rem;padding:0 14px 20px}
.credit a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" id="brand"></div>
  <span class="pill" title="Muestras recogidas"><span id="coinIco"></span><span id="coins">0</span></span>
  <button class="icon-btn" id="mapBtn" type="button" hidden>Mesas</button>
  <button class="icon-btn" id="atlasBtn" type="button" hidden>Atlas</button>
  <button class="icon-btn" id="bookBtn" type="button" hidden>Cuaderno</button>
  <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Sonido" title="Sonido"></button>

function cellSVG(kind,nums){
 const C=CELLS[kind];let marks='';
 C.parts.forEach(p=>{const [tx,ty,bx,by]=C.pts[p];const n=nums[p];
  marks+=`<line x1="${bx}" y1="${by}" x2="${tx}" y2="${ty}" stroke="#2b2346" stroke-width="2.5"/><circle cx="${tx}" cy="${ty}" r="4.5" fill="#2b2346" stroke="#fff" stroke-width="1.5"/><circle cx="${bx}" cy="${by}" r="12" fill="#2b2346"/><text x="${bx}" y="${by+5}" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Nunito,Segoe UI,sans-serif">${n}</text>`});
 return `<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dibujo de una célula ${kind==='plant'?'vegetal':'animal'} con ${C.parts.length} partes numeradas">${C.draw()}${marks}</svg>`;
}

/* Gráfico de especies conocidas (rincón de las matemáticas) */
/* Catalogue of Life, versión 2026-10-16 XR (redondeado a miles). Protoctistas = reinos Protozoa + Chromista; bacterias = dominio Bacteria. */
const SPECIES=[['animales',1800000,'#c0392b'],['plantas',408000,'#5a9e3a'],['hongos',175000,'#c9771f'],['protoctistas',76000,'#9b3fb0'],['bacterias',27000,'#1f9e93']];
function chartSVG(){
 const H=180,top=24,base=top+H,max=2000000,x0=70,w=56,gap=22;
 let g='';[0,500000,1000000,1500000,2000000].forEach(v=>{const y=base-v/max*H;g+=`<line x1="${x0-6}" y1="${y}" x2="${x0+5*(w+gap)}" y2="${y}" stroke="#e6dcf5" stroke-width="1.5"/><text x="${x0-10}" y="${y+4}" text-anchor="end" font-size="11" fill="#655d88">${fmtInt(v)}</text>`});
 SPECIES.forEach(([n,v,c],i)=>{const x=x0+gap/2+i*(w+gap);const h=Math.max(1.5,v/max*H);g+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${c}" rx="3"/><text x="${x+w/2}" y="${base-h-6}" text-anchor="middle" font-size="11" font-weight="800" fill="${c}">${fmtInt(v)}</text><text x="${x+w/2}" y="${base+18}" text-anchor="middle" font-size="12" font-weight="800" fill="#2b2346">${n}</text>`});
 return `<div class="chart"><svg viewBox="0 0 470 258" role="img" aria-label="Gráfico de barras: número aproximado de especies conocidas. Animales 1.800.000; plantas 408.000; hongos 175.000; protoctistas 76.000; bacterias 27.000. Fuente: Catalogue of Life, octubre de 2026."><text x="235" y="14" text-anchor="middle" font-size="13" font-weight="900" fill="#2b2346">Número aproximado de especies conocidas de seres vivos</text>${g}<line x1="${x0-6}" y1="${base}" x2="${x0+5*(w+gap)}" y2="${base}" stroke="#2b2346" stroke-width="2"/><text x="235" y="252" text-anchor="middle" font-size="10.5" fill="#655d88">Fuente: Catalogue of Life (octubre de 2026). Cifras redondeadas a miles.</text></svg></div>`;
}

 {id:'c13',t:'mc',q:'¿Qué afirmación sobre los <i>orgánulos</i> es correcta?',o:['Están en el citoplasma; hay varios tipos y cada uno realiza una función diferente','Están fuera de la membrana','Todos son iguales y hacen lo mismo','Solo existen en las plantas'],exp:'Los <b>orgánulos</b> están en el citoplasma. Hay de varios tipos y cada uno tiene su función.'},
 {id:'c14',t:'mc',q:'¿Crees que la membrana es totalmente impermeable y aísla por completo a la célula?',o:['No: deja pasar sustancias, porque la célula necesita tomar lo que necesita y expulsar lo que le sobra','Sí: no entra ni sale nada','Sí: solo deja pasar la luz','No: la célula no tiene membrana'],exp:'Si la membrana no dejara pasar nada, la célula no podría <b>nutrirse</b>. La membrana separa la célula del exterior, pero permite el paso de sustancias.',hint:'¿Podría nutrirse una célula si nada pudiera entrar en ella?'},
 {id:'c15',t:'cls',q:'Une cada descripción con su parte de la célula.',b:['Membrana','Citoplasma','Núcleo','Orgánulos'],items:[['Dirige el funcionamiento de la célula',2],['Separa la célula del exterior',0],['Agua con muchas sustancias disueltas',1],['Hay de varios tipos, cada uno con su función',3]],exp:'Membrana: cubierta. Citoplasma: agua con sustancias. Núcleo: dirige. Orgánulos: realizan funciones diferentes.'},
 {id:'c16',t:'mc',q:'¿Cuántas células tienen, aproximadamente, los animales y las plantas?',o:['Miles de millones','Una sola','Unas cien','Entre diez y veinte'],exp:'Los animales y las plantas tienen <b>miles de millones</b> de células: son <b>pluricelulares</b>.'},
 {id:'c17',t:'mc',q:'Las personas somos seres…',o:['pluricelulares','unicelulares','sin células','de una sola célula muy grande'],exp:'Tenemos muchísimas células (¡billones!) de muchos tipos: somos <b>pluricelulares</b>.'},
 {id:'c18',t:'mic',spec:'paramecio',q:'Esta muestra es una gota de agua de charca. Todo este ser vivo es <i>una sola célula</i>. ¿Qué tipo de ser vivo es?',o:['Unicelular','Pluricelular','Un tejido','Un órgano'],exp:'Es un <b>paramecio</b>, un ser <b>unicelular</b>: una sola célula que se nutre, se relaciona y se reproduce.'},
 {id:'c19',t:'mc',q:'¿Cuál de estos <b>no</b> está formado por células?',o:['Una piedra','Un musgo','Una levadura','Un mosquito'],exp:'La <b>piedra</b> es materia inerte. El musgo (planta), la levadura (hongo unicelular) y el mosquito (animal) son seres vivos.'},
 {id:'c20',t:'cls',q:'¿Verdadero o falso?',b:VF,items:[['Los seres unicelulares se ven a simple vista',1],['Una célula puede nutrirse',0],['Al dividirse, una célula origina células hijas',0],['Las bacterias no están formadas por células',1],['El núcleo está dentro de la célula',0],['El citoplasma es la parte más pequeña de la célula',1]],exp:'Los unicelulares solo se ven con microscopio. Las bacterias son células. El citoplasma es la <b>mayor</b> parte de la célula.'},
 {id:'c21',t:'mic',spec:'ameba',q:'Esta célula vive en el agua, cambia de forma y atrapa su alimento rodeándolo. ¿Qué parte señalarías como «centro de mando»?',o:['El círculo azul del centro: el núcleo','El borde exterior: la membrana','Las bolitas amarillas: el alimento','No tiene centro de mando'],exp:'El <b>núcleo</b> (azul) dirige la célula. El borde es la membrana y las bolitas amarillas son alimento atrapado. ¡Es una <b>ameba</b>!'}
],
/* ---------------- 3. TIPOS DE CÉLULAS ---------------- */
tip:[
 {id:'t01',t:'mc',q:'¿Qué formas pueden tener las células?',o:['Esférica, prismática, estrellada, plana…','Solo esférica','Solo cuadrada','No tienen forma'],exp:'Las células tienen <b>formas diferentes</b>: esférica, prismática, estrellada, plana… según su función.'},
 {id:'t02',t:'mc',q:'¿Qué células son las más pequeñas?',o:['Las de las bacterias','Las de los animales','Las de las plantas','Las de las algas'],exp:'Las <b>bacterias</b> tienen las células más pequeñas: alrededor de <b>0,001 mm</b>.'},
 {id:'t03',t:'mc',q:'¿Cuánto mide, aproximadamente, una bacteria?',o:['0,001 mm','0,1 mm','1 mm','1 cm'],exp:'Una bacteria mide unos <b>0,001 mm</b> (una milésima de milímetro).'},
 {id:'t04',t:'ord',q:'Ordena de <b>menor a mayor</b> tamaño.',items:['Bacteria (0,001 mm)','Célula animal (0,01 a 0,05 mm)','Célula vegetal (unos 0,1 mm)','Acetabularia (más de 1 cm)'],exp:'0,001 mm &lt; 0,01–0,05 mm &lt; 0,1 mm &lt; 1 cm (= 10 mm). La acetabularia es una sola célula ¡que se ve a simple vista!',hint:'Compara los decimales: 0,001 – 0,01 – 0,1. Y recuerda que 1 cm son 10 mm.'},
 {id:'t05',t:'mc',q:'¿Qué tiene de especial la acetabularia?',o:['Es un alga formada por una sola célula que mide más de 1 cm','Es la bacteria más pequeña','Es un animal sin células','Es una planta con raíces gigantes'],exp:'La <b>acetabularia</b> es un alga <b>unicelular</b> enorme: su única célula mide más de 1 cm.'},
 {id:'t06',t:'mc',q:'La mayoría de las células de los animales miden…',o:['entre 0,01 y 0,05 mm','alrededor de 0,001 mm','alrededor de 1 cm','más de 1 metro'],exp:'La mayoría de las células animales miden <b>entre 0,01 y 0,05 mm</b>. Las vegetales son mayores, en torno a 0,1 mm.'},
 {id:'t07',t:'num',q:'Una célula vegetal mide unos <b>0,1 mm</b> y una bacteria unos <b>0,001 mm</b>. ¿Cuántas veces más larga es la célula vegetal?',ans:100,label:'Veces',exp:'0,1 : 0,001 = <b>100</b>. Harían falta unas 100 bacterias en fila para igualar la longitud de una célula vegetal.',hint:'¿Cuántas milésimas hay en una décima?'},
 {id:'t08',t:'cls',q:'Une cada tipo de célula animal con su descripción.',b:['Músculo','Hueso','Sangre','Intestino'],items:[['Son muy largas',0],['Tienen numerosas prolongaciones irregulares',1],['Son esféricas y con forma de disco',2],['Tienen un extremo en forma de cepillo',3]],exp:'Músculo: muy largas. Hueso: prolongaciones irregulares. Sangre: esféricas, con forma de disco. Intestino: extremo en cepillo.'},
 {id:'t09',t:'cls',q:'Une cada tipo de célula animal con su descripción.',b:['Hígado','Cerebro','Músculo','Sangre'],items:[['Bastante grandes y de forma casi esférica',0],['Grandes y con muchas prolongaciones',1],['Muy largas',2],['Esféricas y con forma de disco',3]],exp:'Hígado: grandes y casi esféricas. Cerebro: grandes, con muchas prolongaciones. Músculo: muy largas. Sangre: discos.'},
 {id:'t10',t:'mic',spec:'neurona',q:'Una célula con un cuerpo y muchísimas prolongaciones, una de ellas muy larga. ¿De dónde es?',o:['Del cerebro','De la sangre','Del hígado','Del intestino'],exp:'Es una <b>neurona</b>, una célula del <b>cerebro</b> y de los nervios. Sus prolongaciones transmiten información.'},
 {id:'t11',t:'mic',spec:'globulos',q:'Células esféricas con forma de disco, más claras en el centro. ¿De dónde es la muestra?',o:['De la sangre','Del hueso','Del cerebro','De una hoja'],exp:'Son células de la <b>sangre</b> (glóbulos rojos): esféricas y con forma de disco.'},
 {id:'t12',t:'mic',spec:'muscular',q:'Una célula larguísima, con rayitas y varios núcleos. ¿Qué célula es?',o:['Una célula muscular','Una célula del hígado','Una bacteria','Una célula de la sangre'],exp:'Las células de los <b>músculos</b> son <b>muy largas</b>.'},
 {id:'t13',t:'mic',spec:'vegetal',q:'Células de forma regular, con un borde grueso y muchos puntitos verdes. ¿Qué tipo de células son?',o:['Vegetales: tienen pared rígida y cloroplastos','Animales: tienen forma irregular','Bacterias: son las más pequeñas','De la sangre: tienen forma de disco'],exp:'La <b>pared rígida</b> (borde grueso) y los <b>cloroplastos</b> (verdes) son propios de las células <b>vegetales</b>.'},
 {id:'t14',t:'lbl',cell:'plant',q:'Rotula la célula vegetal: elige el nombre de cada parte numerada.',exp:'La célula vegetal tiene <b>pared rígida</b> por fuera de la <b>membrana</b>, <b>citoplasma</b>, <b>núcleo</b>, <b>orgánulos</b> y <b>cloroplastos</b> (verdes).'},
 {id:'t15',t:'mc',q:'¿Por qué las plantas tienen cierta rigidez y pueden elevarse del suelo?',o:['Porque sus células tienen una pared rígida por fuera de la membrana','Porque tienen huesos','Porque sus células no tienen agua','Porque tienen cloroplastos'],exp:'La <b>pared rígida</b> de sus células da a las plantas firmeza para elevarse del suelo.'},
 {id:'t16',t:'mc',q:'Los cloroplastos son de color verde porque…',o:['contienen clorofila; en ellos se realiza la fotosíntesis','están llenos de agua','son el núcleo de la célula','reflejan el color de la tierra'],exp:'Los <b>cloroplastos</b> contienen <b>clorofila</b> (verde). En ellos se realiza la <b>fotosíntesis</b>.'},
 {id:'t17',t:'cls',q:'¿Lo tiene la célula animal, la vegetal o las dos?',b:['Animal','Vegetal','Las dos'],items:[['Membrana',2],['Pared rígida',1],['Núcleo',2],['Cloroplastos',1],['Citoplasma',2],['Forma irregular y variada',0],['Forma normalmente prismática',1]],exp:'Las dos tienen membrana, citoplasma, núcleo y orgánulos. Solo la vegetal tiene <b>pared rígida</b> y <b>cloroplastos</b> y suele ser <b>prismática</b>. La animal tiene formas más variadas.'},
 {id:'t18',t:'mc',q:'¿Por qué los seres pluricelulares tenemos células de formas y tamaños tan diferentes?',o:['Porque cada tipo de célula está preparado para realizar una función distinta','Porque se forman al azar','Porque se estropean con el tiempo','Porque somos unicelulares'],exp:'La forma de cada célula se ajusta a su <b>función</b>: las musculares son largas para contraerse, las neuronas tienen prolongaciones para conectar…'},
 {id:'t19',t:'mic',spec:'osea',q:'Células con forma de estrella y prolongaciones irregulares. ¿De dónde son?',o:['Del hueso','De la sangre','Del intestino','Del hígado'],exp:'Las células que forman los <b>huesos</b> tienen <b>numerosas prolongaciones irregulares</b>.'},
 {id:'t20',t:'mic',spec:'intestino',q:'Células alargadas con un extremo en forma de cepillo. ¿De dónde son?',o:['Del intestino','Del cerebro','Del músculo','De una hoja'],exp:'Las células del <b>intestino</b> tienen un extremo en forma de <b>cepillo</b>.'},
 {id:'t21',t:'mc',q:'¿Cuál de estas células puede llegar a ser la más larga del cuerpo humano?',o:['Una neurona: algunas superan 1 metro','Un glóbulo rojo','Una célula del hígado','Una célula del intestino'],exp:'Algunas <b>neuronas</b> tienen prolongaciones que van desde la columna hasta el pie: ¡más de <b>1 metro</b>!'},
 {id:'t22',t:'mic',spec:'higado',q:'Células bastante grandes y casi esféricas, muy juntas. ¿De qué órgano es la muestra?',o:['Del hígado','Del cerebro','Del hueso','Del intestino'],exp:'Las células del <b>hígado</b> son bastante grandes y de forma <b>casi esférica</b>.'}
],
/* ---------------- 4. NIVELES DE ORGANIZACIÓN ---------------- */
niv:[
 {id:'n01',t:'ord',q:'Ordena los niveles de organización del más <b>simple</b> al más <b>complejo</b>.',items:['Célula','Tejido','Órgano','Sistema o aparato','Organismo'],exp:'Célula → tejido → órgano → sistema o aparato → organismo.'},
 {id:'n02',t:'mc',q:'¿Qué es un <i>tejido</i>?',o:['Un grupo de células del mismo tipo que realizan una función común','Una sola célula muy grande','Varios órganos que trabajan juntos','El ser vivo completo'],exp:'En un <b>tejido</b> se agrupan células <b>del mismo tipo</b> que realizan una función común.'},
 {id:'n03',t:'mc',q:'¿Cómo se forma un <i>órgano</i>?',o:['Por la unión de varios tejidos que trabajan juntos para realizar una función','Por la unión de varios organismos','Por una sola célula','Por varios sistemas'],exp:'Un <b>órgano</b> está formado por <b>varios tejidos</b>. Un músculo tiene tejido muscular, el tejido que lo recubre, el de los tendones…'},
 {id:'n04',t:'mc',q:'¿Qué es un <i>sistema</i>?',o:['Varios órganos del mismo tipo que realizan la misma función','Un grupo de células iguales','Un solo órgano muy grande','Un conjunto de seres vivos'],exp:'Un <b>sistema</b> está formado por varios órganos del mismo tipo. El sistema muscular está formado por los músculos.'},
 {id:'n05',t:'mc',q:'El sistema muscular y el sistema esquelético se unen y forman…',o:['el aparato locomotor','el sistema nervioso','un tejido óseo','un órgano'],exp:'Músculos + huesos = <b>aparato locomotor</b>. Los sistemas se pueden unir y formar <b>aparatos</b>.'},
 {id:'n06',t:'mc',q:'El nivel de <i>organismo</i> es…',o:['el ser vivo completo, con todos sus órganos, aparatos y sistemas funcionando','el conjunto de células de un tejido','el órgano más importante','una célula aislada'],exp:'El <b>organismo</b> es el ser vivo completo.'},
 {id:'n07',t:'cls',q:'¿A qué nivel de organización pertenece cada ejemplo?',b:['Célula','Tejido','Órgano','Sistema o aparato','Organismo'],items:[['Neurona',0],['Sangre',1],['Corazón',2],['Hoja de un rosal',2],['Sistema esquelético',3],['Un rosal entero',4],['Tejido epidérmico',1],['Glóbulo rojo',0]],exp:'Neurona y glóbulo rojo: <b>células</b>. Sangre y tejido epidérmico: <b>tejidos</b>. Corazón y hoja: <b>órganos</b>. Sistema esquelético: <b>sistema</b>. Rosal entero: <b>organismo</b>.'},
 {id:'n08',t:'cls',q:'¿A qué nivel de organización pertenece cada ejemplo?',b:['Célula','Tejido','Órgano','Sistema o aparato','Organismo'],items:[['Célula muscular',0],['Tejido muscular',1],['Bíceps (un músculo)',2],['Aparato locomotor',3],['Un gato',4],['Tejido óseo',1],['Fémur (un hueso)',2],['Sistema muscular',3]],exp:'Célula muscular → tejido muscular → músculo (órgano) → sistema muscular → aparato locomotor → gato (organismo).'},
 {id:'n09',t:'mc',q:'¿Cuál de estos es un tejido <b>animal</b>?',o:['Tejido óseo','Tejido fotosintético','Tejidos conductores de savia','Tejido epidérmico de las hojas'],exp:'El <b>óseo</b> (de los huesos) es animal. El fotosintético, los conductores y el epidérmico de las hojas son tejidos <b>vegetales</b>.'},
 {id:'n10',t:'cls',q:'¿Tejido animal o vegetal?',b:['Animal','Vegetal'],items:[['Tejido muscular',0],['Tejido nervioso',0],['Tejido óseo',0],['Sangre',0],['Tejido epidérmico de las hojas',1],['Tejidos conductores',1],['Tejido fotosintético',1]],exp:'Animales: muscular, nervioso, óseo, sangre… Plantas: epidérmico (recubre las hojas), conductores (transportan la savia) y fotosintético.'},
 {id:'n11',t:'mc',q:'¿Qué hacen los tejidos conductores de las plantas?',o:['Transportan la savia','Recubren las hojas','Fabrican el alimento','Forman los huesos'],exp:'Los <b>tejidos conductores</b> transportan la <b>savia</b> por la planta.'},
 {id:'n12',t:'multi',q:'Una hoja es un órgano. Marca <b>todos</b> los tejidos que tiene.',o:[['Tejido epidérmico',true],['Tejido fotosintético',true],['Tejidos conductores',true],['Tejido óseo',false],['Tejido muscular',false]],exp:'La hoja tiene tejido <b>epidérmico</b>, <b>fotosintético</b> y <b>conductores</b>. Óseo y muscular son de animales.'},
 {id:'n13',t:'mic',spec:'epidermis',q:'Muchas células vegetales iguales, muy juntas, que recubren una hoja. ¿Qué nivel de organización observas?',o:['Tejido','Célula aislada','Órgano','Organismo'],exp:'Son muchas células del mismo tipo con una función común (recubrir): es el <b>tejido epidérmico</b>.'},
 {id:'n14',t:'mic',spec:'tejmus',q:'Muchas células musculares alineadas que trabajan juntas. ¿Qué observas?',o:['Tejido muscular','Una sola célula','El aparato locomotor','Un hueso'],exp:'Células musculares agrupadas = <b>tejido muscular</b>. Varios tejidos juntos formarán un músculo (órgano).'},
 {id:'n15',t:'mc',q:'Además del tejido muscular, ¿qué más necesita un músculo para funcionar?',o:['El tejido que lo recubre y el que forma los tendones, entre otros','Nada más','Cloroplastos','Una pared rígida'],exp:'Un <b>órgano</b> necesita <b>varios tejidos</b>: el músculo tiene tejido muscular, el que lo recubre, el de los tendones…'},
 {id:'n16',t:'mc',q:'¿Tiene una bacteria tejidos y órganos?',o:['No: es unicelular, su única célula es todo el organismo','Sí, como todos los seres vivos','Solo tejidos','Solo órganos'],exp:'Los niveles de tejido, órgano y sistema solo aparecen en los <b>pluricelulares</b>. En una bacteria, la célula es el organismo completo.'},
 {id:'n17',t:'mc',q:'En los laboratorios se cultiva piel humana para curar quemaduras. ¿Qué necesita ese tejido para crecer?',o:['Sustancias nutritivas y condiciones adecuadas, porque sus células se nutren y se reproducen','Solo luz del sol','Nada: crece solo en el vacío','Una pared rígida'],exp:'Sus células están vivas: necesitan <b>nutrientes</b> y condiciones adecuadas (temperatura, humedad…) para nutrirse y <b>dividirse</b>.'},
 {id:'n18',t:'ord',q:'Ordena del nivel más simple al más complejo.',items:['Célula vegetal','Tejido epidérmico','Hoja','Amapola entera'],exp:'Célula → tejido → órgano (hoja) → organismo (amapola).'},
 {id:'n19',t:'mc',q:'¿Qué nivel de organización es el corazón?',o:['Órgano','Tejido','Célula','Organismo'],exp:'El <b>corazón</b> está formado por varios tejidos: es un <b>órgano</b>.'},
 {id:'n20',t:'cls',q:'¿Verdadero o falso?',b:VF,items:[['Las células de un tejido son de distinto tipo',1],['Varios sistemas se pueden unir y formar un aparato',0],['El primer nivel de organización es el tejido',1],['Las plantas también tienen órganos',0],['El sistema esquelético está formado por los músculos',1],['En un organismo, todos sus órganos funcionan juntos',0]],exp:'Las células de un tejido son <b>del mismo tipo</b>. El primer nivel es la <b>célula</b>. El sistema esquelético lo forman los <b>huesos</b>.'},
 {id:'n21',t:'mc',q:'¿Qué ejemplo está bien ordenado de simple a complejo?',o:['Célula ósea → tejido óseo → hueso → sistema esquelético → persona','Hueso → célula ósea → persona → tejido óseo','Persona → hueso → tejido óseo → célula ósea','Tejido óseo → célula ósea → sistema esquelético → hueso'],exp:'Célula → tejido → órgano → sistema → organismo.'}
],
/* ---------------- 5. LOS CINCO REINOS ---------------- */
rei:[
 {id:'r01',t:'multi',q:'Marca los <b>cinco reinos</b> de los seres vivos.',o:[['Animales',true],['Plantas',true],['Hongos',true],['Protoctistas',true],['Bacterias',true],['Minerales',false],['Insectos',false],['Peces',false]],exp:'Animales, plantas, hongos, protoctistas y bacterias. Insectos y peces son grupos de animales; los minerales no son seres vivos.'},
 {id:'r02',t:'cls',q:'¿A qué reino pertenece cada ser vivo?',b:['Animales','Plantas','Hongos','Protoctistas','Bacterias'],items:[['Medusa',0],['Musgo',1],['Seta',2],['Levadura',2],['Alga',3],['Paramecio',3],['Bacteria del yogur',4],['Roble',1]],exp:'¡Cuidado con las algas! No son plantas: están en el reino de los <b>protoctistas</b>, como los protozoos (paramecio). La levadura es un hongo unicelular.'},
 {id:'r03',t:'cls',q:'¿A qué reino pertenece cada ser vivo?',b:['Animales','Plantas','Hongos','Protoctistas','Bacterias'],items:[['Lince ibérico',0],['Moho del pan',2],['Ameba',3],['Helecho',1],['Estrella de mar',0],['Champiñón',2],['Alga laminaria',3],['Bacilo',4]],exp:'El moho y el champiñón son <b>hongos</b>. La ameba y el alga laminaria, <b>protoctistas</b>. El bacilo es una <b>bacteria</b>.'},
 {id:'r04',t:'mc',q:'¿Qué características tienen los <i>animales</i>?',o:['Son pluricelulares, deben tomar alimentos y la mayoría se desplaza','Son unicelulares y fabrican su alimento','Fabrican su alimento y no se desplazan','Viven siempre en el agua'],exp:'Animales: <b>pluricelulares</b>, <b>toman alimentos</b> y la mayoría <b>se desplaza</b>.'},
 {id:'r05',t:'mc',q:'¿Qué características tienen los <i>hongos</i>?',o:['Hay unicelulares y pluricelulares, deben tomar alimentos y no se desplazan','Todos son pluricelulares y fabrican su alimento','Son unicelulares y se desplazan','Son plantas sin hojas'],exp:'Hongos: hay <b>uni</b> y <b>pluricelulares</b>, <b>toman alimentos</b> y <b>no se desplazan</b>.'},
 {id:'r06',t:'mc',q:'Es pluricelular, debe tomar alimentos y se desplaza para obtenerlos. ¿A qué reino pertenece?',o:['Animales','Plantas','Hongos','Bacterias'],exp:'Pluricelular + toma alimentos + se desplaza = <b>animal</b>.'},
 {id:'r07',t:'mc',q:'Es pluricelular y toma alimentos, pero <b>no</b> se desplaza para obtenerlos. ¿A qué reino pertenece?',o:['Hongos','Animales','Plantas','Bacterias'],exp:'Toma alimentos (no es planta) pero no se desplaza (no es animal): es un <b>hongo</b>, como una seta.',hint:'Las plantas no toman alimentos: los fabrican.'},
 {id:'r08',t:'mc',q:'Es unicelular, con una célula muy sencilla y pequeña. ¿A qué reino pertenece?',o:['Bacterias','Animales','Plantas','Hongos'],exp:'Las <b>bacterias</b> son todas unicelulares y son los seres vivos más pequeños y simples.'},

const BOOK={
 fun:`<h3>Las tres funciones vitales</h3><p>Los seres vivos se diferencian de los seres inertes porque realizan la <b>nutrición</b>, la <b>relación</b> y la <b>reproducción</b>.</p>
 <h3>Nutrición</h3><p>Sirve para conseguir <b>materiales</b> (para crecer y reparar el cuerpo) y <b>energía</b> (para todas las actividades).</p>
 <p><b>Animales:</b> toman alimentos. Herbívoros (plantas), carnívoros (otros animales) y omnívoros (de ambos).<br><b>Plantas:</b> fabrican su alimento con agua, sales minerales y dióxido de carbono. Es la <b>fotosíntesis</b>, que necesita la luz del sol.</p>
 <h3>Relación</h3><p>Captar información del exterior y responder adecuadamente. Los animales usan los <b>órganos de los sentidos</b> y responden con el <b>movimiento</b>. Las plantas también captan cambios y responden (algunos árboles pierden las hojas en otoño).</p>
 <h3>Reproducción</h3><p>Tener descendientes. <b>Sexual:</b> dos progenitores. <b>Asexual:</b> un solo progenitor; es más frecuente en plantas (los fresales tienen <b>estolones</b>).</p>`,

 <p><b>Pluricelulares:</b> miles de millones de células (animales y plantas).<br><b>Unicelulares:</b> una sola célula; invisibles sin microscopio.</p>
 <h3>Las células están vivas</h3><p>Se <b>nutren</b> (obtienen sustancias), se <b>relacionan</b> (reciben información y reaccionan) y se <b>reproducen</b> (se dividen en células hijas).</p>
 <h3>Partes de la célula</h3><div class="tblw"><table><tr><th>Parte</th><th>Qué es</th></tr><tr><td>Membrana</td><td>Cubierta que rodea la célula y la separa del exterior.</td></tr><tr><td>Citoplasma</td><td>La mayor parte de la célula: agua con sustancias disueltas.</td></tr><tr><td>Núcleo</td><td>Dirige el funcionamiento de la célula.</td></tr><tr><td>Orgánulos</td><td>Están en el citoplasma; cada tipo realiza una función.</td></tr></table></div>
 <p class="eq">Un elefante no tiene células más grandes que un ratón: tiene <b>muchas más</b>.</p>`,

 <div class="tblw"><table><tr><th>Célula</th><th>Tamaño</th></tr><tr><td>Bacterias (las más pequeñas)</td><td>0,001 mm</td></tr><tr><td>La mayoría de las animales</td><td>0,01 a 0,05 mm</td></tr><tr><td>Vegetales</td><td>unos 0,1 mm</td></tr><tr><td>Acetabularia (alga unicelular)</td><td>más de 1 cm</td></tr></table></div>
 <h3>Células de los animales</h3><p>Músculo: muy largas · Hueso: prolongaciones irregulares · Sangre: esféricas con forma de disco · Intestino: extremo en cepillo · Hígado: grandes, casi esféricas · Cerebro: grandes, con muchas prolongaciones.</p>
 <h3>Células de las plantas</h3><p>Más grandes y de forma más regular (prismática). Tienen <b>pared rígida</b> por fuera de la membrana (por eso las plantas se elevan del suelo) y <b>cloroplastos</b> verdes, con clorofila, donde se hace la fotosíntesis.</p>`,
 niv:`<h3>Del más simple al más complejo</h3><p class="eq">Célula → Tejido → Órgano → Sistema o aparato → Organismo</p>
 <p><b>Tejido:</b> células del mismo tipo con una función común. Animales: muscular, nervioso, óseo, sangre… Plantas: epidérmico (recubre las hojas), conductores (transportan la savia), fotosintético.</p>
 <p><b>Órgano:</b> varios tejidos que trabajan juntos. Un músculo; una hoja.</p>
 <p><b>Sistema:</b> varios órganos del mismo tipo con la misma función (sistema muscular, sistema esquelético). Los sistemas se unen en <b>aparatos</b>: muscular + esquelético = <b>aparato locomotor</b>.</p>
 <p><b>Organismo:</b> el ser vivo completo, con todo funcionando.</p>
 <p class="eq">Los seres unicelulares no tienen tejidos ni órganos: su célula es el organismo.</p>`,

   <div class="maphead"><div><h1>${first?g('¡Bienvenida al laboratorio!','¡Bienvenido al laboratorio!'):NM()+', elige una mesa'}</h1></div>
     <button class="linkb" id="chgName" type="button">¿No eres ${NM()}? Cambiar nombre</button></div>
   <div class="bench"><div class="speech">${msg}</div><div class="bench-art">${ART.pipeta()}</div></div>
   <div class="slides">${ZONES.map((z,i)=>{const lock=z.id==='boss'&&!open;const st=S.stars[z.id];
     return `<article class="slide ${lock?'locked':''} ${z.id==='boss'?'boss':''}">
      <div class="lens ${S.found[z.id]?'':'dim'}">${SPEC[z.spec]()}${lock?`<span class="lk">${ART.lock()}</span>`:''}</div>
      <div class="s-body"><span class="s-num">${z.id==='boss'?'Reto final':'Mesa '+(i+1)}</span><h3>${z.name}</h3><p>${z.topic}</p>

       ${z.id==='boss'?'':`<span class="left">${unseen(z.id)} retos nuevos</span>`}
       <button class="btn sm" type="button" data-z="${z.id}" ${lock?'aria-disabled="true"':''}>${lock?'Bloqueada':st?'Otra ronda':'Empezar'}</button></div></div></article>`}).join('')}</div>
  </section>`;

  $('#chgName').onclick=()=>welcome();
}

/* =========================================================
   RONDAS
   ========================================================= */
function takeFrom(id,n,allowReset){
  let pool=shuffle(BANK[id].filter(q=>!S.seen[id].includes(q.id)));
  let out=pool.slice(0,n);
  if(out.length<n&&allowReset){
    const used=new Set(out.map(q=>q.id));S.seen[id]=[];save();
    out=out.concat(shuffle(BANK[id].filter(q=>!used.has(q.id))).slice(0,n-out.length));
    G&&(G.reshuffled=true);
  }
  if(out.length<n)out=out.concat(shuffle(BANK[id].filter(q=>!out.includes(q))).slice(0,n-out.length));
  return out.map(q=>({...q,zone:id}));
}
/* reparte para que no salgan dos retos del mismo tipo seguidos si se puede */
function spread(qs){
  const out=[];let rest=qs.slice();
  while(rest.length){const last=out.length?out[out.length-1].t:null;let i=rest.findIndex(q=>q.t!==last);if(i<0)i=0;out.push(rest.splice(i,1)[0])}
  return out;
}
function prep(q){
  q=clone(q);
  if(q.t==='mc'||q.t==='mic'){q._o=shuffle(q.o.map((t,i)=>({t,ok:i===0})))}
  if(q.t==='multi'){q._o=shuffle(q.o.map(([t,ok])=>({t,ok})))}
  if(q.t==='cls'){q._it=shuffle(q.items)}
  if(q.t==='ord'){let s;do{s=shuffle(q.items)}while(s.every((x,i)=>x===q.items[i]));q._src=s;q._dst=[]}
  if(q.t==='lbl'){const C=CELLS[q.cell];const nums={};shuffle(C.parts).forEach((p,i)=>nums[p]=i+1);q._nums=nums;q._names=shuffle(C.parts.concat(C.extra))}
  if(q.t==='mic'){q._target=R(22,78);q._f=q._target<50?100:0;q._zoom=pick(['×100','×400','×400','×1000'])}
  return q;
}
function start(id){
  G={id,z:zone(id),i:0,correct:0,streak:0,best:0,gained:0,res:[],hearts:id==='boss'?3:0,done:false};
  let qs;
  if(id==='boss'){const zs=shuffle(QZ).concat(shuffle(QZ).slice(0,BOSSN-QZ.length));const cnt={};zs.forEach(z=>cnt[z]=(cnt[z]||0)+1);qs=[];Object.keys(cnt).forEach(z=>qs=qs.concat(takeFrom(z,cnt[z],false)));qs=shuffle(qs)}
  else qs=takeFrom(id,ROUND,true);
  G.qs=spread(qs).map(prep);
  if(G.reshuffled)setTimeout(()=>toast('¡Has visto todos los retos de esta mesa! Pipeta los ha barajado de nuevo.'),500);
  $('#mapBtn').hidden=false;showQ();
}
function progressBar(){return `<div class="prog" aria-label="Progreso: reto ${G.i+1} de ${G.qs.length}">${G.qs.map((_,k)=>`<span class="pp ${G.res[k]===true?'ok':G.res[k]===false?'ko':k===G.i?'cur':''}"></span>`).join('')}</div>`}
const TAGS={mc:'Elige la respuesta',multi:'Marca todas las correctas',cls:'Clasifica',ord:'Ordena',lbl:'Rotula la célula',mic:'Microscopio',num:'Calcula'};

function showQ(){
  const q=G.qs[G.i];const z=G.z;const zz=zone(q.zone);G.done=false;G.hint=false;
  $('#app').innerHTML=`<section class="play">
   <div class="playhead"><div class="ph-l"><span class="ph-ico">${SPEC[z.spec]()}</span><div><h1>${z.name}</h1><p>Reto ${G.i+1} de ${G.qs.length}${G.streak>=2?`<span class="streak">Racha: ${G.streak}</span>`:''}</p></div></div>
    ${G.id==='boss'?`<div class="hearts" aria-label="${G.hearts} vidas">${[0,1,2].map(k=>ART.heart(k<G.hearts)).join('')}</div>`:''}</div>
   ${progressBar()}
   <article class="qcard" id="qcard">
    <p class="qk">${G.id==='boss'?esc(zz.name)+' · ':''}${TAGS[q.t]}</p>
    ${body(q)}
    <div class="hintbox" id="hintbox" hidden></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="acts"><button class="btn ghost" id="hintBtn" type="button">Pista</button><button class="btn" id="checkBtn" type="button">Comprobar</button></div>
   </article></section>`;
  wire(q);
  $('#hintBtn').onclick=()=>{const h=$('#hintbox');h.hidden=false;G.hint=true;h.innerHTML=`<b>Pista de Pipeta:</b> ${q.hint||defHint(q)} <span class="note">(Con pista, este reto vale 5 muestras.)</span>`;$('#hintBtn').disabled=true};
  $('#checkBtn').onclick=check;
}
function defHint(q){
  const tab={fun:'Funciones vitales',cel:'Células',tip:'Tipos de células',niv:'Niveles',rei:'Cinco reinos'}[q.zone];
  if(q.t==='mic')return 'Primero gira la rueda de enfoque hasta que la muestra se vea nítida. Fíjate en la forma de las células y en sus colores.';
  if(q.t==='lbl')return 'Sigue cada línea hasta el punto negro. La pared rígida es el borde grueso y verde; la membrana es la línea fina naranja.';
  if(q.t==='ord')return 'Toca las tarjetas en orden. Si te equivocas, toca una tarjeta de abajo para devolverla.';
  return `Repasa la pestaña «${tab}» del Cuaderno de laboratorio (botón «Cuaderno», arriba).`;
}

/* ---------- cuerpo de cada tipo de reto ---------- */
function optList(q,multi){return `<div class="opts ${multi?'multi':''}" role="${multi?'group':'radiogroup'}">${q._o.map((o,j)=>`<button type="button" class="opt" role="${multi?'checkbox':'radio'}" aria-checked="false" data-j="${j}"><span class="bx" aria-hidden="true"></span><span>${o.t}</span></button>`).join('')}</div>`}
function body(q){
  const pre=q.ch?chartSVG():'';
  if(q.t==='mc')return `${pre}<div class="qq">${q.q}</div>${optList(q,false)}`;
  if(q.t==='multi')return `${pre}<div class="qq">${q.q}</div>${optList(q,true)}`;
  if(q.t==='cls')return `<div class="qq">${q.q}</div><div class="cls">${q._it.map(([t],r)=>`<div class="crow" data-r="${r}"><span class="it">${t}</span><span class="bins" role="radiogroup" aria-label="${esc(t)}">${q.b.map((b,k)=>`<button type="button" class="bin" aria-pressed="false" data-k="${k}">${b}</button>`).join('')}</span><span class="sol"></span></div>`).join('')}</div>`;
  if(q.t==='ord')return `<div class="qq">${q.q}</div><div class="ordw"><div><p class="ord-lab">Tarjetas (toca en orden):</p><div class="ord-src" id="ordSrc"></div></div><div><p class="ord-lab">Tu orden:</p><div class="ord-dst" id="ordDst"></div></div></div>`;
  if(q.t==='lbl'){const C=CELLS[q.cell];const byN=Object.entries(q._nums).sort((a,b)=>a[1]-b[1]);
    return `<div class="qq">${q.q}</div><div class="lblw"><div class="lblart">${cellSVG(q.cell,q._nums)}</div><div class="lblsel">${byN.map(([p,n])=>`<div class="lrow" data-p="${esc(p)}"><span class="n">${n}</span><select id="sel${n}" aria-label="Parte número ${n}"><option value="">Elige…</option>${q._names.map(x=>`<option value="${esc(x)}">${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}</select><span class="sol"></span></div>`).join('')}</div></div>`}
  if(q.t==='mic')return `<div class="micw"><div class="eyepiece"><div class="view" id="micView">${SPEC[q.spec]()}</div><span class="zoom">${q._zoom}</span></div>
     <div><div class="focus"><label for="focus">Rueda de enfoque</label><input type="range" id="focus" min="0" max="100" value="${q._f}" aria-describedby="fstate"><p class="fstate" id="fstate"></p></div><div class="micq qq">${q.q}</div></div></div>${optList(q,false)}`;
  if(q.t==='num')return `${pre}<div class="qq">${q.q}</div><div class="numrow" data-p="n"><label for="numIn">${q.label||'Tu respuesta'}:</label><input id="numIn" class="numin" inputmode="numeric" autocomplete="off" spellcheck="false"><span class="sol"></span></div>`;
  return '';
}
function wire(q){
  $$('#qcard .opts').forEach(gp=>{const multi=gp.classList.contains('multi');gp.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(G.done)return;
    if(multi)b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');
    else{gp.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked','false'));b.setAttribute('aria-checked','true')}sfx.tap()})});
  $$('#qcard .crow').forEach(row=>row.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(G.done)return;row.querySelectorAll('.bin').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');sfx.tap()}));
  if(q.t==='ord')renderOrd(q);
  if(q.t==='mic'){const r=$('#focus');const upd=()=>{const d=Math.abs(+r.value-q._target);const ok=d<=4;const bl=ok?0:Math.min(12,(d-4)*.32+1.2);$('#micView svg').style.filter=`blur(${bl.toFixed(1)}px)`;const fs=$('#fstate');
      if(ok&&!q._focused){q._focused=true;sfx.focus()}if(!ok)q._focused=false;
      fs.className='fstate'+(ok?' ok':'');fs.textContent=ok?'¡Enfocado! Ahora observa con atención.':d<15?'Casi… gira un poquito más.':'Borroso: mueve la rueda de enfoque.'};
    r.oninput=upd;upd()}
  const ni=$('#numIn');if(ni){ni.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();G.done?next():check()}});if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>ni.focus({preventScroll:true}),60)}
}
function renderOrd(q){
  const src=$('#ordSrc'),dst=$('#ordDst');
  src.innerHTML=q._src.length?q._src.map((t,i)=>`<button type="button" class="chip" data-i="${i}">${t}</button>`).join(''):'<span class="ord-empty">¡Ya has colocado todas!</span>';
  dst.innerHTML=q._dst.length?q._dst.map((t,i)=>`<button type="button" class="chip" data-i="${i}" aria-label="Posición ${i+1}: ${esc(t)}. Toca para quitarla."><span class="n">${i+1}</span><span>${t}</span></button>`).join(''):'<span class="ord-empty">Toca las tarjetas de arriba en el orden correcto.</span>';
  src.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.done)return;const i=+b.dataset.i;q._dst.push(q._src.splice(i,1)[0]);sfx.tap();renderOrd(q);const f=$('#ordSrc .chip');if(f)f.focus({preventScroll:true})});
  dst.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.done)return;const i=+b.dataset.i;q._src.push(q._dst.splice(i,1)[0]);sfx.tap();renderOrd(q)});
}

/* ---------- comprobar ---------- */
function parseInt2(s){const t=String(s).trim().replace(/[.\s]/g,'');if(!/^\d+$/.test(t))return NaN;return parseInt(t,10)}
function check(){
  if(G.done)return;const q=G.qs[G.i];const fb=$('#fb');let ok=false;
  const warn=t=>{fb.className='fb warn';fb.innerHTML=`<div><p class="fbt">Espera…</p><div class="exp">${t}</div></div>`};
  if(q.t==='mc'||q.t==='mic'||q.t==='multi'){
    const bs=$$('#qcard .opt');const sel=bs.map(b=>b.getAttribute('aria-checked')==='true');
    if(!sel.some(Boolean))return warn(q.t==='multi'?'Marca al menos una respuesta.':'Elige una respuesta.');
    if(q.t==='mic'&&!q._focused&&!q._warned){q._warned=true;return warn('La muestra aún está borrosa. ¿Seguro? Enfoca el microscopio o pulsa «Comprobar» otra vez.')}
    ok=q._o.every((o,j)=>o.ok===sel[j]);
    bs.forEach((b,j)=>{b.disabled=true;if(q._o[j].ok)b.classList.add(sel[j]?'right':'missed');else if(sel[j])b.classList.add('wrong')});
    if(q.t==='mic'){$('#focus').disabled=true;$('#micView svg').style.filter='none'}
  }
  if(q.t==='cls'){
    const rows=$$('#qcard .crow');const ans=rows.map(r=>{const p=r.querySelector('.bin[aria-pressed="true"]');return p?+p.dataset.k:-1});
    if(ans.some(a=>a<0))return warn('Te falta clasificar alguna tarjeta.');
    ok=true;rows.forEach((r,i)=>{const good=q._it[i][1];const o=ans[i]===good;if(!o)ok=false;r.classList.add(o?'right':'wrong');r.querySelectorAll('.bin').forEach(b=>b.disabled=true);if(!o)r.querySelector('.sol').innerHTML=`Era: <b>${q.b[good]}</b>`});
  }
  if(q.t==='ord'){
    if(q._src.length)return warn('Coloca todas las tarjetas antes de comprobar.');
    ok=q._dst.every((t,i)=>t===q.items[i]);
    $$('#ordDst .chip').forEach((b,i)=>{b.disabled=true;b.classList.add(q._dst[i]===q.items[i]?'right':'wrong')});
    if(!ok)$('#ordDst').insertAdjacentHTML('afterend',`<p class="note" style="margin-top:6px"><b>Orden correcto:</b> ${q.items.map((t,i)=>(i+1)+'. '+t).join(' · ')}</p>`);
  }
  if(q.t==='lbl'){
    const rows=$$('#qcard .lrow');const v=rows.map(r=>r.querySelector('select').value);
    if(v.some(x=>!x))return warn('Elige un nombre para cada número.');
    ok=true;rows.forEach((r,i)=>{const p=r.dataset.p;const o=v[i]===p;if(!o)ok=false;r.classList.add(o?'right':'wrong');r.querySelector('select').disabled=true;if(!o)r.querySelector('.sol').innerHTML=`Era: <b>${p}</b>`});
  }
  if(q.t==='num'){
    const inp=$('#numIn');if(!inp.value.trim())return warn('Escribe tu respuesta.');
    const n=parseInt2(inp.value);if(isNaN(n))return warn('Escribe solo cifras (puedes usar puntos para separar los miles).');
    ok=n===q.ans;inp.disabled=true;inp.classList.add(ok?'right':'wrong');if(!ok)$('#qcard .numrow .sol').innerHTML=`Solución: <b class="nb">${fmtInt(q.ans)}</b>`;
  }
  G.done=true;G.res[G.i]=ok;
  if(q.zone&&!S.seen[q.zone].includes(q.id))S.seen[q.zone].push(q.id);
  if(ok){G.correct++;G.streak++;G.best=Math.max(G.best,G.streak);const gg=(G.hint?5:10)+(G.streak>=3?5:0);S.coins+=gg;G.gained+=gg;bump();sfx.ok()}
  else{G.streak=0;if(G.id==='boss')G.hearts--;sfx.bad()}
  save();header();$('#mapBtn').hidden=false;
  const praise=[g('¡Muestra perfecta!','¡Muestra perfecta!'),g('¡Toda una científica!','¡Todo un científico!'),'¡Observación impecable!','¡Exacto!','¡Eso merece entrar en el Atlas!','¡Pipeta está aplaudiendo con las alas!'];
  const oops=['¡Casi! Mira la explicación:','Esta muestra se resiste. Fíjate:','Uy, a revisar en el cuaderno:'];
  fb.className='fb '+(ok?'good':'bad');
  fb.innerHTML=`<span class="pip">${ART.pipeta(ok?'happy':'oops')}</span><div><p class="fbt">${ok?pick(praise)+(G.streak>=3?' Racha de '+G.streak+': +5 extra.':''):pick(oops)}</p><div class="exp">${q.exp}</div></div>`;
  const pr=$('.prog');if(pr)pr.outerHTML=progressBar();
  if(G.id==='boss'){const h=$('.hearts');if(h)h.innerHTML=[0,1,2].map(k=>ART.heart(k<G.hearts)).join('')}
  $('#hintBtn').hidden=true;
  const last=G.i===G.qs.length-1||(G.id==='boss'&&G.hearts<=0);
  const b=$('#checkBtn');b.textContent=last?'Ver resultado':'Siguiente reto';b.onclick=next;b.focus({preventScroll:true});
  fb.scrollIntoView({behavior:RM()?'auto':'smooth',block:'nearest'});
}
function next(){
  const last=G.i===G.qs.length-1||(G.id==='boss'&&G.hearts<=0);
  if(last){finish();return}
  G.i++;showQ();window.scrollTo({top:0,behavior:'auto'});
}
function finish(){
  const {id,correct,qs}=G;let stars;
  if(id==='boss')stars=G.hearts>0?G.hearts:0;
  else stars=correct>=7?3:correct>=6?2:correct>=PASS?1:0;
  const bonus=stars*20;S.coins+=bonus;G.gained+=bonus;
  const firstFind=stars>0&&!S.found[id];const improved=stars>S.stars[id];
  if(improved)S.stars[id]=stars;if(firstFind)S.found[id]=true;save();header();
  const z=G.z;
  const msg=stars===3?'¡Tres estrellas! Tienes ojo de microscopio.':stars===2?'¡Muy bien! Te falta muy poco para las tres estrellas.':stars===1?'¡Conseguido! Vuelve a por más estrellas: los retos no se repiten hasta que los veas todos.':(id==='boss'?'La Gran Expedición es el reto más difícil. Repasa el Cuaderno y vuelve a intentarlo.':`Necesitas ${PASS} aciertos para descubrir la especie. ¡Repasa el Cuaderno y vuelve a intentarlo!`);
  const showRes=()=>{
    if(stars>0)sfx.win();
    showOv(`<h2>${stars>0?'¡Mesa superada!':'¡Casi lo tienes!'}</h2>
    <div class="big-stars">${[0,1,2].map(i=>ART.star(i<stars)).join('')}</div>
    <p>${id==='boss'?(G.hearts>0?`Has llegado al final con ${G.hearts} ${G.hearts===1?'vida':'vidas'}.`:'Te has quedado sin vidas.'):`Has acertado ${correct} de ${qs.length}.`} Mejor racha: ${G.best}. Muestras: <b class="gain">+${G.gained}</b></p>
    <p>${msg}${improved&&!firstFind&&stars>0?' ¡Nuevo récord de estrellas!':''}</p>
    <div class="center"><button class="btn ghost" id="again" type="button">Otra ronda aquí</button>${id==='boss'&&S.stars.boss?'<button class="btn ghost" id="seeC" type="button">Ver mi carnet</button>':''}<button class="btn" id="tomap" type="button">Volver al laboratorio</button></div>`);
    $('#again').onclick=()=>{hideOv();start(id)};$('#tomap').onclick=()=>{hideOv();map()};
    const sc=$('#seeC');if(sc)sc.onclick=carnet;
  };
  if(firstFind){
    showOv(`<div class="disc-art">${SPEC[z.spec]()}</div><h2>¡Nueva especie para tu Atlas: ${z.dname}!</h2><p class="note">${z.dtag}</p><p>${personal(BIO[id])}</p>
     <div class="center"><button class="btn" id="okfind" type="button">¡A mi Atlas!</button></div>`);
    confetti();sfx.win();$('#okfind').onclick=()=>{hideOv();setTimeout(showRes,120)};
  }else showRes();
}

/* =========================================================
   ATLAS DE LA BIODIVERSIDAD
   ========================================================= */
function atlas(){
  G=null;header();$('#mapBtn').hidden=false;
  const n=ZID.filter(k=>S.found[k]).length;
  $('#app').innerHTML=`<section><h1>El Atlas de ${NM()}</h1><p class="lead">Especies descubiertas: ${n} de ${ZID.length}. Muestras recogidas: ${S.coins}. Rango: <b>${rank()}</b>.</p>
  ${S.stars.boss?'<div class="center" style="justify-content:flex-start"><button class="btn" id="carnetBtn" type="button">Ver mi carnet de laboratorio</button></div>':''}
  <div class="atlas">${ZONES.map(z=>{const f=S.found[z.id];return `<article class="card ${f?'':'sil'}"><div class="disc-art">${SPEC[z.spec]()}</div><h3>${f?z.dname:'¿Qué será?'}</h3>${f?`<span class="tag">${z.dtag}</span><p>${personal(BIO[z.id])}</p>`:`<p>Supera la ${z.name} para descubrirla.</p>`}</article>`}).join('')}</div>
  <div class="center"><button class="btn ghost" id="reset" type="button">Borrar mi progreso</button><button class="btn" id="back" type="button">Volver al laboratorio</button></div></section>`;
  $('#back').onclick=()=>map();
  const cb=$('#carnetBtn');if(cb)cb.onclick=carnet;
  $('#reset').onclick=()=>{showOv(`<h2>¿Borrar el progreso?</h2><p>Se perderán las estrellas, las muestras y las especies del Atlas de ${NM()}. No se puede deshacer.</p><div class="center"><button class="btn ghost" id="no" type="button">No, mejor no</button><button class="btn danger" id="yes" type="button">Sí, borrar</button></div>`);
    $('#no').onclick=hideOv;$('#yes').onclick=()=>{const nm=S.name,gn=S.gen,snd=S.sound;S=clone(DEF);S.name=nm;S.gen=gn;S.sound=snd;save();hideOv();map(true)}};
}
function carnet(){
  const total=ZID.reduce((a,k)=>a+S.stars[k],0);
  const d=new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
  showOv(`<div class="carnet"><div class="pipc">${ART.pipeta()}</div><h2>Carnet de laboratorio</h2><p>El Laboratorio de las Mil Especies certifica que</p>
   <p class="who">${NM()}</p><p>es <b>${rank()}</b> y ha completado la Gran Expedición de los seres vivos con <b>${total}</b> estrellas de ${ZID.length*3}.</p>
   <p class="note">Firmado: Pipeta, dragoncita ayudante del laboratorio · ${d}</p></div>
   <div class="center"><button class="btn ghost" id="prt" type="button">Imprimir</button><button class="btn" id="cls" type="button">Cerrar</button></div>`,true);
  $('#prt').onclick=()=>window.print();$('#cls').onclick=hideOv;
}

/* =========================================================
   CUADERNO DE LABORATORIO
   ========================================================= */
const TABN={fun:'Funciones vitales',cel:'Células',tip:'Tipos de células',niv:'Niveles',rei:'Cinco reinos'};
function book(tab){
  tab=tab||(G&&G.qs&&G.qs[G.i]&&G.qs[G.i].zone)||'fun';
  showOv(`<div class="book"><h2>Cuaderno de laboratorio de ${NM()}</h2>
  <div class="tabs" role="tablist">${QZ.map(k=>`<button class="tab" type="button" role="tab" aria-selected="${k===tab}" data-k="${k}">${TABN[k]}</button>`).join('')}</div>
  <div class="bookc" role="tabpanel">${BOOK[tab]}</div>
  <div class="center"><button class="btn" id="bookClose" type="button">Cerrar el cuaderno</button></div></div>`,true);
  $$('.tab').forEach(t=>t.onclick=()=>book(t.dataset.k));
  $('#bookClose').onclick=hideOv;
  const sel=$('.tab[aria-selected="true"]');if(sel){sel.scrollIntoView({block:'nearest',inline:'center'});sel.focus({preventScroll:true})}
}

/* =========================================================
   CAPAS, AVISOS Y EFECTOS
   ========================================================= */
let lastFocus=null;
function showOv(html,wide){if(!$('#ovRoot').innerHTML)lastFocus=document.activeElement;$('#ovRoot').innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="ov-card ${wide?'wide':''}">${html}</div></div>`;const b=$('#ovRoot').querySelector('button');if(b)b.focus({preventScroll:true})}
function hideOv(){$('#ovRoot').innerHTML='';if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ovRoot').innerHTML&&($('#bookClose')||$('#cls')))hideOv()});
let tT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2800)}
function confetti(){
  if(RM())return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffb3d4','#cdb8ff','#9ff0e2','#fff1d6','#ffc93c','#ff7fb2'];
  const L=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6}));
  const t0=performance.now();(function f(now){const t=(now-t0)/16.7;x.clearRect(0,0,c.width,c.height);L.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.a+=.2;x.save();x.globalAlpha=Math.max(0,1-t/110);x.translate(q.x,q.y);x.beginPath();x.arc(0,0,q.r/2,0,7);x.fillStyle=q.c;x.fill();x.strokeStyle='rgba(43,35,70,.25)';x.stroke();x.restore()});if(now-t0<2000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);}

/* =========================================================
   ARRANQUE
   ========================================================= */
$('#mapBtn').onclick=()=>{if(G&&G.qs&&(G.i>0||G.done)&&!(G.done&&G.i===G.qs.length-1)&&!(G.id==='boss'&&G.hearts<=0)){showOv(`<h2>¿Volver al laboratorio?</h2><p>Si sales ahora, perderás esta ronda (las muestras ganadas se quedan).</p><div class="center"><button class="btn ghost" id="stay" type="button">Seguir jugando</button><button class="btn" id="leave" type="button">Salir</button></div>`);$('#stay').onclick=hideOv;$('#leave').onclick=()=>{hideOv();map()}}else map()};
$('#bookBtn').onclick=()=>book();
$('#atlasBtn').onclick=()=>{if(G&&G.qs&&(G.i>0||G.done)&&!(G.done&&G.i===G.qs.length-1)&&!(G.id==='boss'&&G.hearts<=0)){showOv(`<h2>¿Ir al Atlas?</h2><p>Si sales ahora, perderás esta ronda (las muestras ganadas se quedan).</p><div class="center"><button class="btn ghost" id="stay" type="button">Seguir jugando</button><button class="btn" id="leave" type="button">Ir al Atlas</button></div>`);$('#stay').onclick=hideOv;$('#leave').onclick=()=>{hideOv();atlas()}}else atlas()};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();header();sfx.tap()};
if(S.name&&S.gen)map();else welcome();
</script>
